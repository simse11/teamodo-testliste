ieler per „… entfernen" wieder lösen','„Tag": Datum und Zeile „Zählt als" (Hinweis „Statt Training" an Trainingstagen, „Extra-Einheit" sonst, „Vergangenes Training" in der Vergangenheit)','„Inhalt" (optional, „Was wird gemacht? z. B. Stabi-Programm, Lauf-Einheit")','Speichern („Individualtraining speichern" im Kopf, Desktop „Erstellen"): Toast „Individualtraining gespeichert"; Zähler „individuell" in der Verfügbarkeit-Zeile des Tages, Spieler im Abschnitt „Individuell" des Verfügbarkeit-Fensters','Mehrere Spieler gleichzeitig; Doppelanlage am selben Tag: Hinweis „Nichts Neues angelegt"',"Aktuell ausgeliehene Spieler fehlen in der Auswahl"],unklar:!1,entfallen:!1},{id:"TER-02",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Individualtraining anlegen und abbrechen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Fenster öffnen, ohne Spieler: Speichern ist gesperrt (Kopfknopf bzw. „Erstellen" ausgegraut)','Ausfüllen und per Schließen/„Abbrechen" verlassen: nichts angelegt','Datum auf einen trainingsfreien Tag und auf einen Trainingstag stellen und „Zählt als" vergleichen','Einstiege außerhalb der Übersicht (gehören zu Spielerprofil und Trainingsdetail): Gruppe „Individualtraining" mit „Eintragen" im Spielerprofil (Reiter „Training"), Zeile „N im Individualtraining" mit Symbol „Individualtraining hinzufügen" in der Spielerliste im Trainingsdetail und „Auf Individualtraining setzen" im Verfügbarkeit-Fenster — je einmal kurz öffnen'],unklar:!1,entfallen:!1},{id:"TER-03",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Individualtraining bearbeiten und löschen (Trainer-Sicht)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Eintrag im Spielerprofil (Reiter „Training", Gruppe „Individualtraining") antippen','Fenster „Individualtraining bearbeiten" (mobil „Bearbeiten"; „Individualtraining vom …"): Datum und „Inhalt" ändern, Toast „Individualtraining aktualisiert"','Löschen (mobil unten, Desktop links im Fuß): Dialog „Individualtraining löschen", abbrechen, dann bestätigen','Im Verfügbarkeit-Fenster: „Auf Individualtraining setzen" und zurück mit „Auf verfügbar zurücksetzen"'],unklar:!1,entfallen:!1},{id:"TER-04",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Spieler: Individualtraining eintragen und bearbeiten",rollen:["SPI"],geraete:["desktop","android","ios"],schritte:['Einstieg A: Plus im Kalender „Individualtraining hinzufügen"; B: Knopf „Individualtraining hinzufügen" unter dem Training im Kalender bzw. „Individualtraining" in „Als Nächstes"; C: Seite „Meine Abwesenheiten", Reiter „Individualtraining", runder Knopf „Individualtraining eintragen"','Fenster „Individualtraining" (ohne Spielerauswahl): „Trag ein, wann du individuell trainierst – statt des Mannschaftstrainings oder zusätzlich."; „Tag"/„Zählt als", „Inhalt" („Optional, dein Trainer sieht es.")','Vergangenes Datum mit Training: Hinweis „Ein vergangenes Mannschaftstraining kann nur dein Trainer nachtragen." (Speichern gesperrt)','An Trainingstag: „Du trainierst statt mit der Mannschaft. Dein Trainer bekommt eine Mitteilung."',"Speichern und abbrechen",'Eigenen Eintrag in Tagesliste oder Reiter antippen: „Bearbeiten", ändern, löschen (Dialog)'],unklar:!1,entfallen:!1},{id:"TER-05",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:'Spieler: Reiter „Individualtraining" in „Meine Abwesenheiten"',rollen:["SPI"],geraete:["desktop","android","ios"],schritte:['Reiter wechseln (URL-Tab), Saison-Karte (Zähler „statt Training" / „zusätzlich"), „Geplant", Monate, Leerzustand „Du hast noch kein Individualtraining eingetragen."','Etikett „statt Training" / „extra" an den Einträgen',"Eintrag öffnen, bearbeiten, löschen","Mit abgeschaltetem Selbsteintragen (ABW-07): kein Knopf, nicht klickbar","Ohne zugeordnete Mannschaft: kein Knopf (Sonderzustand)"],unklar:!1,entfallen:!1},{id:"TER-06",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Sonstigen Termin anlegen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['Plus im Kalender, „Sonstiger Termin"','Fenster „Neuer Termin": Titel („Was steht an? z. B. Mannschaftsabend"), Zeitraum („Beginn", „Ende" jeweils Datum und Uhrzeit)','„Für wen": Mannschaften wählen bzw. „Alle Mannschaften" (nur Owner/Admin/Manager bei mehreren Mannschaften; Hinweis „Gilt für alle N Mannschaften, auch für später angelegte."); bei nur einer Mannschaft feste Anzeige','„Nachricht" („Kurze Nachricht zum Termin …", „Geht als Mitteilung an die gewählten Mannschaften.")','„Erstellen": Toast „Termin erstellt"; Chip „Termin" im Kalender der gewählten Mannschaften; Desktop zweispaltig','Validierung: „Titel erforderlich", „Das Ende muss nach dem Start liegen", „Mindestens eine Mannschaft wählen"'],unklar:!1,entfallen:!1},{id:"TER-07",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Sonstigen Termin anlegen und abbrechen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Fenster „Neuer Termin" ausfüllen und per Schließen/„Abbrechen" verlassen: kein Termin entsteht',"Mehrtägigen Termin anlegen: erscheint an allen Tagen des Zeitraums","Termin ohne Nachricht und mit Nachricht anlegen, Push-Empfang beim Spieler prüfen (nur Handy)"],unklar:!1,entfallen:!1},{id:"TER-08",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Sonstigen Termin bearbeiten und löschen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['Tagesliste: Zeile mit Chip „Termin" antippen (Trainer und SL nur bei selbst angelegten Terminen, Owner/Admin bei allen)','Fenster „Termin bearbeiten": Titel, Zeitraum, „Für wen", Nachricht ändern, speichern: Toast „Termin aktualisiert"','Löschen (mobil unten, Desktop links im Fuß): Dialog „Termin wirklich löschen?", abbrechen, dann bestätigen, Toast „Termin gelöscht"',"Spieler/FT sehen den Termin, aber Zeile nicht klickbar (nur lesen)"],unklar:!1,entfallen:!1},{id:"TER-09",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Gespräch mit Spielern anlegen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['Plus im Kalender, „Gespräch" (Datum vorbelegt); weiterer Einstieg: Gespräche-Symbol an Spielerkarte (TER-12)','Fenster „Neues Gespräch" („Termin mit Spielern und Mitarbeitern"): Gruppe „Termin" mit Datum („Datum wählen") und Uhrzeit','Teilnehmerliste: Suchfeld „Personen filtern" („Spieler oder Mitarbeiter suchen..."), Gruppen „Spieler" (Alle auswählen / Alle abwählen) und „Trainer und Betreuer"; aufklappbar „Weitere aus dem Verein"; Knopf „Mannschaftsrat" hakt Rat-Mitglieder an','Gruppe „Sichtbarkeit": Schalter „Teilnehmer sehen den Termin" (Datum, Uhrzeit, Teilnehmer, Push-Nachricht); steht bei künftigem Termin vorbelegt an, bei vergangenem aus','Ohne Teilnehmer ist „Gespräch anlegen" gesperrt; Desktop-Fuß zeigt „N Personen ausgewählt"','Anlegen: Toast „Gespräch angelegt" mit Aktion „Notizen hinzufügen" (bei vergangenem Termin öffnet sich „Notizen" direkt)',"Abbrechen-Weg prüfen"],unklar:!1,entfallen:!1},{id:"TER-10",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Gespräch mit Mitarbeitern / gemischte Teilnehmer",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['„Neues Gespräch" mit Trainern/Betreuern und mit gemischter Auswahl','Mehrere Personen: im Detail erscheint „Gruppengespräch"','„Mannschaftsrat"-Knopf und „Alle auswählen" kombinieren, einzelne wieder abwählen',"Mit externen Mitarbeitern lassen sich keine Gespräche anlegen (Hinweis im Mitarbeiterprofil)","Anlegen und eine zweite Variante abbrechen"],unklar:!1,entfallen:!1},{id:"TER-11",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Gespräch ansehen, Notizen, bearbeiten, löschen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['Tagesliste: Zeile mit Chip „Gespräch" antippen: Detail-Fenster (Name bzw. „Gruppengespräch"), Gruppen „Termin" (Datum, Uhrzeit, „Teilnehmer sehen den Termin"), „Teilnehmer" (Spieler/Mitarbeiter), „Notizen"','„Notizen hinzufügen"/„Notizen bearbeiten": Fenster „Notizen" („Notizen zum Gespräch..."), „Notizen speichern": Toast „Notizen gespeichert"; Notizen sieht nur der Ersteller','„Termin bearbeiten": Fenster „Termin bearbeiten" (Datum/Uhrzeit/Sichtbarkeit), „Termin speichern"','„Gespräch löschen": Dialog „Gespräch löschen?", abbrechen, dann bestätigen, Toast „Gespräch gelöscht"'],unklar:!1,entfallen:!1},{id:"TER-12",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Gespräche mit einem Spieler (Verlauf)",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['Einstiege: Spielerprofil, Reiter „Gespräche"; in „Meine Favoriten" die Spielerkarte mit Symbol „Spielergespräche anzeigen"; Seite „Gespräche mit <Name>" (`/app/players/conversations/player?...`)','Gruppe „Gespräche": „Geplant" (mit Knopf zum Anlegen, Leertext „Kein Gespräch geplant.") und Monatsgruppen mit Einträgen; Notiz-Vorschau oder „Noch keine Notizen"; Hinweis „Termin für die Teilnehmer sichtbar" bzw. „Termin noch nicht freigegeben"','Eintrag antippen: Detail (TER-11); neues Gespräch mit fest eingestelltem Spieler (Fenster „Neues Gespräch", Zusatz „Gespräch mit <Name>", ohne Teilnehmerliste, schmales Fenster)','Leerzustand „Du hast noch keine Gespräche mit diesem Spieler geführt."',"Seite mit ungültigem Spieler: springt zurück"],unklar:!1,entfallen:!1},{id:"TER-13",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:'Seite „Mitarbeitergespräche"',rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['Seite `/app/staff/conversations` („Mitarbeitergespräche", „Übersicht aller Gespräche mit Mitarbeitern"); im Menü kein Eintrag gefunden — nur per URL erreichbar (siehe Unklarheiten)','Info-Symbol im Titel lesen; Monatsnavigation (Pfeile, Monatsauswahl, „Heute")',"Kalenderraster: Tag mit einem Gespräch öffnet Detail, Tag mit mehreren zeigt Liste darunter (Schließen)",'„Neues Gespräch" (Desktop Knopf, mobil runder Knopf): Fenster „Neues Gespräch"; ein Gespräch bearbeiten',"Ladefehler-Zustand prüfen",'Reiter „Gespräche" im Mitarbeiterprofil: Verlauf wie TER-12 („Du hast noch keine Gespräche mit diesem Mitarbeiter geführt.")'],unklar:!1,entfallen:!0},{id:"TER-14",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Gespräch als eingeladener Teilnehmer",rollen:["SPI","FT"],geraete:["desktop","android","ios"],schritte:['Trainer legt Gespräch mit sichtbarem Termin an (Schalter „Teilnehmer sehen den Termin" an); Teilnehmer sieht Chip „Gespräch" („Gespräch mit <Trainer>") im Kalender und bekommt Push (Push nur Handy)','Zeile antippen: Detail mit „Termin" (Datum, Uhrzeit), „Eingeladen von", „Außerdem dabei"; keine Notizen, kein Bearbeiten/Löschen',"Gespräch ohne Freigabe (Schalter aus) erscheint beim Teilnehmer nicht",'Spieler hat keinen Zugang zur Seite „Gespräche mit …" und keinen Reiter „Gespräche" (Weiterleitung bei URL)'],unklar:!1,entfallen:!1},{id:"TER-15",bereich:"TER",bereichName:"Individualtraining, Sonstige Termine und Gespräche",titel:"Sportlicher Leiter: Termine und Gespräche",rollen:["SL"],geraete:["desktop","android","ios"],schritte:['Plus: „Gespräch" und „Sonstiger Termin" (TER-06, TER-09 kurz durchspielen)','Gesprächs-Verlauf im Spielerprofil (Reiter „Gespräche")/„Meine Favoriten" ansehen; Seite „Mitarbeitergespräche" öffnen','Kein „Individualtraining hinzufügen" im Plus-Menü; im Spielerprofil gibt es für SL keinen Reiter „Training", also auch kein Individualtraining (Verhalten siehe Unklarheiten)',"Sonstigen Termin bearbeiten und löschen (nur selbst angelegte)"],unklar:!1,entfallen:!1},{id:"TRN-01",bereich:"TRN",bereichName:"Training",titel:"Trainingshub ansehen und Einstiege nutzen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Menü „Training“ öffnen. Es erscheinen die Gruppen „Trainingsplan“, „Statistiken“, „Platzbelegung“ und „Übungsdatenbank“.","„Trainingsplan“: Kalenderwoche im Kopf, hervorgehobene nächste Einheit, zweite Einheit. Die Zeile „Letztes Training bewerten“ erscheint nur, wenn Einheiten anstehen und noch Bewertungen offen sind.","Eine Einheit antippen führt zum Training. Der Chip „Übungen x/y“ führt in den Ablauf, „Bewerten“ in die Spielerbewertung.","„Statistiken“ (Meta „30 Tage“): „Ø Anwesenheit“ und „Ø Trainingsnote“. Ohne Training: „In den letzten 30 Tagen hat kein Training stattgefunden.“","Fuß „Trainingsplan öffnen“, „Zur Trainingsstatistik“, „Platzbelegung öffnen“ und „Alle … Übungen durchsuchen“ antippen. Die Zahlen „Eigene“ und „Von Teamodo“ antippen.","„Platzbelegung“: Meta „Heute x von y belegt“, die ersten 3 Plätze, „Mehr anzeigen (n)“ und „Weniger anzeigen“. Ohne Plätze: „Keine Trainingsplätze angelegt“.","Plus bei „Trainingsplan“ („Neues Training“) und bei „Übungsdatenbank“ („Neue Übung“) öffnet gleich den Anlegen-Dialog.","Eine Mannschaft ohne anstehende Trainings wählen: Leerzustand „Keine anstehenden Trainings“ mit „Erstes Training planen“."],unklar:!1,entfallen:!1},{id:"TRN-02",bereich:"TRN",bereichName:"Training",titel:"Trainingsplan ansehen („Nächste“ und „Letzte“)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Hub → „Trainingsplan öffnen“. Seite „Trainingsplan“, das Info-Symbol neben dem Titel öffnet einen Hilfetext.","Umschalter „Nächste“ und „Letzte“. Auf dem Handy auch nach links und rechts wischen.","Die Karten zeigen Schwerpunkt, Zeit und Ort. Bei „Nächste“ dazu Anzahl Übungen, Anwesende und Abwesende, bei „Letzte“ „x/y Übungen bewertet“ und „x/y Spieler bewertet“. „Vollständig“ erscheint, wenn alles bewertet ist.","Zwischen den Trainings erscheinen die Spiele der Mannschaft. Ein Spiel antippen öffnet die Aufstellung.","Der Plan reicht etwa 3 Monate zurück und voraus. „Mehr anzeigen“ und „Weniger anzeigen“ am Listenende.","Mannschaft in der Kopfzeile wechseln. Ohne Mannschaft erscheint „Bitte wähle eine Mannschaft aus, um den Trainingsplan anzuzeigen.“ Leerzustände „Keine kommenden Einheiten geplant.“ mit „Erstes Training planen“ und bei „Letzte“ „Keine vergangenen Einheiten vorhanden.“"],unklar:!1,entfallen:!1},{id:"TRN-03",bereich:"TRN",bereichName:"Training",titel:"Einzelnes Training anlegen („Einmalig“)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Auf „Trainingsplan“ „Neues Training“ antippen (am Handy der runde Aktionsknopf, am Desktop der Knopf rechts oben). Alternativ im Hub das Plus bei „Trainingsplan“.","Dialog „Neues Training“. Umschalter auf „Einmalig“ (Standard ist „Jede Woche“).","Bei mehreren Mannschaften erscheint „Mannschaft“ → „Team“. Bei nur einer steht „Mannschaft: …“ als Hinweis.","Gruppe „Wann“: „Datum“ und „Von – bis“. Die Endzeit folgt dem Beginn (Standard 90 Minuten).","Gruppe „Wo“: am Handy Zeile „Ort“ mit Plätzen zur Auswahl, am Desktop die Plätze als Liste. Oder „Anderer Ort …“ und frei eintippen. Gesperrte Plätze fehlen.","„Mehr“ aufklappen (am Desktop gleich offen): „Schwerpunkt“ und „Notizen“.","„Erstellen“ (am Handy der Haken im Kopf). Es erscheint die Meldung „Training erstellt“, das Training steht im Plan.","Die Vorbelegung von Zeit und Ort entspricht dem letzten Training der Mannschaft (solange die Zeiten unverändert sind)."],unklar:!1,entfallen:!1},{id:"TRN-04",bereich:"TRN",bereichName:"Training",titel:"Wöchentliche Serie anlegen („Jede Woche“)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["„Neues Training“ öffnen. Umschalter auf „Jede Woche“ (Standard).","„Beginn“, „Von – bis“ und „Bis“ setzen. Das Enddatum ist standardmäßig Saisonende.","Die Zusammenfassung „Legt n Trainings an, jeden … bis …“ prüfen.","Bei Feiertagen oder Spielen erscheint „Auf diese Termine achten“. Die Schalter sind standardmäßig aus (Termin wird übersprungen), Einschalten legt ihn trotzdem an. Die Zahl in der Zusammenfassung ändert sich („n übersprungen“).","Fehlerfälle: „Das Ende liegt vor dem Beginn“, „Eine Serie läuft höchstens zwei Jahre.“, „Alle Termine sind abgewählt.“ (nur wenn jeder Termin einen Hinweis trägt).","Der Knopf am Desktop heißt „n Trainings anlegen“. Danach erscheint die Meldung „Serie erstellt“.","Prüfen, dass die Serie im Plan auftaucht. Schwerpunkt und Notizen gibt es bei Serien nicht."],unklar:!1,entfallen:!1},{id:"TRN-05",bereich:"TRN",bereichName:"Training",titel:"Training anlegen und abbrechen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["„Neues Training“ öffnen, Daten eintippen (einmal als „Einmalig“, einmal als „Jede Woche“).","Dialog schließen: Handy mit X oder Wegwischen, Desktop mit „Abbrechen“ oder Esc.","Prüfen, dass nichts angelegt wurde.","Dialog erneut öffnen und notieren, ob die Felder zurückgesetzt sind (im Code wird das Formular nur nach dem Erstellen geleert).","Fehler testen: bei mehreren Mannschaften „Erstellen“ ohne Team (Meldung „Mannschaft erforderlich“)."],unklar:!1,entfallen:!1},{id:"TRN-06",bereich:"TRN",bereichName:"Training",titel:"Einzelnes Training bearbeiten",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training im Plan öffnen. Oben Stift „Training bearbeiten“ antippen.","Dialog „Training bearbeiten“: „Datum“, „Von – bis“, „Wo“ (Platz oder „Anderer Ort …“), „Mehr“ (Schwerpunkt, Notizen).","„Speichern“ (am Handy der Haken im Kopf). Es erscheint die Meldung „Training aktualisiert“.","Das Training zeigt die neuen Werte im Kopf der Seite.","Mit „Abbrechen“ oder X schließen. Es bleibt alles unverändert."],unklar:!1,entfallen:!1},{id:"TRN-07",bereich:"TRN",bereichName:"Training",titel:"Serientraining bearbeiten („Nur dieses“ und „Ganze Serie“)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Ein Training einer Serie öffnen → Stift. Umschalter „Nur dieses“ und „Ganze Serie“.","„Nur dieses“: Hinweis „löst sich dabei aus der Serie“. Zeit oder Platz ändern, speichern.","„Ganze Serie“: Zeit oder Platz ändern. Bei neuem Datum verschiebt sich die ganze Serie um denselben Versatz. Hinweistext lesen.","Die Meldungen „Training aktualisiert“ und „Serie aktualisiert“ erscheinen. Im Trainingsplan stichprobenartig prüfen.","Bei „Ganze Serie“ fehlen „Schwerpunkt“ und „Notizen“."],unklar:!1,entfallen:!1},{id:"TRN-08",bereich:"TRN",bereichName:"Training",titel:"Einzelnes Training löschen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training öffnen → Stift. Im Dialog „Training löschen“ antippen (Handy unten im Formular, Desktop links im Fuß).","Rückfrage „Training löschen?“ mit Datum, Zeit und Ort.","Einmal abbrechen, dann „Training löschen“ bestätigen.","Die Meldung „Training gelöscht“ erscheint. Man landet auf der Seite davor (Plan bzw. Hub), das Training ist weg."],unklar:!1,entfallen:!1},{id:"TRN-09",bereich:"TRN",bereichName:"Training",titel:"Serientraining löschen („Nur diesen Termin“ und „Diesen und alle folgenden“)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Serientraining öffnen → Stift → „Training löschen“.","Dialog „Training löschen“ mit der Frage „Was soll gelöscht werden?“.","„Nur diesen Termin“: der Hinweis nennt die übrigen Trainings. Bestätigen.","Eine andere Serie wählen: „Diesen und alle folgenden“. Die Zahl im Knopf („n Trainings löschen“) und der Hinweis „frühere Trainings bleiben bestehen“ stimmen.","Beim ersten Termin der Serie erscheint „die ganze Serie wird gelöscht“.","Die Meldung „Trainings gelöscht“ erscheint."],unklar:!1,entfallen:!1},{id:"TRN-10",bereich:"TRN",bereichName:"Training",titel:"Trainingsdetail ansehen (Aufbau)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training im Plan antippen. Seite „Training“ mit Datum und Uhrzeit, darunter Schwerpunkt und Ort (falls gesetzt).","Handy: Tabs „Spieler“, „Ablauf“, „Notizen“ (Start auf „Spieler“) und Wischen zwischen den Tabs.","Desktop: zwei Spalten. Links „Spieler (n)“ und „Notizen“ im Wechsel, rechts „Trainingsablauf“.","Oben die Symbole „Training bearbeiten“ und „Training exportieren“.","Zurück-Pfeil führt zur vorherigen Seite (Plan bzw. Hub).","Unbekannte Adresse bzw. nicht vorhandenes Training: Meldung „Training nicht gefunden“ mit „Zurück zum Trainingsplan“."],unklar:!1,entfallen:!1},{id:"TRN-11",bereich:"TRN",bereichName:"Training",titel:"Spielerliste und Anwesenheit im Training",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Tab „Spieler“. Positionsfilter „Alle (n)“ und die einzelnen Positionen. Der Filter wählt, Zählung prüfen.","Gruppen: „Anwesend (n)“, „Aushilfe (n)“ (Spieler dieser Mannschaft, die woanders aushelfen), „Gastspieler (n)“, „Individualtraining (n)“, „Abwesend (n)“. Der Link „n im Individualtraining“ springt nach unten.","Pro Spieler (nur OWN/TRA): Kalender-X-Symbol öffnet den Abwesenheits-Dialog (Datum vorbelegt, Dialog wieder schließen oder eintragen). Hantel-Symbol „Individualtraining hinzufügen“ öffnet den Individualtraining-Dialog.","„Individualtraining entfernen“ (X) in der Gruppe „Individualtraining“.","Bei Abwesenden „Trotz Abwesenheit zum Training hinzufügen“ (Plus-Symbol). War der Spieler nur an diesem Tag abwesend, wird die Abwesenheit gelöscht (Meldung „Spieler wieder anwesend“). Bei längerer Abwesenheit erscheint „Spieler hinzugefügt“ und er steht als Gast.","Nach dem Training: Notenbogen je Spieler und die Leiste „n von m bewertet“ (siehe TRN-21).","Sonderzustände (Aushilfe, Individualtraining, Abwesende) brauchen passende Testdaten."],unklar:!1,entfallen:!1},{id:"TRN-12",bereich:"TRN",bereichName:"Training",titel:"Gastspieler hinzufügen und entfernen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Tab „Spieler“ → „Gastspieler“ (Knopf neben „Anwesend“). Dialog „Gastspieler“ (am Desktop „Gastspieler hinzufügen“).","Suchfeld „Name eingeben oder suchen“. Gruppe „Mit Profil“ (Spieler wählen) und Gruppe „Ohne Profil“ („…“ als Gast eintragen).","Gewählten Gast sehen, „Anderen Gast wählen“, Feld „Notiz“ (optional).","„Hinzufügen“. Meldung „Gastspieler hinzugefügt“. Der Gast steht in der Gruppe „Gastspieler (n)“.","Gast mit X entfernen (Meldung „Eintrag entfernt“).","Dialog abbrechen ohne zu speichern. Spieler, die schon im Training stehen, fehlen in der Liste (Hinweis unter der Liste)."],unklar:!1,entfallen:!1},{id:"TRN-13",bereich:"TRN",bereichName:"Training",titel:"Ablauf: Block hinzufügen („Hinzufügen“)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Tab „Ablauf“ → „Hinzufügen“ (bei leerem Ablauf „Ersten Block hinzufügen“, Leerzustand „Noch keine Übungen“).","Dialog „Hinzufügen“. Textfeld „Was steht an?“. Eintippen sucht in „Meine“ und „Teamodo“, bei leerem Feld erscheint „Zuletzt benutzt“.","Eine Übung antippen: Name und Dauer landen im Feld („Aus deiner Sammlung“ bzw. „Aus der Teamodo-Sammlung“). Erst „Zum Ablauf hinzufügen“ trägt sie ein.","Freien Text eintragen (z. B. „4 gegen 2“): Dauer mit „5 Minuten weniger/mehr“ einstellen. Schalter „In Sammlung speichern“ (dann auch „Foto“) und „Notiz“ optional.","Danach zeigt „Schon im Ablauf“ die Blöcke mit Gesamtdauer, das Feld heißt „Nächster Block“.","„Alle Übungen durchsuchen“ führt in die Übungsdatenbank im Hinzufügen-Modus (siehe UDB-12).","Weitere Blöcke hintereinander eintragen, dann „Fertig“ (am Handy der Haken). Nach dem Training ist „Hinzufügen“ ausgeblendet."],unklar:!1,entfallen:!1},{id:"TRN-14",bereich:"TRN",bereichName:"Training",titel:"Ablauf: Block ansehen, bearbeiten, verschieben und entfernen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Ablauf mit mindestens einer Übung aus der Datenbank und einem Freitext-Block.","Übungs-Block antippen öffnet die Übungsansicht. Freitext-Block antippen öffnet (vor dem Trainingsende) „Freitext-Block bearbeiten“ (Titel, Bemerkungen (optional), Dauer (Min), „Speichern“, „In Sammlung speichern“).","Menü „Weitere Aktionen für …“ (⋯): „Übung öffnen“ (nur Datenbank-Übung), „Bearbeiten“ (nur Freitext, vor dem Ende), „Teams einteilen“/„Teams bearbeiten“, „Bewerten“/„Bewertung ändern“ (nur nach dem Training), „Aus dem Ablauf entfernen“.","Block verschieben: am Desktop mit der Maus ziehen, am Handy lang drücken und ziehen. Den Block unten ziehen verändert die Dauer.","In eine leere Stelle des Rasters tippen/klicken öffnet „Hinzufügen“ an dieser Minute.","Beim Entfernen erscheint ohne Rückfrage die Meldung „Übung entfernt“.","Nach dem Training fehlen „Hinzufügen“, das Antippen leerer Stellen und das Freitext-Bearbeiten. Ob Ziehen noch geht, notieren."],unklar:!1,entfallen:!1},{id:"TRN-15",bereich:"TRN",bereichName:"Training",titel:"Teams einteilen (Listenansicht, Handy oder schmales Fenster)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Im Ablauf bei einer Übung „Teams einteilen“ (gestrichelter Knopf im Block oder ⋯-Menü). Dialog „Teams einteilen“ mit Übungsname.","Oben die Teams als Knöpfe mit Zahl, daneben je ein Pokal-Knopf. „Team hinzufügen“ (+) legt ein Team an.","Liste „Anwesend · n“ (rechts „n ohne Team“). Pro Spieler Team setzen: bis 3 Teams über farbige Kreise, ab 4 Teams über das Menü „Team für … wählen“ mit „Kein Team“.","„Zufällig“ verteilt die Anwesenden (erst ab 2 Teams aktiv).","Team-Knopf antippen: Dialog „Team bearbeiten“ mit Name und „Farbe“, „Team entfernen“ mit Rückfrage, „Übernehmen“.","Bereich „Individualtraining (n)“ listet Spieler, die nicht eingeteilt werden.","Speichern mit Haken im Kopf (Handy) bzw. beim Schließen (Desktop speichert automatisch). Die Meldung „Teams gespeichert“ erscheint nur, wenn andere Übungen zum Übernehmen da sind.","Im Block erscheinen die Team-Pillen (Zahlen)."],unklar:!1,entfallen:!1},{id:"TRN-16",bereich:"TRN",bereichName:"Training",titel:"Teams-Tafel mit Ziehen und Ablegen",rollen:["OWN","TRA"],geraete:["desktop"],schritte:["„Teams einteilen“ öffnen. Breiter Dialog mit Tafel: Spalte „Ohne Team“ und je Team eine Karte.","Spieler per Drag und Drop zwischen „Ohne Team“ und den Teams ziehen. Hinweis „Alle sind eingeteilt“.","Teamkarten per Ziehen umsortieren. Plus legt ein Team an. „Zufällig“ und „Aus Übung holen“ stehen über der Tafel.","Pokal-Knopf pro Team „… als Gewinner markieren“. Er ist erst aktiv, wenn jedes Team mindestens einen Spieler hat.","Esc, X oder Klick daneben speichert. Es gibt am Desktop keinen Speichern-Knopf.","Fenster schmaler als 1280 px ziehen: Wechsel zur Liste aus TRN-15."],unklar:!1,entfallen:!1},{id:"TRN-17",bereich:"TRN",bereichName:"Training",titel:"Teams aus anderer Übung holen und übernehmen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training mit mindestens zwei Übungen, bei einer sind schon Teams eingeteilt.","In einer anderen Übung „Teams einteilen“. Vorschlag „Wie in „…““ mit „Übernehmen“ und „Andere Übung“ (nur bei mehreren Quellen).","„Aus Übung holen“ öffnet „Einteilung holen aus“. Eine Übung antippen.","Nach dem Speichern erscheint die Meldung „Teams gespeichert“ mit „Auch für die anderen n“ bzw. „Auswählen“.","„Auswählen“ öffnet „Teams übernehmen für“. Übungen ankreuzen (Zeilen mit Teams: „wird ersetzt“), Haken im Kopf.","Übungen mit gesetztem Gewinner tauchen nicht als Ziel auf. Leere Liste: „Keine passende Übung in diesem Training.“"],unklar:!1,entfallen:!1},{id:"TRN-18",bereich:"TRN",bereichName:"Training",titel:"Gewinner im Training festhalten",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Übung mit mindestens zwei besetzten Teams. Im Block auf die Team-Pillen (bzw. Punkte) tippen. Es öffnet sich die kleine Karte „Teams“ mit den Mitgliedern je Team.","Pokal bei einem Team setzen („… als Gewinner“). Der Block zeigt den Pokal.","Pokal erneut antippen entfernt den Gewinner.","Sonderfall: ein Team ohne Spieler. Hinweis „Den Pokal gibt es, sobald jedes Team mindestens einen Spieler hat.“","Mit gesetztem Gewinner bleiben die Teams änderbar. Die Übung wird aber bei „Teams übernehmen“ nicht überschrieben (siehe TRN-17).","„Bearbeiten“ (Stift) oben in der Karte öffnet wieder „Teams einteilen“. Auch dort lässt sich der Gewinner setzen und entfernen."],unklar:!1,entfallen:!1},{id:"TRN-19",bereich:"TRN",bereichName:"Training",titel:"Notizen zum Training",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Tab „Notizen“ (Desktop: links „Notizen“). Feld „Notizen, Beobachtungen, To-Dos...“.","Text eintippen. Nach kurzer Pause erscheint „Speichert...“ bzw. ein Gespeichert-Hinweis.","Seite verlassen und das Training erneut öffnen. Der Text ist noch da."],unklar:!1,entfallen:!1},{id:"TRN-20",bereich:"TRN",bereichName:"Training",titel:"Übung im Training bewerten (Sterne)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training, dessen Endzeit vorbei ist, mit Übungen im Ablauf. Hub-Chip „Übungen x/y“ führt direkt hierher.","Beim Block „Bewerten“ (Sterne) antippen oder ⋯ → „Bewerten“. Dialog „Übung bewerten“.","Frage „Wie lief die Übung?“ mit Sternen, Feld „Bemerkungen (optional)“.","Speichern: Meldung „Bewertung gespeichert“, im Block erscheinen die Sterne.","Später ändern („Bewertung ändern“).","Im Trainingsplan zeigt „Letzte“ den Fortschritt, bei vollständiger Bewertung die Karte „Vollständig“."],unklar:!1,entfallen:!1},{id:"TRN-21",bereich:"TRN",bereichName:"Training",titel:"Spieler im Training bewerten („Training bewerten“)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Beendetes Training, Tab „Spieler“: Leiste „n von m bewertet“ mit „Bewerten“, „Weiter bewerten“ oder „Ansehen“. Alternativ auf den Notenbogen eines Spielers tippen.","Dialog „Training bewerten“: Teilnehmerleiste oben. Note wählen (nochmaliges Antippen nimmt sie zurück), Feld „Notiz“ („Was ist dir aufgefallen?“).","Knöpfe „Überspringen“ und unten „Erst Note wählen“ → „Weiter zu <Name>“ → „Abschließen“. Am Desktop zusätzlich „Speichern“, am Handy der Haken im Kopf. Gespeichert wird beim Weitergehen.","Abschlussansicht „Alle n bewertet“ bzw. „n von m bewertet“ mit Ø Trainingsnote und „Noch offen“. Einen Spieler daraus antippen, Note ändern. „Zurück zum Training“.","Bewertung auch für Gastspieler testen.","Direktlink aus dem Hub („Bewerten“ in „Letztes Training bewerten“) öffnet den Dialog gleich.","Der Hinweis zum Trainerteam (nur intern sichtbar) wird angezeigt."],unklar:!1,entfallen:!1},{id:"TRN-22",bereich:"TRN",bereichName:"Training",titel:"Training exportieren (PDF)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Im Training oben auf „Training exportieren“ tippen. Meldung „Erstelle PDF...“.","Erwartung: Druckvorschau öffnet sich, danach die Meldung „Druckvorschau geöffnet“.","Desktop: Pop-up-Blocker prüfen („Pop-up blockiert“ bei gesperrten Pop-ups).","Handy (nativ): Druck-/Teilen-Dialog des Betriebssystems erscheint.","Inhalt: Spieler, Gäste, Ablauf, Teams der Übungen, Wappen.","Auch mit leerem Ablauf und ohne Spieler testen."],unklar:!1,entfallen:!1},{id:"TRN-23",bereich:"TRN",bereichName:"Training",titel:"Mehrere Mannschaften im Training (Trainer mit mehr als einem Team)",rollen:["TRA"],geraete:["desktop","android","ios"],schritte:["Trainer mit zwei Mannschaften. Hub und Trainingsplan zeigen nur die gewählte Mannschaft. Wechsel in der Kopfzeile.","„Neues Training“ zeigt „Mannschaft“ → „Team“ zur Auswahl. Bei nur einem Team steht „Mannschaft: …“ als Hinweis.","Auswahl des Teams wechselt Platz-Vorbelegung (Zeit und Ort des letzten Trainings dieses Teams).","Sonst identisch zu OWN, nur weniger Mannschaften sichtbar."],unklar:!1,entfallen:!1},{id:"TRN-24",bereich:"TRN",bereichName:"Training",titel:"Gesten und Zurück (Handy)",rollen:["OWN","TRA"],geraete:["android","ios"],schritte:["Hub und Trainingsplan: Pull-to-Refresh nach unten ziehen, Daten laden neu.","Trainingsplan: zwischen „Nächste“ und „Letzte“ wischen.","Trainingsdetail: zwischen „Spieler“, „Ablauf“ und „Notizen“ wischen. Im Ablauf soll Wischen die Blöcke nicht versehentlich verschieben (Blöcke erst nach langem Drücken).","Zurück-Wischen (iOS) bzw. Zurück-Taste (Android) von Detail → Plan → Hub.","Aus „Übung hinzufügen“ (Hinzufügen-Modus) zurück geht in den Ablauf des Trainings.","Positionsfilter in der Spielerliste wischt waagerecht, ohne den Tab zu wechseln."],unklar:!1,entfallen:!1},{id:"TRN-25",bereich:"TRN",bereichName:"Training",titel:"Benachrichtigung zu Training (Push)",rollen:["OWN","TRA","SPI"],geraete:["android","ios"],schritte:["Auf einem Gerät ist ein Spieler mit aktiviertem Push angemeldet, auf dem anderen legt der Trainer Aktionen an.","Auslöser testen: Training neu anlegen (einzeln und Serie), Zeit/Ort ändern (einzeln und Serie), Training löschen (einzeln und „Diesen und alle folgenden“), Platz in der Platzbelegung ändern.","Erwartung: Spieler erhält passende Mitteilung. Tippen darauf öffnet die App.","Hängt von Push-Berechtigung und Testkonten ab."],unklar:!1,entfallen:!1},{id:"TRN-26",bereich:"TRN",bereichName:"Training",titel:"Sportlicher Leiter im Training",rollen:["SL"],geraete:["desktop","android","ios"],schritte:["Menü „Training“ öffnen: der Block „Trainingsplan“ fehlt, sichtbar bleiben „Statistiken“, „Platzbelegung“ und „Übungsdatenbank“.","Fuß der Platzbelegung heißt „Platzbelegung verwalten“.","Adresse `/app/training/schedule` oder `/app/training/<id>` direkt aufrufen: „Zugriff verweigert“.","Trainings sind nur als Termine in der Übersicht zu sehen (nicht anklickbar zum Inhalt).","Ob SL über andere Wege (Übersicht-Kalender) Trainings anlegen darf, bewusst mitprüfen."],unklar:!1,entfallen:!1},{id:"TRN-27",bereich:"TRN",bereichName:"Training",titel:"Spieler und Funktionsteam ohne Zugang zum Training",rollen:["SPI","SPI-K","FT"],geraete:["desktop","android","ios"],schritte:["Menü: „Training“ ist nicht vorhanden (Spieler/FT sehen z. B. Übersicht, Spiele, Mannschaftskasse).","Direkter Aufruf von `/app/training`, `/app/training/exercises`, `/app/training/occupancy`, `/app/training/analytics`: „Zugriff verweigert“.","Trainingstermine erscheinen für Spieler in der Übersicht (Kalender). Nur ansehen, kein Training-Detail mit Ablauf."],unklar:!1,entfallen:!1},{id:"STA-01",bereich:"STA",bereichName:"Trainingsstatistik",titel:"Trainingsstatistik öffnen und Zeitraum wählen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Hub → „Zur Trainingsstatistik“. Seite „Trainingsstatistik“ mit Mannschaft und „n Einheiten“ in der Beschreibung. Info-Symbol lesen.","Zeitraum-Chips „7 T“, „30 T“, „90 T“, „Saison“, „Datum“. Bei „Datum“ erscheint der Bereichs-Auswähler. Von/Bis wählen.","Tabs „Anwesenheit“, „Übungen“, „Noten“ (der gewählte Tab bleibt beim Neuladen in der Adresse).","Hub-Gruppe „Statistiken“ (Meta „30 Tage“): „Ø Anwesenheit“ und „Ø Trainingsnote“ mit „30 T“ der Seite vergleichen. Beide Zahlen müssen gleich sein.","Leerzustände: keine Mannschaft („Mannschaft auswählen“), Team ganz ohne Einheiten („Hier entstehen deine Statistiken“ mit Knopf „Erstes Training anlegen“), Zeitraum ohne Einheit („Keine Trainingseinheit im Zeitraum“).","Mannschaft wechseln und Zahlen prüfen."],unklar:!1,entfallen:!1},{id:"STA-02",bereich:"STA",bereichName:"Trainingsstatistik",titel:"Statistik Tab „Anwesenheit“",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Kennzahl „Ø Anwesenheit“.","Gruppe „Anwesenheit“: Sortierung „Anwesenheit“, „Individuell“ (nur wenn Individualtraining existiert), „Name“. Zeile antippen öffnet das Spielerprofil. „Alle n Spieler“ klappt auf, „Weniger anzeigen“.","Gruppe „Warum gefehlt wurde“: Grund antippen klappt die betroffenen Spieler mit Anzahl auf.","Gruppe „Zahlt sich das Training aus?“: Umschalter „Anwesenheit“ und „Note“ (Note nur bei Bewertungen). Listen „Trainiert viel, spielt wenig“ und „Spielt viel, trainiert wenig“. Spieler antippen.","Gruppe „Rekorde“: „Längste Serie am Stück“, bei Zeitraum „Saison“ zusätzlich „Anwesenheit nach dem Spiel“.","Zeitraum wechseln und prüfen, dass sich alles mitändert.","Gruppen ohne Daten fehlen oder zeigen Hinweistexte („Im Zeitraum hat kein Spieler eine gewertete Einheit.“)."],unklar:!1,entfallen:!1},{id:"STA-03",bereich:"STA",bereichName:"Trainingsstatistik",titel:"Statistik Tab „Übungen“",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Kennzahlen „Übungen“ und „Duelle“.","Gruppe „Übungen“: Sortierung „Häufigkeit“, „Note“ (nur wenn bewertet), „Minuten“, „Name“. „Alle n Übungen“ ausklappen.","Gruppe „Duelle im Training“: Bilanz pro Spieler, „Alle n Spieler“, Spieler antippen.","Gruppe „Rekorde“ mit „Duell-König“.","Platzhalter ohne Daten: Übungen („Trag im Training deine Übungen ein…“) und Duelle (Text je nachdem, ob Teams eingeteilt, aber kein Sieger gesetzt wurde).","Duell-Daten entstehen nur, wenn im Training Gewinner gesetzt wurden (siehe TRN-18)."],unklar:!1,entfallen:!1},{id:"STA-04",bereich:"STA",bereichName:"Trainingsstatistik",titel:"Statistik Tab „Noten“",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Tab „Noten“. Kennzahl „Ø Trainingsnote“.","Gruppe „Trainingsnoten“: Spielerzeilen mit Note und Anzahl Bewertungen. „Alle n Spieler“ ausklappen, Spieler antippen.","Platzhalter „Bewerte nach dem Training deine Spieler…“, wenn keine Bewertungen existieren.","Zeitraum wechseln."],unklar:!1,entfallen:!1},{id:"STA-05",bereich:"STA",bereichName:"Trainingsstatistik",titel:"Statistik als Sportlicher Leiter",rollen:["SL"],geraete:["desktop","android","ios"],schritte:["Hub → „Statistiken“ → „Zur Trainingsstatistik“. Es gibt nur die Tabs „Anwesenheit“ und „Übungen“, den Tab „Noten“ nicht.","Hub-Gruppe zeigt nur „Ø Anwesenheit“, keine Trainingsnote.","Adresse mit `?tab=noten` aufrufen: Seite fällt auf „Anwesenheit“ zurück.","Leere Gruppen zeigen neutrale Sätze („Im Zeitraum gab es keine Duelle.“) statt der Einladungs-Platzhalter.","Im Erstbesuch („Hier entstehen deine Statistiken“) fehlt der Knopf „Erstes Training anlegen“.","Gruppe „Zahlt sich das Training aus?“ hat keinen Umschalter „Note“."],unklar:!1,entfallen:!1},{id:"UDB-01",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Übungsdatenbank ansehen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["Hub → „Alle n Übungen durchsuchen“ (oder Zahl „Eigene“/„Von Teamodo“). Seite „Übungen“ mit Info-Symbol.","Kacheln in Spalten (mobil 2, Desktop mehr). Teamodo-Übungen tragen das Teamodo-Logo. Bei aktiven Filtern steht „n Übungen“ vor den Filter-Chips.","Leere Datenbank: „Noch keine Übungen vorhanden. Leg deine erste Übung an!“ mit „Erste Übung anlegen“.","Kein Treffer: „Keine Übungen gefunden. Versuche andere Filter.“","„Neue Übung“ (am Handy der Aktionsknopf im Seitenkopf, am Desktop der Knopf rechts oben) oder das Hub-Plus „Neue Übung“ öffnet den Anlegen-Dialog (UDB-05/06)."],unklar:!1,entfallen:!1},{id:"UDB-02",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Übungen suchen und nach Phase wählen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["Suchfeld „Übung suchen“: Namen eintippen, Treffer-Zahl prüfen.","Phasen-Chips „Alle“, „Erwärmung“, „Hauptteil“, „Schluss“, „Torwart“. Es gilt immer genau ein Chip, zum Lösen „Alle“ antippen.","Wechsel zwischen Feld-Phasen und „Torwart“ setzt Übungsart- und Torhüter-Filter zurück.","Kombination aus Suche und Phase.","Seite verlassen und zurückkehren: Der Filter bleibt gespeichert (im Hinzufügen-Modus nicht)."],unklar:!1,entfallen:!1},{id:"UDB-03",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Übungen filtern und Filter wieder lösen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["Knopf „Filter“ (Zähler der aktiven Filter): am Handy öffnet er den Drawer „Filter“ (Haken „Filter übernehmen“, unten „Filter zurücksetzen“), am Desktop ein Fenster am Knopf.","Abschnitte: „Übungsart“, „Quelle“ (Alle/Teamodo/Verein/Meine), „Mit wie vielen Spielern?“ („Ich habe heute“ mit Stepper, bei Phase „Torwart“ nicht vorhanden), „Altersgruppe“, „Dauer“ (Egal bis über 30 Min).","„Mehr Filter“: „Intensität“ (Bereich), „Torhüter“ bzw. „Benötigte Torhüter“ (bei Phase „Torwart“).","Handy: Anzeige „n Übungen passen“ im Drawer-Kopf. Aktive Filter erscheinen als Chips unter der Suche, jeder Chip hat „… entfernen“.","„Filter zurücksetzen“ (Suche und Phase bleiben). Danach sind alle Kacheln wieder da."],unklar:!1,entfallen:!1},{id:"UDB-04",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Übung ansehen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["Kachel antippen öffnet die Übungsansicht.","Medium oben: Bild, eingebetteter Link (z. B. YouTube) oder PDF („PDF in neuem Tab öffnen“). Je nach Übung vorhanden.","Gruppe „Auf einen Blick“ (Dauer, Spieler, Torhüter, Feld, Intensität).","Textgruppen „Ziel“, Abschnitte (z. B. „Organisation“, „Ablauf“, „Coaching-Punkte“), „Material“, „Geeignet für“.","Bei eigener Übung ist unten „Bearbeiten“ sichtbar, bei Teamodo-Übungen nicht.","Schließen mit X, Wegwischen oder Esc."],unklar:!1,entfallen:!1},{id:"UDB-05",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Übung anlegen (Handy, Assistent in 4 Schritten)",rollen:["OWN","TRA","SL"],geraete:["android","ios"],schritte:["Seiten-Aktionsknopf „Neue Übung“ oder Hub-Plus. Dialog „Neue Übung“ („Schritt 1 von 4“).","Schritt 1: „Wie heißt die Übung?“, Auswahl Feld/Torwart, „Zeig, wie sie aussieht“ (Kacheln „Foto“, „Galerie“, „Link“, siehe UDB-09). „Weiter“.","Schritt 2: „Wann setzt du sie ein?“ (Phase), „Was trainiert sie?“ (Übungsart), „Für wen passt sie?“ (optional). „Überspringen“ oder „Weiter“.","Schritt 3: „Die Eckdaten“ mit Dauer, Spieler, Torhüter, Feld, Intensität. „Überspringen“ oder „Weiter“.","Schritt 4: „Wie läuft sie ab?“ (Stichpunkte je Abschnitt), „Material“. „Übung speichern“.","Der Haken im Kopf („Übung speichern“) speichert ab dem Namen jederzeit, auch vor Schritt 4.","Abschluss „Angelegt!“ mit „Übung ansehen“ und „Noch eine anlegen“. Meldung „Noch offen: …“ prüfen.","Zurück-Pfeil im Kopf geht einen Schritt zurück."],unklar:!1,entfallen:!1},{id:"UDB-06",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Übung anlegen (Desktop, Formular)",rollen:["OWN","TRA","SL"],geraete:["desktop"],schritte:["„Neue Übung“ öffnen. Dialog „Neue Übung“, Untertitel „Nur der Name ist Pflicht.“","Links: Medien-Feld, Name, „Für“ (Feld/Torwart), „Phase“, „Übungsart“, Gruppe „Eckdaten“, Gruppe „Material“.","Rechts: „Ziel“, Abschnitte (Organisation, Ablauf, Coaching-Punkte, Variationen). Punkte mit Enter, leere Abschnitte als „+ …“-Chips.","Fußzeile zeigt „Noch offen: …“. „Übung speichern“ ist erst mit Namen aktiv.","Nach Speichern: Meldung „Übung angelegt“, Übung steht in der Liste und öffnet sich zur Ansicht."],unklar:!1,entfallen:!1},{id:"UDB-07",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Übung anlegen und abbrechen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["„Neue Übung“ öffnen, nichts eingeben, schließen: kein Hinweis, Dialog geht zu.","„Neue Übung“ öffnen, Namen und weitere Felder eintippen, dann schließen (Handy X, Desktop „Abbrechen“).","Rückfrage „Übung verwerfen?“ („Was du eingegeben hast, geht verloren.“) bzw. „Änderungen verwerfen?“ am Desktop. Einmal „Verwerfen“, einmal zurück zum Bearbeiten.","Nach dem Verwerfen ist nichts angelegt."],unklar:!1,entfallen:!1},{id:"UDB-08",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Eigene Übung bearbeiten",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["Übung öffnen → „Bearbeiten“, oder Rechtsklick bzw. langes Drücken auf die Kachel → „Bearbeiten“.","Dialog „Übung bearbeiten“. Handy: Gruppen „Einordnung“ (Für, Phase, Übungsart, Geeignet für), „Auf einen Blick“, Klappzeilen, Abschnitte. Desktop: Formular wie beim Anlegen.","Werte ändern, speichern (Handy Haken im Kopf, Desktop „Übung speichern“). Meldung „Übung gespeichert“. Die Ansicht zeigt die neuen Werte.","Ändern und schließen: Rückfrage „Änderungen verwerfen?“.","Eine Teamodo-Übung öffnen: kein „Bearbeiten“ (siehe UDB-13)."],unklar:!1,entfallen:!1},{id:"UDB-09",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Übung: Bild, Link und Material hinzufügen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["In „Neue Übung“ bzw. „Übung bearbeiten“ das Medien-Feld antippen. Beim Anlegen am Handy Kacheln „Foto“, „Galerie“, „Link“, sonst ein Menü „Foto aufnehmen“, „Aus Galerie oder Datei“, „Link einfügen“.","Handy: Kamera und Galerie testen. Desktop: Datei wählen oder Bild auf das Feld ziehen.","Link einfügen (YouTube/Instagram/andere): Eingabe „Link zur Übung“ und Übernehmen. Ungültiger Link: „Bitte einen gültigen Link einfügen.“","„Bild ändern“ (bzw. „Ändern“) und „Bild entfernen“.","„Material“: Vorschlags-Chips wählen, eigenes Material eintippen („z. B. Reifen, Seile“), Komma trennt mehrere.","In der Übungsansicht erscheinen Bild, eingebetteter Link und Material."],unklar:!1,entfallen:!1},{id:"UDB-10",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Übung duplizieren",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["Rechtsklick oder langes Drücken auf eine Kachel → „Duplizieren“. Alternativ in „Übung bearbeiten“ „Übung duplizieren“ (Handy).","Es entsteht „<Name> (Kopie)“ in „Meine“ (Meldung „Übung dupliziert“).","Bei offenen Änderungen im Bearbeiten-Dialog erst „Änderungen verwerfen?“.","Duplizieren einer Teamodo-Übung testen, die Kopie ist bearbeitbar."],unklar:!1,entfallen:!1},{id:"UDB-11",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Übung löschen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["Rechtsklick bzw. langes Drücken auf eigene Kachel → „Löschen“, oder in „Übung bearbeiten“ „Übung löschen“ (Handy).","Rückfrage „Übung löschen?“ mit Name. Einmal abbrechen, einmal bestätigen.","Übung verschwindet aus der Liste und aus den Hub-Zahlen.","Übung, die in einem Trainingsablauf steht, löschen und danach das Training ansehen (Verhalten notieren)."],unklar:!1,entfallen:!1},{id:"UDB-12",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Übung ins Training übernehmen (Modus „Übung hinzufügen“)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training → „Ablauf“ → „Hinzufügen“ → „Alle Übungen durchsuchen“. Seite heißt „Übung hinzufügen“.","Grüne Leiste „Training <Datum> · <Zeit> · n Spieler“ mit „Kommt ab … (Minute …)“. Phasenchip ist vorgewählt, „Ich habe heute n Spieler“ ist gesetzt.","Kacheln haben „Hinzufügen“ (Desktop) bzw. Plus (Handy). „Hinzugefügt“ erneut antippen nimmt zurück.","Übung öffnen: Knopf „Zum Training hinzufügen“ mit Uhrzeit, bei bereits enthaltener Übung „Schon hinzugefügt“.","Leiste unten „n Übungen hinzugefügt“ mit „Rückgängig“ (Desktop) und „Zum Ablauf“.","Neue Übung anlegen im Modus: Der Handy-Assistent bietet am Ende „Zum Training hinzufügen“, der Desktop-Dialog „Nur speichern“ und „Speichern & hinzufügen“.","Zurück-Pfeil führt zum Ablauf. Der Kachel-Kontextmenü (Bearbeiten, Duplizieren, Löschen) fehlt in diesem Modus."],unklar:!1,entfallen:!1},{id:"UDB-13",bereich:"UDB",bereichName:"Übungsdatenbank",titel:"Rechte an Übungen je Rolle (Differenzen)",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["OWN: Bearbeiten und Löschen bei allen Vereins-Übungen („Verein“) möglich. „Von Teamodo“ nie.","TRA und SL: Bearbeiten, Löschen nur bei selbst angelegten Übungen. Bei Übungen von anderen Personen fehlen die Menüeinträge.","Anlegen und Duplizieren dürfen alle drei.","Filter „Quelle“ → „Meine“ zeigt bei TRA/SL nur die eigenen Übungen.","Teamodo-Übungen: Ansicht ja, „Bearbeiten“ und „Löschen“ nein, „Duplizieren“ ja."],unklar:!1,entfallen:!1},{id:"PLZ-01",bereich:"PLZ",bereichName:"Trainingsplätze und Platzbelegung",titel:"Trainingsplätze ansehen",rollen:["OWN","SL"],geraete:["desktop","android","ios"],schritte:["Seite „Trainingsplätze“ aufrufen (kein Hub-Eintrag. Zugang z. B. über die Platzbelegung/Menü; Pfad `/app/training/facilities`, siehe Unklarheiten).","Karten mit Name, Art-Abzeichen (Rasenplatz, Kunstrasen, Halle, Kleinfeld), Adresse. Gesperrte Plätze sind rot mit „Platz gesperrt“.","Info-Symbol neben dem Titel.","Leerzustand „Noch keine Trainingsplätze angelegt.“ mit „Ersten Trainingsplatz anlegen“.","Stift an der Karte öffnet „Trainingsplatz bearbeiten“."],unklar:!1,entfallen:!0},{id:"PLZ-02",bereich:"PLZ",bereichName:"Trainingsplätze und Platzbelegung",titel:"Trainingsplatz anlegen",rollen:["OWN","SL"],geraete:["desktop","android","ios"],schritte:["„Neuer Platz“ (Handy runder Knopf, Desktop Knopf rechts oben). Dialog „Neuer Trainingsplatz“.","Feld „Name, z. B. Platz 1“. Gruppe „Art“: Rasenplatz, Kunstrasen, Halle, Kleinfeld.","Gruppe „Adresse“ (Straße und Hausnummer, PLZ, Ort), eingeklappt als „Adresse Straße, PLZ, Ort“.","Schalter „Platz gesperrt“ („Nicht mehr für Trainings wählbar“).","Speichern. Meldung „Trainingsplatz erstellt“, neue Karte erscheint.","Ohne Namen speichern: Fehlermeldung."],unklar:!1,entfallen:!0},{id:"PLZ-03",bereich:"PLZ",bereichName:"Trainingsplätze und Platzbelegung",titel:"Trainingsplatz anlegen und abbrechen",rollen:["OWN","SL"],geraete:["desktop","android","ios"],schritte:["„Neuer Platz“ öffnen, Name und Art eintippen.","Schließen mit X, Wegwischen bzw. „Abbrechen“.","Es ist nichts angelegt. Dialog neu öffnen, die Felder sind leer."],unklar:!1,entfallen:!0},{id:"PLZ-04",bereich:"PLZ",bereichName:"Trainingsplätze und Platzbelegung",titel:"Trainingsplatz bearbeiten und sperren",rollen:["OWN","SL"],geraete:["desktop","android","ios"],schritte:["Stift an der Karte → „Trainingsplatz bearbeiten“.","Name, Art und Adresse ändern. „Speichern“, Meldung „Trainingsplatz aktualisiert“.","„Platz gesperrt“ einschalten und speichern: Karte wird rot.","Gesperrten Platz im Dialog „Neues Training“ und in „Platz wählen“ prüfen: nicht wählbar (außer er ist schon gesetzt).","Platz wieder freigeben."],unklar:!1,entfallen:!0},{id:"PLZ-05",bereich:"PLZ",bereichName:"Trainingsplätze und Platzbelegung",titel:"Trainingsplatz löschen",rollen:["OWN","SL"],geraete:["desktop","android","ios"],schritte:["„Trainingsplatz bearbeiten“ → „Löschen“ (Handy im Formular unten, Desktop links im Fuß).","Rückfrage „Trainingsplatz löschen?“ mit Text „Bestehende Trainings und Spiele behalten ihre Verknüpfung.“","Einmal abbrechen, einmal bestätigen. Meldung „Trainingsplatz gelöscht“.","Ein Training, das auf diesem Platz lag, ansehen (Ort-Anzeige notieren)."],unklar:!1,entfallen:!0},{id:"PLZ-06",bereich:"PLZ",bereichName:"Trainingsplätze und Platzbelegung",titel:"Platzbelegung ansehen (Woche)",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["Hub → „Platzbelegung öffnen“/„verwalten“ oder Platz in der Hub-Gruppe antippen. Seite „Platzbelegung“.","Chips „Alle Plätze“ und je Platz. Einen Platz wählen und wieder auf „Alle Plätze“ zurück.","Wochenwahl: Pfeile „Vorherige Woche“ und „Nächste Woche“, „Woche wählen“ (Kalender), „Heute“.","Desktop: Zeitachse pro Platz und Tag. Handy: Liste je Tag. Heute ist mit „Heute“ markiert.","Spiele sind mit „Spiel“ gekennzeichnet. Gleichzeitige Belegungen werden gemeinsam angezeigt.","Plätze ohne Belegung: „Diese Woche ist der Platz frei.“ Tage ohne Belegung stehen als Zeile „Frei …“. Gesperrte Plätze tragen den Chip „Gesperrt“.","Leerzustand „Keine Trainingsplätze vorhanden.“"],unklar:!1,entfallen:!1},{id:"PLZ-07",bereich:"PLZ",bereichName:"Trainingsplätze und Platzbelegung",titel:"Plätze auf der Belegungsseite verwalten",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["Auf „Platzbelegung“ den Knopf „Neuer Platz“ (Handy rund, Desktop rechts oben) → Dialog „Neuer Trainingsplatz“. Anlegen oder abbrechen.","Am Platzkopf der Belegung der Stift „… bearbeiten“ → „Trainingsplatz bearbeiten“.","Nach dem Speichern erscheint die Belegung aktualisiert, der neue Platz ist als Chip wählbar.",'Als Trainer prüfen: „Neuer Platz" und Stift sind sichtbar – unklar, ob gewollt (Seite „Trainingsplätze" ist für TRA gesperrt)'],unklar:!0,entfallen:!1},{id:"PLZ-08",bereich:"PLZ",bereichName:"Trainingsplätze und Platzbelegung",titel:"Spiel oder Training ohne Platz einem Platz zuordnen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["Auf „Platzbelegung“ die Gruppen „Spiele ohne Platz“ (nur Heimspiele) und „Trainings ohne Platz“ (nur für OWN und TRA, nur eigene Mannschaften; SL sieht nur die Spiele). Meta „n Spiele/Trainings“. Sie erscheinen nur, wenn es solche in der Woche gibt.","„Platz wählen“ bei einem Eintrag. Dialog „Platz wählen“ mit Platzliste (je mit Art-Chip). Gesperrte Plätze fehlen.","Spiel: Platz antippen, Meldung „Platz eingetragen“, Eintrag wandert in die Belegung.","Training: Platz antippen, Meldung „Ort gespeichert“. Zusätzlich „Anderer Ort“ (Dialog „Anderer Ort“, Feld „Wo findet das Training statt?“, „Übernehmen“). Bei Serientrainings folgt „Wie viele Trainings?“ (siehe PLZ-09).","Bei einem Training mit freiem Ort steht darunter „Anderer Ort: …“.","Zurück-Pfeil im Dialog geht zur Liste.","Testdaten nötig: Training ohne Platz (freier Ort) und Heimspiel ohne Platz in der Woche."],unklar:!1,entfallen:!1},{id:"PLZ-09",bereich:"PLZ",bereichName:"Trainingsplätze und Platzbelegung",titel:"Platz bei Serientrainings ändern („Wie viele Trainings?“)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["In der Belegung ein Serientraining antippen (oder aus „Trainings ohne Platz“ „Platz wählen“). Dialog „Platz wählen“.","Platz wählen (oder „Anderer Ort“ → „Übernehmen“). Zweiter Schritt „Wie viele Trainings?“ mit „Nur dieses Training“ und „Dieses und alle folgenden“ (mit Zahl, frühere bleiben unverändert).","Jeweils bestätigen. Meldungen „Ort gespeichert“ bzw. „Ort für die folgenden Trainings gespeichert“. In der Belegung der folgenden Wochen prüfen.","Einzeltraining: der zweite Schritt entfällt.","Zurück-Pfeil im Kopf führt vom zweiten Schritt zur Liste.","Trainings ändern können nur OWN und TRA der eigenen Mannschaft (SL und ADMIN nicht)."],unklar:!1,entfallen:!1},{id:"PLZ-10",bereich:"PLZ",bereichName:"Trainingsplätze und Platzbelegung",titel:"Platz einer vorhandenen Belegung ändern oder entfernen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:["Belegung (Training oder Spiel) in der Zeitachse bzw. Liste antippen. Dialog „Platz wählen“ öffnet sich.","Anderen Platz wählen. Meldung bei einem Spiel „Platz eingetragen“, bei einem Training „Ort gespeichert“.","Bei einem Spiel: „Platz entfernen“. Meldung „Platz entfernt“ und das Spiel erscheint in „Spiele ohne Platz“ (nur Heimspiele).","Beim Training gibt es kein „Platz entfernen“, nur „Anderer Ort“.","Trainings sind nur für OWN und TRA der eigenen Mannschaft antippbar, Spiele für OWN, ADMIN, TRA und SL. Alle anderen Belegungen sind nicht antippbar. Mit Testdaten prüfen."],unklar:!1,entfallen:!1},{id:"PLZ-11",bereich:"PLZ",bereichName:"Trainingsplätze und Platzbelegung",titel:"Platzbelegung als Differenz je Rolle",rollen:["TRA","SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:["TRA: „Platzbelegung“ ist nur über den Hub erreichbar (kein eigener Menüeintrag). Seite „Trainingsplätze“ (`/app/training/facilities`) liefert „Zugriff verweigert“.","SL: darf „Trainingsplätze“ und „Platzbelegung“ öffnen, im Hub Fuß „Platzbelegung verwalten“.","TRA: Hub-Fuß heißt „Platzbelegung öffnen“.","SPI/FT: `/app/training/occupancy` und `/app/training/facilities` liefern „Zugriff verweigert“."],unklar:!1,entfallen:!1},{id:"SPL-01",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Spielplan öffnen: Team, Letzte Spiele, Nächste Spiele, Saison",rollen:["OWN","TRA","SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:['Menü "Spiele" öffnen, Seitentitel "Spielplan"; oben in der Kopfzeile eine Mannschaft wählen (Mannschaftswechsel prüfen, Liste folgt der Kopfzeile)','Modus-Leiste "Team" aktiv: Reiter "Letzte Spiele" und "Nächste Spiele" wechseln, Spiele sind je Monat gruppiert',"Saison-Auswahl (Feld neben dem Titel) auf eine frühere Saison stellen und zurück",'Leerzustand: "Keine vergangenen Spiele in dieser Saison." bzw. "Keine anstehenden Spiele in dieser Saison."; ist eine spätere Saison mit Spielen da, erscheint Knopf "Spiele der Saison … anzeigen" (anklicken)',"Siegel S/U/N, Ergebnis, Status-Kürzel (z. B. abgesagt/Abbruch) und Wettbewerbsart-Marke (Pokal, Freundschaft) in der Zeile ansehen",'Eine Spielzeile antippen: öffnet "Spieldetails" (siehe SPL-08); mit Zurück wieder auf den Spielplan, Reiter/Modus bleiben erhalten',"Browser neu laden: Modus, Reiter und Mannschaft bleiben (stehen in der Adresse)"],unklar:!1,entfallen:!1},{id:"SPL-02",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Spielplan: Liga und Tabelle",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Modus "Liga": Reiter "Letzte Spiele" / "Nächste Spiele", Gruppen je Spieltag mit Anstoßzeit links','Unter den Gruppen "Vorherige Woche anzeigen" bzw. "Nächste Woche anzeigen" mehrfach drücken (Spiele kommen unten dazu)','Leerzustände: "Keine vergangenen Liga-Spiele verfügbar." / "Keine anstehenden Liga-Spiele verfügbar." (bzw. "Keine … Spiele im Zeitraum …", solange weitere Wochen möglich sind); Mannschaft ohne Staffel: "Keine Staffel zugeordnet"','Modus "Tabelle": Spalten #, Team, Sp, S, U, N, Tore, Diff, P (S/U/N/Diff nur auf breiten Bildschirmen), Auf-/Abstiegsplätze farbig, eigenes Team fett',"Teamnamen in der Tabelle antippen: öffnet die Team-Ansicht dieser Mannschaft",'Mannschaft ohne Tabelle: Hinweis "Für diese Mannschaft ist noch keine Tabelle verfügbar"',"Spiel in der Liga-Liste antippen: öffnet Spieldetails (auch fremde Spiele)"],unklar:!1,entfallen:!1},{id:"SPL-03",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Spielplan aktualisieren",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['In Modus "Team" oder "Tabelle" den runden Aktualisieren-Knopf neben der Saison-Auswahl drücken (Tooltip "Spiele und Tabelle für diese Mannschaft neu laden")','Hinweis "Wir suchen nach weiteren Spielen…" erscheint, Knopf dreht sich','Danach ist der Knopf gesperrt, Tooltip "Erneut in … möglich" (10 Minuten Wartezeit); Seite neu laden: Sperre bleibt',"Nach ca. 15 und 60 Sekunden prüfen, ob neue Spiele/Tabelle auftauchen",'Im Modus "Liga" und "Statistik" ist der Knopf nicht da'],unklar:!1,entfallen:!1},{id:"SPL-04",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:'Spielplan-Statistik (Modus "Statistik")',rollen:["OWN","TRA","SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:['Modus "Statistik" wählen (Saison-Auswahl und Aktualisieren verschwinden)','Zeitraum-Chips "30 T", "90 T", "Saison" wechseln (kein "7 T"); "Datum" öffnet die Bereichswahl für einen eigenen Von/Bis-Zeitraum','Kennzahlen "Bilanz S-U-N" und "Eingesetzte Spieler" prüfen','Gruppen "Einsatzzeiten" (Startelf / Eingewechselt), "Wann kommt wer", "Tore": Knopf "Alle … Spieler/Torschützen" und "Weniger anzeigen"','Leerzustand "Kein Spiel im Zeitraum" (Zeitraum so wählen, dass kein Spiel liegt)','Alten Link mit ?view=statistik als SPI öffnen: fällt auf "Team" zurück'],unklar:!1,entfallen:!1},{id:"SPL-05",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Spielplan auf dem Handy durchwischen",rollen:["OWN","TRA"],geraete:["android","ios"],schritte:["Auf dem Spielplan mit Mannschaft nach links/rechts wischen: Reihenfolge Team Letzte, Team Nächste, Liga Letzte, Liga Nächste, Tabelle","Reiter und Modus-Leiste springen mit; Animation prüfen",'In "Statistik" ist Wischen aus',"Senkrechtes Scrollen und Wischen stören sich nicht","Zurück-Wischen vom Rand (Spieldetails zurück zum Spielplan) und Hardware-Zurück auf Android"],unklar:!1,entfallen:!1},{id:"SPL-06",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Spielplan ohne Mannschaft: Wochenansicht und Spielbericht-Symbol",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Nur erreichbar, wenn keine Mannschaft gewählt ist (z. B. Link /app/games?verein=<Vereins-Id>), ggf. mit Testdaten; Titel-Beschreibung "Alle Spiele meines Vereins"','Leiste: Pfeil zurück, "Heute", Wochen-Anzeige, Kalender (Desktop Kalender-Popup, Handy natives Datumsfeld), Pfeil vor','Spiele je Tag als Karten: Wappen, Ergebnis oder "… Uhr" mit Ort-Symbol (Tooltip: Platzname bzw. Adresse), Wettbewerbsart','Spiel mit Bericht: grünes Symbol in der Karte antippen: Dialog "Spielbericht" nur zum Lesen, "Schließen"','Leerzustand "Keine Spiele für die gewählten Filter"; Karte antippen öffnet Spieldetails'],unklar:!1,entfallen:!1},{id:"SPL-07",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Spielplan: Unterschiede für Spieler, Funktionsteam, Sportlichen Leiter",rollen:["SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:["Spielplan öffnen: gleicher Aufbau wie bei Trainer (Team, Liga, Tabelle, Saison, Aktualisieren)",'SPI und FT: Modus "Statistik" fehlt in der Leiste; SL: Statistik ist da',"SPI: sieht nur die eigene Mannschaft (Kopfzeile)","Spiel antippen öffnet Spieldetails in der jeweiligen Rollen-Sicht (siehe AUF-17 bis AUF-19)"],unklar:!1,entfallen:!1},{id:"SPL-08",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Spieldetails öffnen: Kopf, Spielkarte, Mannschaftslinks",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Seitentitel "Spieldetails" mit Datum und Uhrzeit; Info-Symbol (Text zur Aufstellungsverwaltung), Zurück','Spielkarte: beide Mannschaften mit Wappen, Ergebnis oder "… Uhr", Ort-Symbol (Tooltip), Wettbewerbsart-Blase links oben',"Mannschaft antippen: öffnet Team-Ansicht; Zurück kommt zum Spiel im selben Reiter zurück",'Abgesagtes Spiel (per Link): Hinweis "Dieses Spiel wurde abgesagt."','Nicht vorhandene Spiel-Adresse: "Spiel nicht gefunden"',"Spiel vor dem Anpfiff und Spiel nach dem Anpfiff jeweils öffnen: Reiter-Leiste unterscheidet sich (siehe AUF-01)"],unklar:!1,entfallen:!1},{id:"SPL-09",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Spielbericht schreiben, bearbeiten, nur lesen",rollen:["OWN","TRA","SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:['Spieldetails eines schon angepfiffenen Spiels: Knopf "Bericht" (Handy: Symbol) rechts neben dem Titel (vor dem Anpfiff gibt es ihn nicht)','OWN/TRA: Dialog "Spielbericht bearbeiten" (Handy: "Spielbericht"), Text eintragen, Hinweis im Textfeld zu persönlichen Daten lesen, "Speichern" (Handy: Haken), Hinweis "Spielbericht gespeichert"','Dasselbe mit "Abbrechen" (Handy: Schließen-Kreuz): Eingabe wird verworfen',"Grünes Dokument-Symbol in der Spielkarte erscheint, sobald ein Bericht da ist; antippen öffnet ihn",'SPI, FT, SL: Dialog heißt "Spielbericht", Textfeld nicht änderbar ("Kein Spielbericht vorhanden" wenn leer), nur "Schließen"',"Der Bericht ist laut Hinweis für alle im Team sichtbar: als SPI gegenprüfen"],unklar:!1,entfallen:!1},{id:"SPL-10",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Spieldaten aktualisieren (fussball.de-Daten nachladen)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Nur sichtbar bei einem schon gespielten Spiel mit fussball.de-Verknüpfung, dem Ergebnis oder Ereignisse fehlen (ggf. Testdaten/Sonderfall)",'Knopf "Aktualisieren" (Handy: Symbol; Tooltip "Spieldaten nicht in der App? Jetzt Aktualisieren") drücken','Erfolg: Hinweis "Spieldaten aktualisiert", Ergebnis/Verlauf erscheinen; Fehler/nicht gefunden: Hinweistext',"Schnelles Doppelklicken (5-Sekunden-Sperre)",'Bei dauerhaft nicht verfügbaren Daten: statt Knopf der Text "Für dieses Spiel sind auf fussball.de keine weiteren Daten verfügbar."'],unklar:!1,entfallen:!1},{id:"SPL-11",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Gegner-Vergleich (Spielvergleich) vor dem Spiel",rollen:["OWN","TRA","SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:['Eigenes, noch nicht angepfiffenes Spiel öffnen; OWN/TRA/SL: Reiter "Statistiken"; SPI/FT: Vergleich steht ohne Klick unter Spielkarte/Treffpunkt','Gruppe "Gegner im Vergleich" (Tabellenplatz, Punkte, Gegentore, Zu null, Karten, Letzte 5; "nach … Spieltagen")','Gruppe "Wann die Tore fallen" (Torminuten)','Gruppe "Stärken und Schwächen" (Hinweise)','Gruppe "Wer trifft" (Torschützen beider Seiten)','Gruppe "Frühere Begegnungen" (Duelle der Teams)',"Spiel ohne Ligadaten/Vorgeschichte: der ganze Block fehlt ohne Fehlermeldung"],unklar:!1,entfallen:!1},{id:"SPL-12",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Ergebnis als Bild (Dialog, Vorschau, Look, Foto)",rollen:["OWN","TRA","SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:['Einstieg: Übersicht, Gruppe "Ergebnisse", Zeile "Ergebnis als Bild teilen" (nur wenn Ergebnis da; nicht bei Nichtantritt/Abbruch)','Dialog "Ergebnis als Bild": hat der Verein noch keine Farben, kommt erst die Frage "Welche Farben hat euer Verein?" mit Farbwahl und "Weiter" (nur OWN/TRA/SL; SPI und FT nicht, sie bekommen Teamodo-Grün)',"Vorschau (Feed-Post 4:5) prüfen: Wappen, Namen, Ergebnis",'Umschalter "Dunkel" / "Hell" und "Stadion" / "Eigenes Foto"; bei "Eigenes Foto" erst "Foto wählen", danach "Anderes Foto wählen"; defektes Foto: Hinweis "Das Foto konnte nicht geöffnet werden"','Zeile "… Tor(e) ohne Torschützen – jetzt zuordnen" (nur wenn Tore ohne Schütze; nicht für SPI/FT): führt zum Spielverlauf','Desktop ohne Teilen-Funktion: Knopf heißt "Herunterladen" (Datei "Ergebnis-…-Feed.png" und "-Story.png"); sonst "Teilen"',"Schließen ohne Teilen"],unklar:!1,entfallen:!1},{id:"SPL-13",bereich:"SPL",bereichName:"Spiele / Spielplan",titel:"Ergebnis-Bild und Startelf-Bild nativ teilen",rollen:["OWN","TRA","SPI"],geraete:["android","ios"],schritte:['Ergebnis-Bild (Übersicht, "Ergebnis als Bild teilen"): Knopf "Teilen" öffnet das System-Teilen-Fenster, beide Dateien (Feed und Story) sind dabei',"In Instagram/Nachrichten/Dateien speichern prüfen; abbrechen im System-Fenster: keine Fehlermeldung",'Bei Fehler: Hinweis "Teilen hat nicht geklappt" mit "Nochmal"','"Eigenes Foto": Kamera bzw. Fotomediathek wählbar, Foto wird ins Bild eingebaut',"Dasselbe mit Startelf-Bild (siehe AUF-08)"],unklar:!1,entfallen:!1},{id:"AUF-01",bereich:"AUF",bereichName:"Aufstellung im Spiel",titel:"Spieldetails vor dem Spiel: Reiter-Leiste und Ablauf",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Eigenes, noch nicht angepfiffenes Spiel öffnen: Leiste "Aufstellung", "Standardsituationen" (Handy "Standards"), "Treffpunkt", "Statistiken", "Berichte"',"Grüne Punkte am Reiter erscheinen nur bei erledigtem Schritt (Startelf 11/11, Standards alle besetzt bzw. keine angelegt, Treffpunkt freigegeben)","Reiter nacheinander öffnen; die Adresse bekommt ?tab=… (Seite neu laden: gleicher Reiter)",'Im Reiter "Aufstellung" gibt es keine Heim/Gast-Umschaltung, es wird immer die eigene Mannschaft gezeigt',"Spiel zweier eigener Mannschaften (Testdaten): richtige Mannschaft für den Trainer vorgewählt","Gesten-Hinweis auf dem Handy (Antippen = Tauschen/Bank, gedrückt halten = Verschieben) mit Kreuz ausblenden; erscheint danach nicht mehr"],unklar:!1,entfallen:!1},{id:"AUF-02",bereich:"AUF",bereichName:"Aufstellung im Spiel",titel:"Startelf aufbauen mit Formation",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Reiter "Aufstellung", Formation-Pille oben rechts auf dem Rasen ("Formation") öffnen, z. B. 4-4-2 wählen: leere Positionen erscheinen','Leere Position antippen: Dialog "Spieler zur Startelf hinzufügen (POS)" – Spieler wählen (Gruppen Bankspieler, Verfügbare Spieler, Abwesend, Inaktive Spieler, Andere Mannschaften; Desktop zweispaltig mit passenden Spielern zur Position oben)','Hinweis "Spieler zur Startelf hinzugefügt"; Spieler steht auf der Position',"Formation wechseln: bereits gesetzte Spieler rücken auf die neuen Positionen",'Mehr als 11: Fehlermeldung "Maximal 11 Spieler in der Startelf"','Formation "Formation" (leer) wählen: Positionsraster verschwindet, Spieler bleiben'],unklar:!1,entfallen:!1},{id:"AUF-03",bereich:"AUF",bereichName:"Aufstellung im Spiel",titel:"Spieler hinzufügen: Startelf und Bank",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Desktop: linke Spalte "Verfügbare Spieler" (Gruppen Abwesend (n), Inaktiv, "Inaktive Spieler" aufklappbar, "Andere Mannschaften" aufklappbar): bei einem Spieler den Knopf für Startelf ("11") bzw. Bank drücken','Handy: unter dem Feld "Zur Startelf hinzufügen" und unter "Bank" "Zur Bank
