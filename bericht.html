<style>/* Farben als Variablen: dunkel ist Standard, hell folgt prefers-color-scheme. */
:root {
  --grund: #0f1a15;
  --karte: #16251e;
  --karte2: #1b2c24;
  --linie: #2a4034;
  --schrift: #e8f1ec;
  --gedaempft: #8fb3a0;
  --akzent: #3ddc97;
  --auf-akzent: #07140d;
  --mittel: #f2b84b;
  --fehler: #ff6b5e;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --grund: #f3f7f4;
    --karte: #ffffff;
    --karte2: #e8f0ec;
    --linie: #cbd8d1;
    --schrift: #14211a;
    --gedaempft: #4c6358;
    --akzent: #0f7a4a;
    --auf-akzent: #ffffff;
    --mittel: #946200;
    --fehler: #c0362a;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--grund);
  color: var(--schrift);
  font-family: var(--sans);
  line-height: 1.45;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#app { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; }
h1 { font-size: 1.35rem; margin: 0; text-wrap: balance; }
p { margin: 0; }
.mut { color: var(--gedaempft); font-size: .875rem; }
.karte { background: var(--karte); border-radius: 16px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.feld { display: grid; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
label, legend { font-size: .875rem; font-weight: 600; padding: 0; }
input[type=text], select {
  font: inherit; color: var(--schrift); background: var(--grund);
  border: 1px solid var(--linie); border-radius: 10px;
  min-height: 44px; padding: 8px 12px; width: 100%; max-width: 100%;
}
.knopf {
  font: inherit; font-weight: 600; color: var(--schrift); background: var(--karte2);
  border: 1px solid var(--linie); border-radius: 10px; min-height: 44px; padding: 8px 16px; cursor: pointer;
}
.knopf.pri { background: var(--akzent); color: var(--auf-akzent); border-color: var(--akzent); }
.knopf:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
.zeile { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bereiche { display: grid; gap: 6px; }
.opt {
  display: flex; gap: 10px; align-items: center; min-height: 44px; padding: 6px 12px;
  background: var(--karte2); border-radius: 10px; font-weight: 500;
}
.opt input { width: 22px; height: 22px; flex: none; accent-color: var(--akzent); }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.meldung { min-height: 1.3em; font-size: .875rem; color: var(--mittel); font-weight: 600; }
.kopf { background: var(--karte); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; }
.kopf-zeile { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kopf-name { font-size: 1rem; margin: 0; }
.kopf-name:focus { outline: none; }
h1:focus { outline: none; }
.kopf-zeile .kopf-name { min-width: 0; overflow-wrap: anywhere; }
.kopf-zeile .knopf { margin-left: auto; }
.chip { background: var(--karte2); border-radius: 20px; padding: 3px 10px; font-size: .8rem; color: var(--gedaempft); }
.zaehler { font-size: 1.6rem; font-weight: 700; }
.zaehler small { font-size: .875rem; font-weight: 500; color: var(--fehler); }
.warnung {
  background: color-mix(in srgb, var(--fehler) 18%, var(--karte)); border: 1px solid var(--fehler);
  border-radius: 10px; padding: 10px 12px; font-size: .875rem; font-weight: 600;
}

/* Liste (Entwurf A) */
.kopf-aktionen { display: flex; gap: 8px; flex-wrap: wrap; }
.fortschritt { display: grid; gap: 8px; }
.balken { display: block; height: 6px; background: var(--karte2); border-radius: 3px; overflow: hidden; }
.balken-fuell { display: block; height: 100%; background: var(--akzent); border-radius: 3px; }
.bereiche-liste { display: grid; gap: 8px; }
.bereich { background: var(--karte); border-radius: 14px; border: 1px solid transparent; min-width: 0; }
.bereich.fertig { border-color: var(--akzent); background: color-mix(in srgb, var(--akzent) 12%, var(--karte)); }
.bkopf {
  font: inherit; color: var(--schrift); background: none; border: 0; width: 100%; text-align: left; cursor: pointer;
  min-height: 56px; padding: 8px 14px; display: grid; grid-template-columns: 1fr auto 20px; grid-template-areas: "name zahl pfeil" "balken balken balken";
  gap: 4px 8px; align-items: center; border-radius: 14px;
}
.bkopf .bname { grid-area: name; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.bkopf .bzahl { grid-area: zahl; color: var(--gedaempft); font-size: .875rem; font-variant-numeric: tabular-nums; }
.bkopf .balken { grid-area: balken; height: 4px; }
.bkopf .pfeil { grid-area: pfeil; color: var(--gedaempft); text-align: center; }
.haken { color: var(--akzent); }
.karte > .bkopf { padding: 0; }
.karte > .bkopf .bname { grid-column: 1; }
.karte > .bkopf { grid-template-columns: 1fr 20px; grid-template-areas: "name pfeil"; }
.bkoerper { padding: 0 10px 12px; display: grid; gap: 8px; }
.aufgaben, .meldungen { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.aufgabe { background: var(--karte2); border-radius: 12px; min-width: 0; border-left: 4px solid transparent; }
.aufgabe.ok { border-left-color: var(--akzent); }
.aufgabe.mittel { border-left-color: var(--mittel); }
.aufgabe.fehler { border-left-color: var(--fehler); }
.az-kopf { display: flex; align-items: center; gap: 2px; min-width: 0; }
.kreis, .mini, .az-titel {
  font: inherit; color: var(--schrift); background: none; border: 0; cursor: pointer; min-height: 44px;
}
.kreis { width: 44px; flex: none; display: grid; place-items: center; padding: 0; }
.kreis-i {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--gedaempft);
  display: grid; place-items: center; font-weight: 800; font-size: .9rem; line-height: 1;
}
.kreis.ok .kreis-i { background: var(--akzent); border-color: var(--akzent); color: var(--auf-akzent); }
.kreis.mittel .kreis-i { border-color: var(--mittel); color: var(--mittel); }
.kreis.fehler .kreis-i { border-color: var(--fehler); color: var(--fehler); }
.az-titel { flex: 1; min-width: 0; text-align: left; padding: 6px 4px; display: grid; gap: 0; overflow-wrap: anywhere; line-height: 1.3; }
.az-id { font-size: .72rem; color: var(--gedaempft); font-family: ui-monospace, Menlo, Consolas, monospace; }
.mini { width: 44px; flex: none; padding: 0; font-weight: 800; border-radius: 10px; }
.mini.mittel { color: var(--mittel); }
.mini.fehler { color: var(--fehler); }
.mini.mittel.an { background: color-mix(in srgb, var(--mittel) 22%, transparent); }
.mini.fehler.an { background: color-mix(in srgb, var(--fehler) 22%, transparent); }
.az-koerper { padding: 4px 12px 14px 16px; display: grid; gap: 10px; min-width: 0; }
.schritte { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: .9rem; overflow-wrap: anywhere; }
.unklar { color: var(--mittel); font-weight: 600; font-size: .875rem; }
.problem-text { font-size: .875rem; overflow-wrap: anywhere; }
.problem { display: grid; gap: 12px; background: var(--karte); border-radius: 12px; padding: 12px; min-width: 0; }
.knopf.status[aria-pressed="true"].mittel { border-color: var(--mittel); color: var(--mittel); background: color-mix(in srgb, var(--mittel) 18%, var(--karte)); }
.knopf.status[aria-pressed="true"].fehler { border-color: var(--fehler); color: var(--fehler); background: color-mix(in srgb, var(--fehler) 18%, var(--karte)); }
textarea {
  font: inherit; color: var(--schrift); background: var(--grund); border: 1px solid var(--linie); border-radius: 10px;
  padding: 8px 12px; width: 100%; max-width: 100%; resize: vertical; min-height: 88px;
}
.etikett { font-size: .875rem; font-weight: 600; }
.fotos { display: flex; flex-wrap: wrap; gap: 8px; }
.foto { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; background: var(--karte2); }
.foto-bild { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto-weg {
  position: absolute; top: 0; right: 0; width: 44px; height: 44px; border: 0; background: none; cursor: pointer; padding: 0;
  color: #fff; font-weight: 800; display: grid; place-items: start end; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 6px #000;
}
.bestaetigung { background: color-mix(in srgb, var(--mittel) 14%, var(--karte)); border: 1px solid var(--mittel); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.knopf.gefahr { background: var(--fehler); color: var(--auf-akzent); border-color: var(--fehler); }
.mel { background: var(--karte2); border-radius: 12px; padding: 12px; display: grid; gap: 8px; justify-items: start; }
.umbruch { overflow-wrap: anywhere; white-space: pre-wrap; }
.stapel { display: grid; gap: 12px; }
h2 { font-size: 1.1rem; margin: 0; }

/* Sichern, Teilen, Importieren */
.sicherung { display: grid; gap: 10px; min-width: 0; }
.band {
  display: grid; gap: 4px; background: var(--karte2); border-radius: 10px; padding: 8px 12px;
  font-size: .875rem; font-weight: 600; overflow-wrap: anywhere;
}
.band.gelb { background: color-mix(in srgb, var(--mittel) 18%, var(--karte)); border: 1px solid var(--mittel); }
.band-hinweis { font-weight: 500; }
.sicherung p { margin: 0; overflow-wrap: anywhere; }
.knopf.klein { min-height: 44px; padding: 6px 12px; font-size: .875rem; }
.vorschau h2 { margin: 0; font-size: 1.05rem; }
.vorschau h2:focus { outline: none; }
.vliste { display: grid; gap: 4px; margin: 0; }
.vz { display: flex; gap: 8px; justify-content: space-between; min-width: 0; }
.vz dt { color: var(--gedaempft); }
.vz dd { margin: 0; font-weight: 600; text-align: right; overflow-wrap: anywhere; min-width: 0; }
.nur-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Sammelbericht: ergänzt style.css (Farben, Knöpfe, Karten) um die Berichtsansicht. */
#app.bericht { max-width: 960px; }
.bericht-kopf { display: grid; gap: 4px; }
.ablage {
  border: 2px dashed var(--linie); border-radius: 16px; padding: 16px; display: grid; gap: 10px; background: var(--karte);
  min-width: 0;
}
.ablage.zieht { border-color: var(--akzent); background: color-mix(in srgb, var(--akzent) 12%, var(--karte)); }

.hinweis {

.hinweis strong { font-weight: 700; }
.kennzahlen { display: flex; flex-wrap: wrap; gap: 8px; }

.kennzahl b { font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.kennzahl span { font-size: .8rem; color: var(--gedaempft); }
.filter-gruppen { display: grid; gap: 10px; }

.chip-opt {

  border: 1px solid transparent; min-width: 0;
}
.chip-opt input { width: 20px; height: 20px; accent-color: var(--akzent); flex: none; margin: 0; }

.chip-opt span { overflow-wrap: anywhere; min-width: 0; }
details.bereichswahl > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; font-size: .875rem; }

.bericht-zeilen { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

.zl.s-mittel { border-left-color: var(--mittel); }
.zl.s-fehler { border-left-color: var(--fehler); }
.bereich-titel { font-size: .9rem; color: var(--gedaempft); margin: 10px 2px 0; font-weight: 700; }
.zl-kopf {
  font: inherit; color: var(--schrift); background: none; border: 0; width: 100%; text-align: left; cursor: pointer;
  min-height: 56px; padding: 6px 8px 6px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center;
  border-radius: 12px;
}
.zl-titel { display: grid; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.punkte { display: flex; gap: 2px; }
.pg { display: grid; justify-items: center; gap: 1px; width: 42px; position: relative; }
.pk {

}
.pk.ok { background: var(--akzent); border-color: var(--akzent); color: var(--auf-akzent); }
.pk.mittel { background: var(--mittel); border-color: var(--mittel); color: var(--grund); }
.pk.fehler { background: var(--fehler); border-color: var(--fehler); color: var(--auf-akzent); }
.pk.nv { border-style: dotted; color: var(--gedaempft); opacity: .6; }
.pl { font-size: .65rem; color: var(--gedaempft); line-height: 1; }
.pn {
  position: absolute; top: -4px; right: 2px; min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px;
  background: var(--schrift); color: var(--grund); font-size: .65rem; font-weight: 700; display: grid; place-items: center;
}
.zl-koerper { padding: 4px 12px 14px; display: grid; gap: 12px; min-width: 0; }
.geraet-block { display: grid; gap: 8px; min-width: 0; }
.geraet-block h3 { margin: 0; font-size: .95rem; }
.eintrag { background: var(--karte2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.eintrag.problem { border-left: 4px solid var(--mittel); }
.eintrag.problem.fehler { border-left-color: var(--fehler); }
.eintrag-kopf { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.marke { border-radius: 12px; padding: 2px 10px; font-size: .78rem; font-weight: 700; border: 1px solid var(--linie); }
.marke.ok { color: var(--akzent); border-color: var(--akzent); }
.marke.mittel { color: var(--mittel); border-color: var(--mittel); }
.marke.fehler { color: var(--fehler); border-color: var(--fehler); }
.marke.frueher { color: var(--gedaempft); }
.alt { opacity: .8; border-top: 1px dashed var(--linie); padding-top: 6px; display: grid; gap: 4px; }
.vorschau-fotos { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb {
  padding: 0; border: 1px solid var(--linie); border-radius: 10px; overflow: hidden; width: 72px; height: 72px;
  background: var(--karte); cursor: zoom-in;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.meldung-karte { background: var(--karte); border-radius: 12px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.overlay {
  position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .88); display: grid; place-items: center; padding: 16px;
}
.overlay img { max-width: 100%; max-height: calc(100vh - 100px); object-fit: contain; border-radius: 8px; }
.overlay .knopf { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: 12px; }
.kopier-feld { display: grid; gap: 6px; }
.kopier-feld textarea { min-height: 160px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; }
.leer-hinweis { text-align: center; padding: 24px 12px; }
@media (min-width: 700px) {
  .pg { width: 52px; }
  .pl { font-size: .72rem; }
}

  font: inherit; color: var(--schrift); background: var(--grund);
  border: 1px solid var(--linie); border-radius: 10px;
  min-height: 44px; padding: 8px 12px; width: 100%; max-width: 100%;
}
</style>

te"],unklar:!1,entfallen:!1},{id:"ONB-01",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Startseite für Nicht-Eingeloggte",rollen:["OWN","TRA","SPI","SPI-K","SL","FT"],geraete:["desktop"],schritte:['teamodo.de öffnen (abgemeldet): Kopf-Navigation "Module" (Auswahl: Alles im Blick, Trainingsplanung, Spielvorbereitung, Spielerbewertung), "Für wen?", "Preise", "FAQ", "Kontakt", Knopf "Login"; mobil: "Login"-Link und Menü-Knopf mit Seitenmenü','Hero: "30 Tage kostenlos testen" -> /onboarding; "Lass dir Teamodo zeigen" springt zum Kontaktformular',"Abschnitte durchscrollen (Stimmen, Alles im Blick, Funktionen, Spielvorbereitung, Scouting, Auch für deine Spieler, Warum Teamodo?, Für wen ist Teamodo?)",'"Wähle deinen Plan": Monatlich/Jährlich umschalten, Plan antippen (vorgewählt), dann "Jetzt starten" -> /onboarding (bei Jährlich mit vorgewähltem Jährlich); Club-Karte: "Kontakt aufnehmen"',"FAQ: Einträge auf- und zuklappen",'Abschnitt "Kontakt": Formular (Name *, E-Mail *, Telefon, Vereinsname, Nachricht *) mit Pflichtfeld-Prüfung absenden','Fuß: "Cookie-Einstellungen", Rechtslinks, Funktionsseiten; darüber "Unser Partner"',"Angemeldet teamodo.de öffnen: Weiterleitung nach /app"],unklar:!1,entfallen:!1},{id:"ONB-02",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Registrieren: Konto-Schritt (E-Mail, Passwort, Code)",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['/onboarding (abgemeldet): Titel "Konto erstellen", Fortschrittsanzeige, Felder "E-Mail-Adresse", "Passwort" (Hinweis "Mindestens 6 Zeichen"), Knopf "Konto erstellen"','Hinweiskasten "Du bist Spieler? ..." mit Link "Einladung einlösen"','Mit schon bekannter E-Mail: Kasten "Diese E-Mail kennen wir schon", Knopf wechselt zu "Anmelden und weiter"','Neue E-Mail: "E-Mail bestätigen" mit Code-Eingabe (6 Stellen), "Neuen Code senden", "E-Mail-Adresse ändern", Zurück zum Formular','Code bestätigen -> "E-Mail bestätigt" -> "Weiter" zum nächsten Schritt','"Google"/"Apple" als Alternative (siehe AUT-02), Rechtslinks unten','Desktop: grünes Panel links; Link "Anmelden" statt "Registrieren" wechselt zur Anmeldung'],unklar:!1,entfallen:!1},{id:"ONB-03",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Verein wählen",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Schritt "Wähle deinen Verein": Suchfeld "Vereinsname" (mobil Löschen-Kreuz "Suche leeren"), Trefferliste "Treffer"',"Treffer antippen: Verein wird gewählt, es geht direkt weiter",'Suche ohne Treffer: Meldung "„…“ nicht gefunden" und Knopf "Verein melden" -> Kontaktformular mit Titel "Verein fehlt?" (siehe ONB-16)','Immer unten: "Verein nicht dabei? Schreib uns" führt ebenfalls zum Kontaktformular','Ladefehler-Zustand (Netz aus): Hinweis "Vereine konnten nicht geladen werden"',"Zurück: kein Zurück auf den Konto-Schritt"],unklar:!1,entfallen:!1},{id:"ONB-04",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Mannschaften wählen",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Schritt "Welche Mannschaften trainierst du?": Unterzeile "Bis zu 3 Mannschaften. Eine davon richtest du gleich ein."; Mannschaften antippen (Haken); Knopf "Mannschaft wählen" (gesperrt), dann "Weiter" bzw. "Weiter · n Mannschaften"; Preiszeile nur im Web (in den Apps keine)',"Mehr wählen als der Plan erlaubt: weitere Zeilen werden ausgegraut und sind nicht wählbar",'Bei mehreren Mannschaften: Stufe 2 "Mit welcher fangen wir an?" (eine für Spieler/Training wählen, Knopf "<Name> einrichten"), Zurück-Pfeil zur Stufe 1','Link "Mannschaft fehlt? Schreib uns" -> Kontaktformular "Mannschaft fehlt?"','"Mehr als 3 Mannschaften? Vereinspaket ansehen" (nicht in der iOS-App) -> Dialog "Vorteile für den ganzen Verein" mit "Zum Kontaktformular"','Hinweis "Bereits in deinem Abo enthalten." nur bei vorhandenem Abo'],unklar:!1,entfallen:!1},{id:"ONB-05",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Spieler übernehmen",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Schritt "Wer gehört zur <Mannschaft>?": Gruppe "Diese Saison" (n von m), alle vorgewählt; Liste aus den fussball.de-Daten','Einzelne ab-/anwählen; Knopf "n Spieler übernehmen", mit 0 "Spieler auswählen" (gesperrt)','Eingeklappte Karte "Weitere mögliche Spieler" (aus der Vorsaison) aufklappen und Spieler dazuwählen','Ladezustand (Lader) und Fehlerzustand "Die Spieler konnten nicht geladen werden" (Knopf "Erneut versuchen")','Leerzustand "Die Spieler sind noch unterwegs": Knopf "Weiter zum Training" geht ohne Spieler weiter','Im Leer-/Fehlerzustand mobil: Zweitknopf "Andere Mannschaft wählen", Zurück-Pfeil "Andere Mannschaft"','Fußhinweis "Fehlt jemand? Spieler kannst du jederzeit in der App ergänzen."'],unklar:!1,entfallen:!1},{id:"ONB-06",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Training und Aufstellung im Onboarding",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Schritt "Wann trainiert ihr?": Trainingstage Mo bis So antippen, je Tag Uhrzeiten (Plus "Weitere Uhrzeit" / "Uhrzeit entfernen"), Feld "Platz", Zeitraum Start/Ende','Knopf "n Trainings anlegen" (ohne Termine "Weiter", gesperrt); "Überspringen" im Training','Schritt "So habt ihr zuletzt gespielt": Gruppen "Euer letztes Spiel", "Formation" (wechseln) und "Bank"; zwei Spieler antippen = tauschen','Knopf "Positionen übernehmen"; "Überspringen" in der Aufstellung','Gibt es kein letztes Spiel, wird der Schritt automatisch ausgelassen; Fehlerhinweis "Das letzte Spiel konnte nicht geladen werden"',"Zurück-Pfeil in beiden Schritten"],unklar:!1,entfallen:!1},{id:"ONB-07",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Start-Schritt und Testphase (Web, Stripe)",rollen:["OWN"],geraete:["desktop"],schritte:['Schritt "Start": Titel "Jetzt 30 Tage kostenlos testen", Plan mit Preis, Umschalter "Monatlich" / "Jährlich" ("2 Monate gratis"), Zeitleiste (heute 0 €, Erinnerung per E-Mail, erste Abbuchung)','Pflicht-Häkchen "Ich akzeptiere die Nutzungsbedingungen. …" (ohne: "Bitte akzeptiere zuerst die Nutzungsbedingungen."); optionales Häkchen für Infos per E-Mail','Fußleiste: Hauptknopf "Kostenlos testen" -> Stripe-Zahlungsseite mit Testkarte durchlaufen','Rückkehr direkt in den Start-Schritt: "Alles bereit für die <Mannschaft>", Knopf "Einrichtung abschließen" -> Ladeansicht "Verein wird vorbereitet" -> Übersicht',"Abbruch in Stripe: Rückkehr zum Start-Schritt, kein doppeltes Anlegen",'Alternative "Ohne Zahlungsdaten fortfahren": Verein wird ohne Stripe angelegt (Testphase ohne Karte)','Testphase schon verbraucht: Knopf "Abo abschließen" und Hinweis "Ohne Abo bleibt die App gesperrt, bis du es im Profil abschließt."','Stripe-Zahlung angekommen, aber Konto/Verein fehlt (Sonderfall): Hinweis "Deine Zahlung ist angekommen." / "Richte deinen Verein noch einmal ein — du zahlst nichts doppelt."'],unklar:!1,entfallen:!1},{id:"ONB-08",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Start-Schritt in der App (Store-Abo)",rollen:["OWN"],geraete:["android","ios"],schritte:['Schritt "Start": Titel "Alles bereit für die <Mannschaft>", Hauptknopf "Testphase starten" bzw. "Abo starten" (Testphase verbraucht), Zeile "Nach 30 Tagen … pro Monat"','Block "Verwaltung über Apple" bzw. "Verwaltung über Google Play" mit Preis, Laufzeit und Kündigungshinweis; Pflicht-Häkchen Nutzungsbedingungen (wie ONB-07)','Store-Dialog bestätigen, danach "Einrichtung abschließen" -> Übersicht','Zustände: "Dein Kauf wartet noch auf die Bestätigung des Stores." (Knopf "Erneut versuchen"), "Dein Kauf ist angekommen."','Beim ersten Start im Onboarding: Android zeigt Dialog "Hilf uns, bekannter zu werden" (Erlauben / Nicht erlauben, nicht wegklickbar); iOS fragt stattdessen per Systemabfrage (Tracking): beide Wege prüfen','Rechtslinks im Häkchen-Text erreichbar; Zeile "Du bist Spieler? … löse deine Einladung ein"'],unklar:!1,entfallen:!1},{id:"ONB-09",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Onboarding unterbrechen und fortsetzen",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Mitten im Ablauf (z. B. bei "Spieler") Seite neu laden / App schließen und wieder öffnen: Fortschritt ist gemerkt','Zurück-Pfeil durch Schritte bis "Verein" (der Konto-Schritt ist nie Ziel von Zurück; Auswahl bleibt erhalten)','Eingeloggt ohne Verein /app öffnen: Weiterleitung ins Onboarding (ohne Konto-Schritt, Start bei "Verein"); liegt eine Einladung gemerkt vor, geht es stattdessen zu diesem Einladungslink','Abmelden aus dem Onboarding über das Menü der Hülle (Punkte-Knopf "Menü") und neu anmelden','"Jährlich" auf der Startseite gewählt: Start-Schritt ist auf "Jährlich" vorgewählt (der Plan richtet sich nach der Mannschaftszahl)'],unklar:!1,entfallen:!1},{id:"ONB-10",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Weitere Mannschaft hinzufügen und Mannschaften anpassen",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Profil -> "Abonnement" (Plan mit freiem Platz): Kasten "n Mannschaft(en) frei in deinem Plan." -> Knopf "Mannschaft auswählen" (/add-team)','Ablauf Mannschaften -> Spieler -> Training -> Aufstellung wie im Onboarding, Hinweis "Bereits in deinem Plan enthalten, keine zusätzlichen Kosten."',"Abbruch/Zurück ohne Speichern","Ohne freien Platz wird /add-team ins Profil zurückgeleitet (kein Zugriff)",'Sonderzustand Plan-Limit überschritten: Profil -> Abonnement zeigt "Plan-Limit überschritten" mit Zeile "Mannschaften auswählen" -> Seite "Mannschaften anpassen"','Dort: Gruppe "Diese behalten" (n von Limit), Warnhinweis "Nicht ausgewählte Mannschaften werden getrennt", "Auswahl speichern" bzw. "Abbrechen"'],unklar:!1,entfallen:!1},{id:"ONB-11",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Onboarding nachholen (Erste Schritte auf der Übersicht)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Übersicht, Gruppe "Erste Schritte" (Mannschaft ohne Spieler und Training): Kasten "Mannschaft einrichten", Knopf "Onboarding starten" -> Assistent für Spieler/Training/Aufstellung','Daneben "Trainer einladen" (nur Owner/Admin; öffnet das Einladen-Fenster, siehe EIN-03)','Checkliste: "Alle n Aufgaben" aufklappen; Kreis antippen = Aufgabe als erledigt markieren, Zeile antippen = zur Seite; "Weniger anzeigen"','Nach der ersten erledigten Aufgabe nur Fortschrittszeile "Nächstes: …"','Unten "Überspringen": Dialog "Onboarding überspringen?" mit "Weiter lernen" und "Ja, überspringen"; danach ist die Gruppe dauerhaft weg','Hinweis "Lade dein Team ein" für diese Sitzung ausblenden (siehe EIN-04)'],unklar:!1,entfallen:!1},{id:"ONB-12",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Spieler tritt per Einladungslink bei (JoinTeam)",rollen:["OWN","TRA","SPI"],geraete:["desktop","android","ios"],schritte:["Link /join/… im abgemeldeten Zustand öffnen: Hülle mit Vereinsname/Wappen und Mannschaft, Konto erstellen oder anmelden (wie ONB-02)",'Schritt "Wer bist du?": Feld "Namen suchen", Liste noch nicht verknüpfter Spieler, Spieler wählen, Knopf "Beitreten als …"','Alternative "Ich bin nicht in der Liste" (bei leerer Liste "Neuen Eintrag erstellen") -> "Neuer Eintrag": "Vorname", "Nachname", Position (optional, zum Antippen), Knopf "Team beitreten"; am Desktop "Zur Liste"','Dialog "Bist du schon im Kader?" (ähnliche Namen): Eintrag wählen oder "Keiner davon – ich bin neu" beide Wege prüfen','Ergebnis "Willkommen im Team!" -> Knopf "Zur App" (leitet auch von selbst weiter); danach Spieleransicht (Übersicht, Mehr-Menü mit Abwesenheiten/Dateien)',"Schon eingeloggter Nutzer öffnet denselben Link: Konto-Schritt entfällt"],unklar:!1,entfallen:!1},{id:"ONB-13",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Einladung einlösen und Sonderfälle von Einladungslinks",rollen:["OWN","TRA","SPI"],geraete:["desktop","android","ios"],schritte:['/einladung (Link in Anmeldung "Einladung einlösen"): Feld für den Einladungslink, Knopf "Weiter" (leer gesperrt), "Aus Zwischenablage einfügen" (nur wo lesbar), Hinweis "Keinen Link? …"','Falschen Text einfügen: Fehler "Das sieht nicht wie ein Teamodo-Einladungslink aus. …"; leere Zwischenablage: Meldung',"Gültigen Link einfügen: Weiterleitung in den passenden Beitrittsablauf",'Abgelaufener/ungültiger Link (/join/…): "Dieser Link gilt nicht mehr" mit "Zur Startseite"; Netzfehler: "Das hat nicht geklappt" mit "Erneut versuchen"','Schon Mitglied/Staff-Konto/inaktiv: Karten "Bereits als Spieler dabei", "Link nur für Spieler", "Schon im Verein", "Zugang nicht aktiv" mit "Zur App"; "Mit anderem Konto anmelden" nur bei "Link nur für Spieler"'],unklar:!1,entfallen:!1},{id:"ONB-14",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Mitarbeiter-Einladung (Trainer/Staff)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["/staff-invite/… öffnen: Hülle mit Vereinsname und Rolle, Konto erstellen oder anmelden",'Schritt "Wer bist du?": vorhandene Mitarbeiter wählen (Aufgabe in der Unterzeile), "Beitreten als …"','Alternative "Neuer Eintrag": Vorname, Nachname, Aufgabe (Platzhalter "z. B. Co-Trainer, Torwarttrainer"), Knopf "Beitreten", "Zur Liste" am Desktop','Meldung "Willkommen!" ("Du wurdest dem Verein hinzugefügt."), Knopf "Zur App"; Trainer sieht danach nur seine zugewiesenen Mannschaften','Angemeldet ohne Verein: Zeile "Du willst lieber deinen eigenen Verein einrichten?" mit "Eigenen Verein anlegen"','Fehlerzustände wie ONB-13 (Karte "Schon im Verein" mit "Mit anderem Konto anmelden")'],unklar:!1,entfallen:!1},{id:"ONB-15",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Einladung Funktionsteam und Sportlicher Leiter",rollen:["OWN","SL","FT"],geraete:["desktop","android","ios"],schritte:["/funktionsteam-invite/… und /sportlicher-leiter-invite/… getrennt durchlaufen (Ablauf wie ONB-14, aber andere Rollenbezeichnung/Texte)","Danach als FT einloggen: Navigation Übersicht, Spiele, Mannschaftskasse; als SL: Training, Team, Teammanagement, Spiele, Bewertungen (Finanzen nur im Club-Plan)","Sportlicher Leiter einladen ist nur für Owner/Admin möglich (Link sonst nicht erzeugbar, siehe EIN-03)","Bereits vorhandenes Konto verwenden: Konto-Schritt wird übersprungen"],unklar:!1,entfallen:!1},{id:"ONB-16",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Kontaktformular und Anliegen-Varianten",rollen:["OWN","TRA","SPI","SPI-K","SL","FT"],geraete:["desktop","android","ios"],schritte:['/kontakt direkt öffnen: Titel "Teamodo für Deinen Verein", Felder "Name *", "E-Mail *", "Telefon (optional)", "Vereinsname (optional)", "Deine Anfrage *", Knopf "Nachricht senden"','Absenden mit leeren Pflichtfeldern: Fehlermeldung; gültig absenden: Erfolgsmeldung "Nachricht erfolgreich gesendet!"','Aus dem Onboarding "Verein melden" und "Mannschaft fehlt? Schreib uns": Titel wechselt ("Verein fehlt?" / "Mannschaft fehlt?"), Suchbegriff/Verein vorausgefüllt','Kopfleiste: abgemeldet Knopf "Login", angemeldet "Zurück zur Mannschaftsauswahl"; unter dem Formular Link "Zurück zur Mannschaftsauswahl"'],unklar:!1,entfallen:!1},{id:"ONB-17",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Kleine öffentliche Seiten und Weiterleitungen",rollen:["OWN","TRA","SPI","SPI-K","SL","FT"],geraete:["desktop","android","ios"],schritte:['/account-loeschen: Seite "Kontolöschung bei Teamodo" (Abschnitte "Direkt in der App löschen (empfohlen)", "Alternativ per E-Mail", "Was wird gelöscht", "Was ggf. bleibt"), Knopf "Jetzt in der App löschen" -> Profil','/winback?status=abgemeldet / danke / ungueltig: Titel "Du bist abgemeldet", "Danke für dein Feedback!", "Link nicht mehr gültig" mit passendem Knopf ("Zur Startseite" / "Mannschaft einrichten")',"/abonnement-bestaetigt ohne session_id: Weiterleitung ins Onboarding","/r/BEISPIELCODE: leitet auf die Startseite; danach Registrierung läuft mit Empfehlungscode (nur mit Testcode prüfbar)","Unbekannte Adresse abgemeldet (z. B. /gibt-es-nicht): es gibt keine 404-Seite, nur leere Seite (siehe PRO-19)"],unklar:!1,entfallen:!1},{id:"ONB-18",bereich:"ONB",bereichName:"Onboarding & Einladungen",titel:"Spielvorbereitung per Freigabelink ansehen",rollen:["OWN","TRA","SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:['Link /preparation/… (aus der Freigabe der Spielvorbereitung) abgemeldet öffnen: "Bitte melde dich an, um die Spielvorbereitung zu sehen." (die Ansicht erfordert Anmeldung, nicht offen für alle) -> Karte "Zugriff verweigert", Knopf "Zurück zur Übersicht"','Angemeldet als Spieler im Kader: Ansicht "Spielvorbereitung" mit Spielkarte, "Treffpunkt" ("In Karten öffnen"), Aufstellung/Bank, Abschnitt "Nicht im Kader", Textblöcke, Link-Block','Spieler außerhalb der Mannschaft: "Du bist nicht im Kader für dieses Spiel oder in einer der Mannschaften."','Ungültiger Token: "Spielvorbereitung nicht gefunden oder nicht freigegeben."','Nicht freigegebene Inhalte (Treffpunkt "Steht noch nicht fest") prüfen'],unklar:!1,entfallen:!1},{id:"EIN-01",bereich:"EIN",bereichName:"Einladen / Benutzer",titel:'"Person einladen / anlegen" öffnen und wählen',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Team (Kader) -> Aktionsknopf "Person einladen oder anlegen" (mobil runder Knopf im Seitentitel bzw. nach dem Scrollen in der Kopfleiste, Desktop Knopf "Person einladen / anlegen" in der Kopfzeile)','Dialog "Person einladen / anlegen" mit den Zeilen "Einladen" (Bekommt einen Link und nutzt die App selbst) und "Spieler/Mitarbeiter anlegen" (Wird nur eingetragen, ohne App-Zugang); Hinweis "Angelegte Personen kannst du später einladen."','"Spieler/Mitarbeiter anlegen": Stufe "Wen möchtest du anlegen?" mit "Spieler anlegen", "Mitarbeiter anlegen" (nur Owner/Admin, für TRA nicht sichtbar), "Aus CSV importieren" (nur öffnen und mit Zurück/Schließen abbrechen, die Anlegen-Formulare gehören zur Kader-Prüfung)','Zurück in der Stufe "Wen möchtest du anlegen?" (mobil Pfeil im Kopf, Desktop Knopf "Zurück") bringt zur Wahl zurück',"Dialog schließen ohne Aktion"],unklar:!1,entfallen:!1},{id:"EIN-02",bereich:"EIN",bereichName:"Einladen / Benutzer",titel:"Spieler per Link einladen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['"Person einladen / anlegen" -> "Einladen": Fenster "Einladen" mit Rollenwahl "Wen einladen", "Spieler" vorgewählt','Info-Symbol an der Rolle: Blatt "So erleben Spieler die App" und zurück','"Für Mannschaft" (bei mehreren Mannschaften Auswahl, bei einer fest); "Link erstellen" (mobil oben im Kopf, Desktop unten)','Ergebnis "Einladungslink": "Link teilen" (Handy: Teilen-Blatt), "Link kopieren" -> Zeile wechselt zu "Kopiert" und Hinweis "Link kopiert"; "Weitere Einladung", "Fertig"','Erneut öffnen: derselbe Link je Mannschaft wird wiederverwendet; Hinweis "Ein Link für die ganze Mannschaft. Wer ihn öffnet, tritt als Spieler bei."',"Link in privatem Fenster öffnen = Ablauf aus ONB-12"],unklar:!1,entfallen:!1},{id:"EIN-03",bereich:"EIN",bereichName:"Einladen / Benutzer",titel:"Mitarbeiter einladen (Trainer, Funktionsteam, Sportlicher Leiter, Administrator)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Fenster "Einladen": Rollenliste "Wen einladen" mit Spieler, Trainer, Funktionsteam, Sportlicher Leiter, Administrator (Administrator nur im Club-/Beta-Plan, Trainer/Sportl. Leiter/Administrator nur für Owner/Admin sichtbar)','Info je Rolle: "Was darf ein Trainer?", "Was sieht das Funktionsteam?", "Was darf ein Sportlicher Leiter?", "Was darf ein Administrator?"','Trainer, Funktionsteam und Sportlicher Leiter: "Für Mannschaften" mehrfach wählen; Administrator: Hinweis "Gilt für alle Mannschaften des Vereins."','Zeile "Gültigkeit begrenzen" antippen -> Block "Gültigkeit" mit "Gültig bis" (Platzhalter "Unbegrenzt") und "Nutzbar" (Platzhalter "Beliebig oft")','"Link erstellen" -> teilen/kopieren; Hinweis "Der Link ist nicht an eine Person gebunden."',"Als TRA: nur Spieler und Funktionsteam wählbar"],unklar:!1,entfallen:!1},{id:"EIN-04",bereich:"EIN",bereichName:"Einladen / Benutzer",titel:"Einladen aus einer Zeile, Profil und Erste Schritte",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Team (Desktop-Tabelle): Spalte "Zugang" bei Spielern ohne Zugang mit Knopf "Einladen" -> Fenster "Einladen" (Spieler vorgewählt); mit Zugang steht ein Haken','Mitarbeiterzeile ohne Zugang (Sektion "Trainer & Mitarbeiter") "Einladen": Titel "<Name> einladen", Hinweis "Schick den Link an <Name>. Beim Beitritt wählt sich die Person selbst aus eurer Mitarbeiterliste aus."','Profil einer Person ohne Zugang: Gruppe "Zugang & Rolle" -> "Kein App-Zugang" -> "Einladungslink erstellen"','Übersicht "Erste Schritte": Kasten "Lade dein Team ein" (n Spieler haben noch keinen Zugang) antippen = Liste der Spieler ohne Zugang; Knopf "Einladen"; "Mehr erfahren"',"Einladen-Hinweis ausblenden (X, gilt für die Sitzung)"],unklar:!1,entfallen:!1},{id:"EIN-05",bereich:"EIN",bereichName:"Einladen / Benutzer",titel:"Zugang und Rolle einer Person verwalten",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Spieler- oder Mitarbeiterprofil mit App-Zugang: Gruppe "Zugang & Rolle" mit App-Zugang (Aktiv/Inaktiv), Rolle, E-Mail, Mannschaften','Mitarbeiter (Trainer, Funktionsteam, Sportl. Leiter): "Bearbeiten" -> Fenster "Rolle und Mannschaften" (Rolle wechseln, Mannschaften, Info-Blatt je Rolle); eigenes Konto: nur "Mannschaften"','Spieler mit Rolle Spieler: "Kein Spieler? Rolle korrigieren" (nur Owner/Admin) -> Fenster "Rolle korrigieren" ("Gehört zum Verein als", "Im Kader"), Speichern bzw. Abbrechen','"Zugang entfernen" (TRA nur bei Spielern): Dialog "Zugang entfernen?", Abbrechen-Weg prüfen (Löschen nur an Testperson)',"Nicht sichtbar: eigenes Konto und Owner (kein Entfernen/Korrigieren)"],unklar:!1,entfallen:!1},{id:"EIN-06",bereich:"EIN",bereichName:"Einladen / Benutzer",titel:'"Nicht zugeordnet" und "Ehemalige" im Team',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Team-Seite: Suchfeld "Person suchen..." filtert Kader, Pausierte, Trainer & Mitarbeiter, Nicht zugeordnet und Ehemalige gleichzeitig','Gruppe "Nicht zugeordnet" (Spieler ohne Mannschaft, nur wenn vorhanden): Knopf "Mannschaft zuweisen" und Zeile -> Profil','"Ehemalige anzeigen (n)" auf-/zuklappen, Zeile -> Profil',"Leerzustand ohne solche Personen: Gruppen fehlen",'Statistik-Pillen oben: "Abwesend" antippen führt zu den Abwesenheiten (/app/team-management/absences); "Aushilfen" erscheint nur bei Aushilfen und ist nicht klickbar'],unklar:!1,entfallen:!1},{id:"EIN-07",bereich:"EIN",bereichName:"Einladen / Benutzer",titel:"Einladen-Rechte: SL, FT, SPI prüfen",rollen:["SPI","SPI-K","SL","FT"],geraete:["desktop","android","ios"],schritte:['SL: Team-Seite öffnen (Seitenleiste/Mehr): kein Aktionsknopf "Person einladen oder anlegen", keine Spalte "Zugang", keine Zuweisen-Knöpfe','FT und SPI: Team/Teammanagement-Seiten nicht in der Navigation; /app/team direkt aufrufen -> "Zugriff verweigert" (/app/players leitet SPI auf die eigene Spieleransicht um)','Kein Einladen-Hinweis in "Erste Schritte" für diese Rollen'],unklar:!1,entfallen:!1},{id:"PRO-01",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:"Profil: Aufbau und Themenliste",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Profil öffnen (Avatar oben rechts): Kopf mit Bild, Name, E-Mail und Rollen-Chip",'Liste in Gruppen: "Mein Konto" (Persönliche Daten, Passwort, Vereinsfarben nur Owner, Abonnement nur Owner/Admin), "Mitteilungen & Rechte" (Benachrichtigungen, Spieler-Rechte), "App" (Darstellung, Version & Bewertung, Rechtliches & Konto), unten "Abmelden"',"Mobil (und schmale Fenster): Thema öffnet Drawer/Dialog mit Haken zum Schließen; breites Desktop-Fenster: Liste links, Inhalt rechts","Direktaufruf /app/profile?thema=abo (oder push, daten, passwort, darstellung, app, rechtliches, rechte, vereinsfarben) öffnet das Thema","Jedes Thema einmal öffnen und wieder schließen"],unklar:!1,entfallen:!1},{id:"PRO-02",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:"Persönliche Daten bearbeiten",rollen:["OWN","TRA","SPI"],geraete:["desktop","android","ios"],schritte:['Thema "Persönliche Daten": Gruppe "Kontakt" mit E-Mail, Geburtsdatum, Telefon; Hinweis "Die E-Mail-Adresse kann nicht geändert werden."','"Bearbeiten" (oder Kamera-Knopf am Profilbild "Profilbild ändern"): Foto wählen/aufnehmen, Name (Gruppe "Name" mit Vorname/Nachname nur bei Mitarbeitern), Geburtsdatum, Telefon','"Abbrechen" verwirft; "Speichern" übernimmt, Anzeige aktualisiert',"Profilbild entfernen","Konto ohne verknüpften Spieler/Mitarbeiter: nur E-Mail sichtbar, kein Bearbeiten (z. B. reiner Owner ohne Profil)"],unklar:!1,entfallen:!1},{id:"PRO-03",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:"Passwort ändern",rollen:["OWN","TRA","SPI","SPI-K","SL","FT"],geraete:["desktop","android","ios"],schritte:['Thema "Passwort": Felder "Aktuelles Passwort", "Neues Passwort", "Neues Passwort bestätigen"','Hinweis "Mindestens 6 Zeichen. Das zweite Feld wiederholt das neue Passwort."','Fehler: leer ("Aktuelles Passwort erforderlich."), falsches aktuelles Passwort ("Aktuelles Passwort ist falsch."), ungleiche Eingaben, zu kurz','Knopf "Passwort aktualisieren" -> Erfolgsmeldung "Passwort wurde erfolgreich geändert."; abmelden und mit neuem Passwort anmelden',"Konten, die nur über Google/Apple angelegt wurden: Verhalten beobachten (nur melden)"],unklar:!1,entfallen:!1},{id:"PRO-04",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:"Darstellung: Hell, Dunkel, System",rollen:["OWN","TRA","SPI","SPI-K","SL","FT"],geraete:["desktop","android","ios"],schritte:['Thema "Darstellung": Gruppe "Farbschema" mit Kacheln "Hell", "Dunkel", "System"','Jede wählen: App wechselt sofort, gewählte Kachel zeigt Haken, Hinweistext "„System“ folgt der Einstellung deines Geräts. Deine Auswahl wird gespeichert."',"Seite neu laden: Auswahl bleibt erhalten",'"System": Gerätemodus wechseln und Reaktion prüfen',"Kurze Sichtprüfung Übersicht, Profil, ein Drawer in Dunkel (Lesbarkeit grüne Schrift)"],unklar:!1,entfallen:!1},{id:"PRO-05",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:"Benachrichtigungen (Push) einstellen",rollen:["OWN","TRA","SPI"],geraete:["desktop","android","ios"],schritte:['Thema "Benachrichtigungen": Kurzstatus "Aus" oder "An · n von m Arten"; Schalter "Push-Mitteilungen" ("Auf diesem Gerät") einschalten -> Systemabfrage zulassen','Danach Gruppen "Aus welchen Mannschaften" (nur bei mehr als einer Mannschaft) und "Welche Benachrichtigungen erhalten" (Schalter je Art, z. B. "Neue Abstimmung", "Neue Mannschafts-Nachricht", "Trainingsänderungen", "Termine", "Aufstellung freigegeben", "Bezahlung erfasst")',"Einzelne Arten und Mannschaften ab-/anschalten, neu laden, Zustand bleibt","Gesamtschalter aus: Gruppen verschwinden","Systemabfrage ablehnen: Fehlerhinweis (rot) erscheint","Nur Handy: Testnachricht antippen führt zur richtigen Seite"],unklar:!1,entfallen:!1},{id:"PRO-06",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:"Benachrichtigungsarten je Rolle (Differenz)",rollen:["TRA","SPI","SPI-K","SL","FT"],geraete:["desktop","android","ios"],schritte:['SPI: Liste enthält spielerrelevante Arten (z. B. "Neue Datei für dich", "Abwesenheit durch Trainer"), nicht "Abwesenheit eines Spielers"','SPI-K (Kassenwart): zusätzlich "Zahlung gemeldet (Kasse)" (erscheint für jeden, der irgendwo Kassenwart ist)','TRA (und Owner/Admin): zusätzlich "Abwesenheit eines Spielers"','FT und SL: Liste kurz durchsehen; nur allgemeine Arten (keine Spielerarten wie "Neue Datei für dich", auch nicht "Abwesenheit eines Spielers")','Je Rolle Anzahl "n von m Arten" im Kurzstatus notieren'],unklar:!1,entfallen:!1},{id:"PRO-07",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:"Spieler-Rechte festlegen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Thema "Spieler-Rechte" ("Was Spieler selbst tun dürfen"): Text "Lege fest, was Spieler in deinen Mannschaften selbst tun dürfen."','Pro Mannschaft (bei mehreren mit Überschrift) Schalter "Spieler dürfen Abwesenheiten selbst anlegen"','Umschalten speichert sofort (Hinweis "Spieler dürfen Abwesenheiten selbst anlegen." bzw. "Nur noch Trainer können Abwesenheiten anlegen."); Seite neu laden: Zustand bleibt',"Gegenprobe als SPI: Meine Abwesenheiten -> Anlegen-Knopf je nach Einstellung vorhanden/nicht vorhanden (Details in Bereich Abwesenheiten)","SL/FT/SPI sehen das Thema nicht"],unklar:!1,entfallen:!1},{id:"PRO-08",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:"Vereinsfarben (nur Owner)",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Thema "Vereinsfarben" ("Für Bilder wie die Startelf"): Text "Gelten für alle Mannschaften von <Verein>."',"Hauptfarbe und Akzentfarbe wählen, Vorschau prüfen, speichern","Neu laden: Farben bleiben; Wirkung in Startelf-/Ergebnisbild (Bereich Spiele) prüfen","Admin/Trainer: Thema ist nicht sichtbar"],unklar:!1,entfallen:!1},{id:"PRO-09",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:"Abonnement ansehen und verwalten",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Thema "Abonnement": Gruppe "Dein Tarif" (Plan, Monatlich/Jährlich, Chip Aktiv/Probe, "Nächste Zahlung" bzw. "Probeabo bis" bzw. "Läuft bis", "Verknüpfte Mannschaften n von m")','Stripe-Abo: Gruppe "Verwalten" -> "Abo verwalten" öffnet das Stripe-Kundenportal (zurück zur App)','Store-Abo (Handy): "Abo verwalten" öffnet Apple-/Google-Abos; Hinweistext zur Plattform','Handy: Gruppe "Käufe" -> "Käufe wiederherstellen"','Beta-Konto (falls vorhanden): "Beta-Zugang" – "Kostenlos, ohne Mannschaftsgrenze"','Abo, das auf anderer Plattform abgeschlossen wurde: Hinweis "Änderungen an diesem Abo sind nur auf der Plattform möglich, auf der es ursprünglich abgeschlossen wurde."'],unklar:!1,entfallen:!1},{id:"PRO-10",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:'Plan ändern ("Plan ändern / Mehr Teams")',rollen:["OWN"],geraete:["desktop"],schritte:['Abonnement -> Gruppe "Verwalten" -> Zeile "Plan ändern / Mehr Teams" (nur bei aktivem Stripe-Abo ohne Probe): Dialog "Plan ändern"','Tarif (1/2/3 M ,"TRA","SPI","SPI-K","SL","FT"],geraete:["desktop","android","ios"],schritte:['Thema "Rechtliches & Konto": "Datenschutzerklärung" öffnet Seite (zurück per Zurück-Pfeil)','"Mehr zur Kontolöschung" öffnet /account-loeschen','Handy: "Tracking-Einstellungen" öffnet Dialog "Datenschutz-Einstellungen" (nur Schalter "Marketing"; "Abbrechen" / "Alle speichern")','Hinweis zu aktiven Abos unter "Konto" lesen'],unklar:!1,entfallen:!1},{id:"PRO-14",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:"Konto löschen",rollen:["OWN","SPI"],geraete:["desktop","android","ios"],schritte:['"Rechtliches & Konto" -> Gruppe "Konto" -> "Konto löschen" (rot): Dialog "Konto löschen?" mit Erklärtext','Grund aus Liste wählen (z. B. "Wollte es nur ausprobieren / Test-Account", "Zu teuer / Preis passt nicht", "Sonstiges") plus optionales Textfeld "Möchtest du uns mehr sagen?"','Feld "LÖSCHEN eintippen": falsche Eingabe -> "Bitte „LÖSCHEN“ exakt eintippen."; Knopf "Konto endgültig löschen" erst mit Grund + Eingabe aktiv','"Abbrechen" (Desktop) bzw. Schließen: nichts passiert, Felder zurückgesetzt','Nur mit Wegwerf-Konto durchführen: danach Meldung "Konto gelöscht", Weiterleitung zur Anmeldung, Anmeldung nicht mehr möglich'],unklar:!1,entfallen:!1},{id:"PRO-15",bereich:"PRO",bereichName:"Profil, Abo, Support",titel:"Trainer werben (Empfehlungsprogramm)",rollen:["OWN","TRA","SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:['Menü "Trainer werben" (mobil im "Mehr"-Drawer als "Trainer werben"): Titel, Beschreibung (50 €-Prämie)','Gruppe "Deine Prämie" mit "Dein Link": Knöpfe "Kopieren" (Hinweis "Link kopiert"), "Per WhatsApp teilen", Teilen',`Gruppe "So funktioniert's" lesen, Gruppe "Dein Guthaben" ("Auszahlbar", "Erfolgreich")`,'Knopf "n auszahlen lassen" (bei 0 "Noch nichts auszahlbar", gesperrt) -> Dialog "Auszahlung anfordern": Wahl SEPA/PayPal, Felder Kontoinhaber/IBAN bzw. PayPal-E-Mail, "Anfordern" (Hinweis "Auszahlung angefordert")','Gruppe "Deine Werbungen": Leerzustand "Noch r"',rollen:["OWN","TRA","SPI","SL","FT"],geraete:["android","ios"],schritte:['Untere Leiste "Hauptnavigation": Übersicht + bis zu 3 Rollenpunkte + "Mehr" (Owner/Admin: Team, Spiele, Training; Trainer: Team, Training, Spiele; SPI: Spiele, Abwesend, Kasse; FT: Spiele, Kasse; SL: Team, Spiele, Verwaltung)','"Mehr"-Drawer ("Mehr"): restliche Punkte (OWN: Verwaltung, Bewertung, Finanzen, Trainer werben; TRA: Verwaltung, Bewertung, Trainer werben; SL: Bewertung, Finanzen im Club-Plan, Training; SPI: Dateien, Trainer werben; FT: Trainer werben), darunter "Profil", "Support", "Abmelden"','Aktiver Punkt markiert; "Mehr" aktiv, wenn aktuelle Seite darin liegt',"Drawer per Wischen nach unten schließen","Kein rundes Plus-Feld über der Leiste (Anlegen sitzt in Kopfleiste)"],unklar:!1,entfallen:!1},{id:"NAV-03",bereich:"NAV",bereichName:"Navigation & Querschnitt",titel:"Kopfleiste, Seitentitel und Aktionsknopf",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Mobil: Wappen-Pille links ("Zur Übersicht"/"Nach oben"; ganz oben bei mehreren Mannschaften mit Mannschaftsname und Pfeil = Auswahl), Suche und Profil rechts; beim Scrollen fliegt der Seitentitel mittig ein','Unterseite (z. B. Spieler öffnen): Zurück-Pfeil ("Zurück") links statt der Pille, Titel mittig, ggf. Personenmarke','Aktionsknopf (runder Plus-Knopf) auf Seiten mit Anlegen (z. B. Spieler, Training): im Seitentitel, nach Scrollen rechts in der Kopfleiste; Knopf mit Menü (z. B. "Spieler"/"Mitarbeiter") öffnet Auswahl',"Hub-Seiten ohne Plus prüfen",'Desktop: Kopfleiste mit Zurück-Pfeil, Suchfeld "Suchen" (Strg+K) und Profil mit Namen',"Abgelaufenes Abo: Suche in Kopfleiste fehlt"],unklar:!1,entfallen:!1},{id:"NAV-04",bereich:"NAV",bereichName:"Navigation & Querschnitt",titel:"Mannschaft und Verein wechseln",rollen:["OWN","TRA","SPI"],geraete:["desktop","android","ios"],schritte:['Mobil: Mannschafts-Pille (Kopfleiste ganz oben, nur im oberen Seitenbereich) -> Sheet "Mannschaft" mit Kürzel-Zeilen, aktive
