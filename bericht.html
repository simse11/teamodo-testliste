 A: Teammanagement, Gruppe "Aufstellungen & Standards", Reiter "Standards", Fußzeile "Alle Standards"; Einstieg B: Seite "Standardsituationen" (Info-Symbol, Zurück)','Mobil/schmal: Gruppen "Offensiv" und "Defensiv" (in dieser Reihenfolge) mit Halbfeld-Vorschau, Name, Beschreibung oder "n Positionen"','Desktop ab 1280 px: links Liste, rechts große Feld-Ansicht mit Richtungs-Etikett und "Bearbeiten"','Situation antippen bzw. "Bearbeiten": Detailseite (STD-03)','Leerzustände: "Keine Standardsituationen" mit "Standard erstellen" (Hub: "Erste Standardsituation erstellen"); "Mannschaft auswählen"; "Keine Mannschaft zugewiesen"',"Mannschaft in der Kopfzeile wechseln"],unklar:!1,entfallen:!1},{id:"STD-02",bereich:"STD",bereichName:"Standardsituationen",titel:"Neue Standardsituation anlegen und abbrechen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Wege: Seite "Standardsituationen" ("Neu" Desktop, runder Knopf "Neue Standardsituation" Handy, Leerzustand "Standard erstellen"), Hub-Gruppe (Plus/ "Erste Standardsituation erstellen") und im Spiel (Reiter "Standardsituationen", AUF-10; dort Richtung vorbelegt)','Dialog "Neue Standardsituation": Name (Platzhalter "Name, z. B. Ecke links"), Richtung (Karten "Defensiv"/"Offensiv", Pflicht), Beschreibung (Platzhalter "Optional: Ablauf, Laufwege, Signal …")','Ohne Namen oder Richtung ist "Erstellen"/"Standardsituation erstellen" gesperrt','Erstellen: Hinweis "Standardsituation erstellt", Detailseite öffnet sich mit 11 Positionen (4-4-2 Raster) und Ball','Abbrechen: "Abbrechen" (Desktop) bzw. Schließen (Handy): nichts wird angelegt',"Alle drei Einstiege einmal prüfen"],unklar:!1,entfallen:!1},{id:"STD-03",bereich:"STD",bereichName:"Standardsituationen",titel:"Standardsituation: Positionen und Ball verschieben, drucken",rollen:["OWN","TRA"],geraete:["desktop"],schritte:['Detailseite: Titel, Richtungs-Etikett, "n Positionen", Knopf "PDF drucken"','Feld "Spielfeld" mit Hinweis "Ziehen zum Verschieben, wird automatisch gespeichert"',"Nummerierte Positionen (1 bis 11) und Ball ziehen; Seite neu laden: Positionen bleiben","Offensiv: Tor oben (Feld gedreht), Defensiv: Tor unten; Positionen sind nicht löschbar",'"PDF drucken": Druckvorschau öffnet; bei Sperre "Pop-up blockiert" bzw. "PDF konnte nicht erstellt werden"',"Zurück zur Liste; Vorschau dort zeigt die neuen Positionen"],unklar:!1,entfallen:!1},{id:"STD-04",bereich:"STD",bereichName:"Standardsituationen",titel:"Standardsituation auf dem Handy bearbeiten",rollen:["OWN","TRA"],geraete:["android","ios"],schritte:['Detailseite: Feld ist hochkant (um 90 Grad gedreht), Hinweis "Positionen ziehen, wird automatisch gespeichert"',"Positionen und Ball mit dem Finger ziehen; Zieh-Richtung muss zur Fingerbewegung passen","Scrollen neben den Positionen funktioniert weiter","PDF drucken-Knopf: Verhalten in der App","Zurück-Wischen/Zurück-Taste führt zur Liste bzw. zum Spiel"],unklar:!1,entfallen:!1},{id:"STD-05",bereich:"STD",bereichName:"Standardsituationen",titel:"Standardsituation bearbeiten (Name, Richtung, Beschreibung)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Stift neben dem Titel ("Name, Beschreibung und Richtung ändern"): Dialog "Standardsituation bearbeiten" (Handy "Bearbeiten")','Name und Beschreibung ändern, Richtung umstellen (Hinweis "Beim Wechsel dreht sich nur das Spielfeld. Die Positionen bleiben stehen.")','"Speichern" (Handy Haken): Titel, Etikett und Feld stimmen','"Abbrechen" (Handy Schließen): Änderungen werden verworfen',"Liste (STD-01) zeigt neue Werte und die richtige Gruppe (Defensiv/Offensiv)"],unklar:!1,entfallen:!1},{id:"STD-06",bereich:"STD",bereichName:"Standardsituationen",titel:"Standardsituation löschen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Im Dialog "Standardsituation bearbeiten": Desktop Löschen unten links, Handy "Standardsituation löschen" am Ende des Inhalts','Bestätigung "Standardsituation löschen" (Text: Zuordnungen bei Spielen gehen verloren): erst "Abbrechen", dann bestätigen','Hinweis "Standardsituation gelöscht", Rückkehr zur Liste','Im Spiel (Reiter "Standardsituationen") ist sie weg; Punkt am Reiter stimmt wieder'],unklar:!1,entfallen:!1},{id:"KAD-01",bereich:"KAD",bereichName:"Team / Kader",titel:'Seite „Team": Überblick, Suche, Mannschaft wechseln',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Menü „Team" öffnen. Titel „Team" mit Info-Symbol daneben: Popover „Zusätzliche Rechte" (Kapitän, Mannschaftsrat, Kassenwart) lesen und schließen.','Kennzahlen-Pillen prüfen. Handy: „Verfügbar", „Abwesend". Desktop: „Spieler", „Verfügbar", „Abwesend", bei laufender Aushilfe zusätzlich „Aushilfen".','Auf die Pille „Abwesend" tippen: öffnet die Abwesenheiten-Seite (die Seite selbst prüft ein anderer Teilbereich), zurück.','Suchfeld „Person suchen…": Namen teilweise eintippen (auch in falscher Reihenfolge, z. B. „mueller ma"). Filtert Kader, Pausierte, „Trainer & Mitarbeiter", „Nicht zugeordnet" und „Ehemalige" gleichzeitig. Kein Treffer: Meldung „Kein Spieler im Kader passt zu …". Suche leeren.',"Mannschaft in der Kopfleiste wechseln (Mannschaftswahl): Liste und Kennzahlen laden neu.",'Leerzustand einer Mannschaft ohne Spieler: „Keine Spieler" mit Knopf „Ersten Spieler hinzufügen".'],unklar:!1,entfallen:!1},{id:"KAD-02",bereich:"KAD",bereichName:"Team / Kader",titel:"Kader sortieren und Spieler öffnen (Handy-Liste)",rollen:["OWN","TRA"],geraete:["android","ios"],schritte:['Auswahlfeld mit Pfeil-Symbol über der Liste öffnen: „Nr. aufsteigend", „Nr. absteigend", „Name A–Z", „Name Z–A", „Position TW → ST", „Position ST → TW", „Verfügbar zuerst", „Abwesend zuerst". Jede Sortierung einmal wählen.','Zeilen prüfen: Symbole für Kapitän, Mannschaftsrat, Kassenwart, grüner Haken „Hat App-Zugang", Status-Zweitzeile („… · bis TT.MM.", „bald abwesend · ab …", „hilft aus").',"Eine Zeile antippen: Spielerprofil öffnet (siehe SPP-01), per Zurück wieder in die Liste."],unklar:!1,entfallen:!1},{id:"KAD-03",bereich:"KAD",bereichName:"Team / Kader",titel:"Spieler-Tabelle sortieren und direkt bearbeiten (Desktop)",rollen:["OWN","TRA"],geraete:["desktop"],schritte:['Tabellenköpfe „#", „Spieler", „Position", „Status" anklicken (auf-/absteigend). Weitere Spalten: Kapitän, Mannschaftsrat, Kassenwart (Symbole) und „Zugang".',"Ganze Zeile anklicken: Spielerprofil öffnet.",'Nummernzelle anklicken: Popover mit Nummernfeld. Freie Nummer wählen (Meldung „Rückennummer aktualisiert"), bereits vergebene Nummer wählen (Meldung „Nummer … ist bereits vergeben"), „Nummer entfernen" leert das Feld.','Positionszelle anklicken: Popover mit Positionsauswahl (bis 3 Positionen, erste = Hauptposition) und starkem Fuß, „Übernehmen" (Meldung „Kader aktualisiert").','Zellen Kapitän, Mannschaftsrat, Kassenwart anklicken: schalten sofort um. Kassenwart-Meldungen: „Als Kassenwart hinzugefügt" bzw. „Kassenwart-Status entfernt". Zurückschalten.','Spalte „Zugang": Haken bei vorhandenem Zugang, sonst Knopf „Einladen" (öffnet den Einladen-Dialog, die Abläufe darin prüft ein anderer Teilbereich).',"Bei Spielern mit laufender Aushilfe (siehe KAD-09) sind die Zellen nicht bearbeitbar."],unklar:!1,entfallen:!1},{id:"KAD-04",bereich:"KAD",bereichName:"Team / Kader",titel:'„Person einladen / anlegen": Einstiegsdialog',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Desktop: Knopf „Person einladen / anlegen" oben rechts. Handy: runder Knopf in der Kopfleiste („Person einladen oder anlegen").','Dialog „Person einladen / anlegen": zwei Wege, „Einladen" (Bekommt einen Link und nutzt die App selbst) und „Spieler/Mitarbeiter anlegen" (Wird nur eingetragen, ohne App-Zugang).','„Einladen" wählen: Einladen-Dialog öffnet (Inhalt prüft ein anderer Teilbereich), schließen.','„Spieler/Mitarbeiter anlegen" wählen: zweite Stufe „Wen möchtest du anlegen?" mit „Spieler anlegen" (Ein Spieler für den Kader), „Mitarbeiter anlegen" (Trainer, Betreuer oder andere Funktion), „Aus CSV importieren" (Mehrere Spieler auf einmal anlegen). Mit „Zurück" zur ersten Stufe, dann Dialog schließen.','Prüfen: „Mitarbeiter anlegen" erscheint nur beim Owner (bzw. Admin auf Club-Plan), nicht beim Trainer. „Spieler anlegen" und „Aus CSV importieren" erscheinen bei Owner und Trainer.'],unklar:!1,entfallen:!1},{id:"KAD-05",bereich:"KAD",bereichName:"Team / Kader",titel:"Spieler hinzufügen (suchen oder neu anlegen) und abbrechen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Über KAD-04 „Spieler anlegen" (oder „Ersten Spieler hinzufügen" im Leerzustand). Dialog „Spieler hinzufügen".','Suchfeld „Spieler suchen…": unter 3 Zeichen kommt der Hinweis „Mind. 3 Zeichen eingeben", ohne Treffer „Keine Spieler gefunden". Treffer mit Kennzeichen „Eigener Verein" beachten.','Reiter „Verein" (neben „Spieler" unter dem Suchfeld): „Verein suchen…", Verein antippen, Mannschaft antippen, Spieler antippen. „Zurück" in jeder Stufe (Handy: Pfeil im Kopf). Leerhinweise „Keine Mannschaften" und „Keine Spieler im Kader bekannt".','Vorhandenen Spieler wählen: Formular „Zur Mannschaft hinzufügen", speichern mit „Hinzufügen".','Knopf „Nicht gefunden — Spieler anlegen": Formular „Neuer Spieler" mit Vorname, Nachname, Geboren, Position, Nummer, Starker Fuß, „Mehr angeben" (Handy, Notizen, Foto). Zuerst mit „Zurück" bzw. Abbrechen verlassen (nichts wird angelegt), dann erneut öffnen und mit „Anlegen" speichern.',"Bei gleichnamigem Spieler im Verein erscheint ein Duplikat-Hinweis zur Bestätigung. Neuer Spieler steht danach im Kader."],unklar:!1,entfallen:!1},{id:"KAD-06",bereich:"KAD",bereichName:"Team / Kader",titel:"Spieler per CSV importieren (DFBnet)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Über KAD-04 „Aus CSV importieren". Dialog „Spieler importieren" mit Info-Symbol neben dem Titel.','Info-Symbol antippen: Hilfe „So funktioniert der DFBnet-Import" mit Kasten „Hinweise" lesen, schließen.','Falsche oder leere Datei wählen: Meldung „Keine Spieler gefunden" bzw. „Fehler beim Lesen".','Passende CSV wählen („Datei auswählen"; der Text sagt auch „hierher ziehen", ob Ziehen geht, mitprüfen). Schritt „Import-Vorschau": Zähler Neu, Vorhanden, Kein Spielrecht, Bereits im Team; Zeilen-Badges (Vorhanden, Ergänzen, Im Team, Kein Spielrecht, Mehrdeutig, Fehler).','„Alle auswählen" an- und abwählen, einzelne Zeilen abwählen. Zurück zur Dateiauswahl.','Import starten: „Import läuft…" mit Fortschrittsbalken, dann „Import abgeschlossen" mit Kacheln (Neue Spieler, Daten ergänzt, Übersprungen, Fehler). Schließen. Spieler stehen im Kader.'],unklar:!1,entfallen:!1},{id:"KAD-07",bereich:"KAD",bereichName:"Team / Kader",titel:"Nummern, Positionen & Rollen (Sammel-Dialog)",rollen:["OWN","TRA"],geraete:["android","ios"],schritte:['Stift-Knopf rechts neben der Sortierung („Nummern, Positionen & Rollen"). Er fehlt bei Rollen ohne Kader-Bearbeitung und wenn die Aushilfe-Daten nicht geladen werden konnten.','Je Spieler: Rückennummer-Knopf (öffnet ein Nummernfeld), Positionen (bis 3, erste = Hauptposition) mit starkem Fuß, „Rollen" (Kapitän, Mannschaftsrat, Kassenwart als Schalter).','Dieselbe Nummer zweimal vergeben: Fehler „Nummer … ist doppelt vergeben".','Speichern: Meldung „Kader aktualisiert", Liste zeigt die Änderungen. Danach erneut öffnen und per Abbrechen/Zurück verlassen: nichts ändert sich.',"Spieler mit laufender Aushilfe erscheinen ausgegraut und sind gesperrt."],unklar:!1,entfallen:!1},{id:"KAD-08",bereich:"KAD",bereichName:"Team / Kader",titel:'„Trainer & Mitarbeiter" und Mitarbeiter anlegen',rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Bereich „Trainer & Mitarbeiter" unter dem Kader: Zeilen mit Name, Funktion/Aufgabe · Mannschaften, Rollen-Badge (nur ab Tablet) und Zugang (Smartphone-Symbol, ab Tablet mit E-Mail) oder Knopf „Einladen".','Zeile antippen: Mitarbeiterprofil öffnet (siehe MIT-01). Suche (siehe KAD-01) filtert auch hier, ohne Treffer „Kein Mitarbeiter passt zu …".','Leerzustand „Noch keine Mitarbeiter" mit Knopf „Mitarbeiter anlegen" (sonst über KAD-04).','Dialog „Neuer Mitarbeiter": Name und Foto, „Funktion" (Auswahl „Wählen"), „Mannschaft" (bei mehreren Auswahl, bei nur einer fest angezeigt), Schalter „Extern" („Externe gehören keiner Mannschaft an."), Kontakt (E-Mail, Telefon), „Mehr Angaben" (Geburtsdatum, Aufgabe, Adresse). Erst abbrechen (Desktop „Abbrechen", Handy schließen), dann erneut öffnen und speichern (Desktop „Mitarbeiter anlegen", Handy Haken oben rechts).',"Neuer Mitarbeiter erscheint in der Liste."],unklar:!1,entfallen:!1},{id:"KAD-09",bereich:"KAD",bereichName:"Team / Kader",titel:'Pausierte Spieler, „Nicht zugeordnet", „Ehemalige", Aushilfe-Hinweise',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['„Pausierte Spieler" (nur sichtbar, wenn es welche gibt): Zeile antippen öffnet das Profil. Knopf „Aktivieren": Meldung „Spieler aktiviert", dann Frage „Pause beendet" mit „Später" oder „Abwesenheit eintragen" (öffnet den Abwesenheits-Dialog mit vorbelegtem Zeitraum, nur bei „Eintragen" speichern).','„Nicht zugeordnet" (amberfarben, nur bei Fällen ohne Mannschaft): Zeile öffnet das Profil, Knopf „Mannschaft zuweisen" öffnet den Engagement-Dialog (siehe SPP-04).','„Ehemalige anzeigen (n)": aus- und einklappen, Zeile zeigt „bis TT.MM.JJJJ", antippen öffnet das Profil.','Aushilfe: Spieler mit laufender Aushilfe tragen die Zeile „Aushilfe von …" (im Zielteam) bzw. „Hilft aus bei … · bis …" (im Stammteam) und in der Desktop-Tabelle das Badge „Aushilfe · bis …". Knopf „Aushilfe beenden" erscheint, wenn die Rolle das darf, dann Dialog „Aushilfe beenden?" („Der Spieler kehrt ab heute in seine Mannschaft zurück."), bestätigen: Meldung „Aushilfe wurde beendet". Vorher Aushilfe anlegen (siehe SPP-05).'],unklar:!1,entfallen:!1},{id:"KAD-10",bereich:"KAD",bereichName:"Team / Kader",titel:"Team-Seite: Unterschiede TRA, SL, SPI, FT",rollen:["TRA","SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:['TRA: sieht wie OWN den Kader, „Person einladen / anlegen" und Bearbeiten. Im Bereich „Trainer & Mitarbeiter" nur die Personal-Konten (Name, Rolle · E-Mail), nicht anklickbar, kein „Mitarbeiter anlegen". Mannschaftswahl zeigt nur eigene Mannschaften.','SL: Kader und Mitarbeiter nur lesen. Kein „Person einladen / anlegen", kein Stift, keine Rollenzellen, keine Spalte „Zugang", kein „Mannschaft zuweisen", keine „Pausierten". Mitarbeiter-Stammdaten sichtbar und anklickbar.','SPI: Menü „Team" fehlt. /app/team direkt aufrufen: „Zugriff verweigert". /app/players leitet auf die eigene Spielersicht um.','FT: Menü „Team" fehlt. /app/team direkt aufrufen: „Zugriff verweigert". /app/players leitet zur Übersicht um.'],unklar:!1,entfallen:!1},{id:"SPP-01",bereich:"SPP",bereichName:"Spielerprofil",titel:"Spielerprofil öffnen: Kopf, Favorit, Reiter",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Spieler aus der Teamliste öffnen. Kopf: Foto, Name, Stern „Zu meinen Favoriten hinzufügen" (an/aus; Meldung/Zustand prüfen), Rückennummer-Chip, „x Jahre", Chips „Ehemalig" oder „Pausiert", Mannschaft mit Wappen.','Reiter durchgehen (Knopfleiste): „Profil", „Spiele", „Training", „Abwesenheiten", „Bewertungen", „Gespräche". Welche Reiter da sind, hängt von Rolle und Mannschaft ab (siehe die Einzel-Aufgaben).',"Handy: zwischen den Reitern nach links/rechts wischen.","Zurück-Pfeil in der Kopfleiste (Handy: auch Zurück-Wischen). Beim Hochscrollen wandern Name und Bild in die Kopfleiste.",'Aufruf mit unbekannter Kennung: „Spieler nicht gefunden".'],unklar:!1,entfallen:!1},{id:"SPP-02",bereich:"SPP",bereichName:"Spielerprofil",titel:"Steckbrief ansehen und bearbeiten",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Reiter „Profil", Gruppe „Steckbrief": Geboren (mit Alter), Rückennr., Starker Fuß, Handy (antippen wählt die Nummer), „Aufgaben im Team" (Kapitän/Mannschaftsrat/Kassenwart), „Positionen", „Notizen". Fehlende Angaben stehen als „–".','„Bearbeiten": Dialog „Steckbrief bearbeiten" mit Vorname, Nachname, Geburtsdatum, Handy, Notizen, Rückennummer (Nummernfeld), Positionen und starkem Fuß, Block „Aufgaben im Team" (nur wenn die Rolle Kader bearbeiten darf).','Bereits vergebene Rückennummer: Fehler „Rückennummer bereits vergeben".','Speichern: Meldung „Erfolg", Steckbrief aktualisiert. Danach erneut öffnen und ohne Speichern schließen.',"Aufgaben-Schalter Kapitän/Mannschaftsrat/Kassenwart ändern und in KAD-01/KAS-14 wiederfinden."],unklar:!1,entfallen:!1},{id:"SPP-03",bereich:"SPP",bereichName:"Spielerprofil",titel:"Spielerfoto ändern und entfernen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Auf das Foto im Kopf tippen: Menü mit „Foto ändern" und (falls vorhanden) „Foto entfernen".','„Foto ändern": Datei wählen. Handy zusätzlich Kamera bzw. Galerie. Meldung „Spielerfoto aktualisiert", Foto erscheint auch in der Teamliste.','Zu große Datei oder falsches Format: Meldung „Datei zu groß" bzw. „Ungültiges Format".','„Foto entfernen": Frage „Spielerfoto entfernen?", erst Abbrechen, dann „Entfernen" (Meldung „Spielerfoto entfernt").'],unklar:!1,entfallen:!1},{id:"SPP-04",bereich:"SPP",bereichName:"Spielerprofil",titel:'„Mannschaft & Karriere": Verlauf, Eintrag bearbeiten und löschen',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Reiter „Profil", Gruppe „Mannschaft & Karriere": aktuelle Mannschaft mit Wappen, ggf. „Hilft aus bei …", darunter der Verlauf (Zeitraum, Etikett „Aushilfe"). Ohne Einträge: „Noch keine Einträge vorhanden", ohne Mannschaft „Aktuell keiner Mannschaft zugeordnet".','Zeilenmenü am Eintrag: „Bearbeiten" öffnet den Engagement-Dialog (Mannschaft, „Startdatum (optional)", „Enddatum (optional)"; das Fixgehalt-Feld hier nicht prüfen). Speichern und Abbrechen testen.','Zeilenmenü „Löschen": Frage „Eintrag löschen", erst Abbrechen, dann bestätigen (Meldung „Eintrag wurde gelöscht"). Nur mit Testdaten.','Dasselbe Engagement-Fenster erreicht man über „Mannschaft zuweisen" bei „Nicht zugeordnet" (KAD-09).'],unklar:!1,entfallen:!1},{id:"SPP-05",bereich:"SPP",bereichName:"Spielerprofil",titel:"Wechsel, Abgang und Pause starten oder beenden",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['In „Mannschaft & Karriere" der volle Knopf (Beschriftung je Lage: „Abgang / Pause …", „Wechsel / Abgang …" oder „Wechsel / Abgang / Aushilfe …"). Dialog trägt den Spielernamen im Titel.','Block „Was passiert?": „Wechselt fest in andere Mannschaft" (nur wenn es weitere Mannschaften gibt), „Verlässt den Verein" bzw. „Verlässt die Mannschaft", „Pause".','Je Wahl das Detailformular prüfen („Neue Mannschaft", „Ab wann", „Abgang zum") und mit „Wechsel speichern", „Abgang speichern" oder „Pause starten" bestätigen (Meldungen „Wechsel wurde gespeichert", „Abgang wurde gespeichert", „Pause wurde gestartet"). Mit Zurück/Abbrechen verlassen testen.','Nach „Pause": Profil zeigt „Pausiert" und den Knopf „Pause beenden" (oder im Dialog „Pause beenden"). Beenden: Meldung „Pause wurde beendet", dann Frage „Pause beendet" mit „Später" bzw. „Abwesenheit eintragen".','Nach „Abgang": Chip „Ehemalig", Spieler in „Ehemalige" der Teamseite (siehe KAD-09).'],unklar:!1,entfallen:!1},{id:"SPP-06",bereich:"SPP",bereichName:"Spielerprofil",titel:"Aushilfe eintragen, verlängern, beenden (vom Profil)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Voraussetzung: der Verein hat mindestens zwei Mannschaften. Dialog wie SPP-05, Wahl „Hilft in anderer Mannschaft aus".','Mannschaft, „Von", „Bis" wählen, „Aushilfe eintragen" (Meldung „Aushilfe wurde eingetragen"). Profil zeigt „Hilft aus bei …" und Etikett „Aushilfe" im Verlauf.','Erneut Dialog: „Aushilfe verlängern" bzw. „Befristen" (Meldung „Aushilfe wurde geändert") und „Aushilfe beenden" (Meldung „Aushilfe wurde beendet").','Teamliste beider Mannschaften prüfen (KAD-09): Hinweis „Aushilfe von …" bzw. „Hilft aus bei …"; Kassen-Auswahl (KAS-14) schließt ausgeliehene Spieler im Stammteam aus.'],unklar:!1,entfallen:!1},{id:"SPP-07",bereich:"SPP",bereichName:"Spielerprofil",titel:"Aufnahme eines ehemaligen Spielers und Vereinswechsel erfassen",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['Ehemaligen Spieler (kein aktives Engagement) öffnen: Knopf „In Mannschaft aufnehmen". Dialog „In Mannschaft aufnehmen": „Mannschaft", „Zeitpunkt" / „Ab wann", „Aufnehmen" (Meldung „Spieler wurde aufgenommen"). Vorher auch Abbrechen testen.','Spieler eines fremden Vereins öffnen (z. B. über Suche): statt der Karriere-Aktionen der Knopf „Vereinswechsel erfassen". Dialog: „Neuer Verein *", „Mannschaft (optional)", „Ab wann?". Ohne Verein: Fehler „Bitte Verein und Datum angeben". Mit Angaben „Vereinswechsel wurde erfasst". Der Dialog wird nur gezeigt, wenn es einen solchen Fremdspieler gibt.'],unklar:!1,entfallen:!1},{id:"SPP-08",bereich:"SPP",bereichName:"Spielerprofil",titel:"Spieler unwiderruflich löschen",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Nur mit einem Testspieler. Dialog aus SPP-05 öffnen, unten Link „Spieler löschen …" (nur für Owner/Admin sichtbar).','Warnfenster „Spieler unwiderruflich löschen?": Text lesen (Einsätze, Kassen-Einträge, Strafen, Abwesenheiten, Dateien).','Knopf „Endgültig löschen" bleibt gesperrt, bis das Kästchen „Ich verstehe, dass alle Daten unwiderruflich gelöscht werden" angehakt ist. Erst „Abbrechen" (Haken wird zurückgesetzt), dann echte Löschung: Meldung „… wurde gelöscht", Sprung zur Teamliste, Spieler weg.'],unklar:!1,entfallen:!1},{id:"SPP-09",bereich:"SPP",bereichName:"Spielerprofil",titel:"Dokumente des Spielers",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['Reiter „Profil", Gruppe „Dokumente": Leerzustand „Noch keine Dokumente hinterlegt.".','„Hochladen" (Handy: Symbol): Dialog „Dokument hochladen" mit Datei und Titel (z. B. „Spielerpass"). Ohne Titel „Titel fehlt", zu große Datei „Datei zu groß", Grenze „Limit erreicht". Abbrechen testen, dann echt hochladen (Meldung „Hochgeladen").',"Eintrag antippen: Dokument öffnet (Handy: in der Standard-App des Geräts, Desktop: neuer Tab).",'„Bearbeiten": Dialog „Dokument bearbeiten", Titel ändern (Meldung „Gespeichert"). „Löschen": bestätigen (Meldung „Gelöscht").'],unklar:!1,entfallen:!1},{id:"SPP-10",bereich:"SPP",bereichName:"Spielerprofil",titel:'Reiter „Spiele"',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Reiter „Spiele": Gruppe „Bilanz" mit Saisonauswahl („Saison"), Wettbewerbs-Chips (nur bei mehreren Arten) und Kennzahlen Spiele, Minuten, Tore, Assists, Startelf.','Saison wechseln, Chips umschalten. Leerzustand „Keine Spieleinsätze in dieser Saison vorhanden.".','Monatsgruppen mit Spielzeilen: Zeile antippen öffnet die Aufstellung des Spiels. Bei einem Spiel mit Bewertung: Note antippen öffnet den Bericht (bei mehreren Berichten Auswahl „Bericht auswählen").','Kennzahl „Ø Bewertung" antippen: springt zum Reiter „Bewertungen".'],unklar:!1,entfallen:!1},{id:"SPP-11",bereich:"SPP",bereichName:"Spielerprofil",titel:'Reiter „Training"',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Reiter „Training": Zeitraum-Chips „7 T", „30 T", „90 T", „Saison", „Datum" (frei wählbar).','Gruppe „Beteiligung": Trainingsquote, Spielquote, „Ø Bewertung" je Mannschaft. Bei fehlenden Terminen der Leerhinweis zum Zeitraum. Fehlerfall: „Die Trainingsquote konnte nicht geladen werden.".','„Bewertungsverlauf" (Diagramm) ansehen. „Notizen aus dem Training" lesen.','Gruppe „Individualtraining" (nur mit Mannschaft): „Eintragen" öffnet den Anlege-Dialog (abbrechen, dann anlegen), Zeile antippen öffnet den Bearbeiten-Dialog. Blöcke „Geplant" und „Bisher". Ohne Einträge „Keine Individualeinheiten im gewählten Zeitraum.".'],unklar:!1,entfallen:!1},{id:"SPP-12",bereich:"SPP",bereichName:"Spielerprofil",titel:'Reiter „Abwesenheiten" (Spielerprofil)',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Nur bei Spielern des eigenen Vereins. Gruppen „Saison …" (Übersicht Juli bis Juni), „Aktuell", „Geplant", Verlauf nach Monaten.','„Eintragen": Dialog für neue Abwesenheit (Dialog selbst prüft der Teilbereich Abwesenheiten), hier nur Abbrechen und einmal Speichern.',"Eintrag antippen: Bearbeiten-Dialog.",'Leerzustand der Gruppe „Abwesenheiten".'],unklar:!1,entfallen:!1},{id:"SPP-13",bereich:"SPP",bereichName:"Spielerprofil",titel:'Reiter „Bewertungen" und Berichte',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Gruppe „Bewertung": Note und Kriterien. Ohne Bericht „Noch nicht bewertet".','Fußzeile der Gruppe: „Früherer Stand" (öffnet den Vergleich mit dem früheren Stand) und „Anderer Spieler" (Dialog „Vergleichen mit …", Spieler wählen).','Gruppe „Berichte": eigene Berichte, Eintrag antippen öffnet den Bericht. Ohne Berichte „Noch keine Berichte".',"Desktop: Bewertung links, Spielszenen und Berichte rechts."],unklar:!1,entfallen:!1},{id:"SPP-14",bereich:"SPP",bereichName:"Spielerprofil",titel:"Spielszenen (Videos) hochladen und verwalten",rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['Reiter „Bewertungen", Gruppe „Spielszenen": Leerzustand „Noch keine Spielszenen hinterlegt.".','„Hochladen": Dialog „Spielszene hochladen" mit Datei, „Erklärung für den Spieler" (Notiz, die der Spieler unter dem Video sieht), Titel. Abbrechen, dann echt hochladen.','Eintrag antippen: Video öffnet. „Bearbeiten": Dialog „Spielszene bearbeiten". „Löschen" bestätigen.'],unklar:!1,entfallen:!1},{id:"SPP-15",bereich:"SPP",bereichName:"Spielerprofil",titel:'Reiter „Gespräche" (Spielerprofil)',rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['Reiter „Gespräche": Gruppe „Gespräche" mit „Eintragen", „Geplant" und Monatsgruppen. Leerzustand „Du hast noch keine Gespräche mit diesem Spieler geführt.".',"Gespräch anlegen und eines öffnen (Dialog und Verlauf deckt ein anderer Teilbereich ab).","SCOUT sieht diesen Reiter ebenfalls, ist aber keine Testrolle. SPI und FT sehen ihn nicht."],unklar:!1,entfallen:!1},{id:"SPP-16",bereich:"SPP",bereichName:"Spielerprofil",titel:'Gruppe „Zugang & Rolle" im Spielerprofil',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Reiter „Profil", Gruppe „Zugang & Rolle" (steht ganz unten): „App-Zugang" Aktiv/Inaktiv, Rolle, E-Mail, Mannschaften.','Spieler ohne Zugang: „Kein App-Zugang" und Zeile „Einladungslink erstellen" (öffnet den Einladen-Dialog, Inhalt prüft ein anderer Teilbereich).','Mit Zugang: „Bearbeiten" (Rolle/Mannschaften), „Kein Spieler? Rolle korrigieren", „Zugang entfernen" nur öffnen und abbrechen.',"Welche Zeilen erscheinen, hängt von der Rolle ab: Owner/Admin voll, Trainer eingeschränkt, SL und Scout sehen die Gruppe gar nicht."],unklar:!1,entfallen:!1},{id:"SPP-17",bereich:"SPP",bereichName:"Spielerprofil",titel:"Vereinsprofil (Fremd-/Master-Spieler)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Spieler fremder Mannschaften öffnen (z. B. aus Aufstellung, Spielverlauf oder Suche). Eigene Spieler werden automatisch auf das Profil aus SPP-01 umgeleitet (prüfen).",'Kopf: Bild, Name, Stern „Zu meinen Favoriten hinzufügen", Zeile mit Alter, Position, Nummer, Mannschaftsblock (antippen öffnet die Mannschaftsansicht, MAN-01).','Bleistift „Alter, Position und Rückennummer bearbeiten" nur bei Spielern, die der eigene Verein nicht führt: Dialog zur Bearbeitung der Stammdaten, speichern.','Reiter „Spiele" (Bilanz wie SPP-10), „Bewertungen" (wie SPP-13, ohne Spielszenen) und „Gespräche" (wie SPP-15, nur wenn erlaubt).',"Zurück-Pfeil führt zur vorherigen Seite (Aufstellung, Team)."],unklar:!1,entfallen:!1},{id:"SPP-18",bereich:"SPP",bereichName:"Spielerprofil",titel:"Spieler: eigenes Profil (Vereinsprofil-Sicht)",rollen:["SPI"],geraete:["desktop","android","ios"],schritte:["Der Spieler öffnet sein Profil (Sidebar/Startseite). Aufruf von /app/players/… leitet auf die eigene Vereinsprofil-Seite um (kein Aufruf der Verwaltungsseite).",'Kopf mit Stern „Zu meinen Favoriten hinzufügen", Reiter nur „Spiele" und „Bewertungen", kein Reiter „Gespräche". Kein Bleistift zum Bearbeiten bei Spielern des eigenen Vereins.','Reiter „Spiele": eigene Bilanz. Reiter „Bewertungen": „Noch nicht bewertet" oder Note.','Zu „Meine Dateien" und „Meine Abwesenheiten" (eigene Menüpunkte) nur kurz springen, Inhalt prüft ein anderer Teilbereich.'],unklar:!1,entfallen:!1},{id:"SPP-19",bereich:"SPP",bereichName:"Spielerprofil",titel:"Spielerprofil: Unterschiede TRA (fremde Mannschaft), SL, FT",rollen:["TRA","SL","FT"],geraete:["desktop","android","ios"],schritte:['TRA öffnet einen Spieler einer fremden Mannschaft (z. B. über Suche): kein „Bearbeiten" (außer selbst angelegt), keine Reiter „Spiele"/„Training"/„Abwesenheiten", kein Abgang/Wechsel-Knopf.','SL: Steckbrief „Bearbeiten" vorhanden, „Mannschaft & Karriere" mit Wechsel/Abgang, Aufnahme, Vereinswechsel und Eintrag bearbeiten/löschen. Reiter „Abwesenheiten" nur lesen (kein „Eintragen"), Reiter „Spiele"/„Training" fehlen. Dokumente und Spielszenen dürfen hochgeladen/gelöscht werden, Gespräche sichtbar, „Zugang & Rolle" fehlt.',"FT: Spielerprofile werden nicht gezeigt, Aufruf leitet zur Übersicht um."],unklar:!1,entfallen:!1},{id:"MIT-01",bereich:"MIT",bereichName:"Mitarbeiter-Profil",titel:"Mitarbeiterprofil öffnen und ansehen",rollen:["OWN","SL"],geraete:["desktop","android","ios"],schritte:['Aus „Trainer & Mitarbeiter" auf der Teamseite (KAD-08) einen Mitarbeiter antippen. Kopf: Foto (bzw. Symbol), Wappen, Name, „Aufgabe · Funktion", Chip „Extern" (bei Externen) und „Registriert" (nur für Owner/Admin sichtbar).','Reiter: „Übersicht", „Abwesenheiten" (nur Mitarbeiter des eigenen Vereins), „Gespräche". Handy: wischen.','Übersicht: Gruppe „Steckbrief" (Geburtsdatum, Aufgabe, Funktion, E-Mail, Telefon, Adresse; E-Mail/Telefon antippen), Gruppe „Mannschaften" („Keiner Mannschaft zugeordnet" im Leerfall), „Zugang & Rolle" (wie SPP-16).',"Zurück-Pfeil. Der Aufruf geht nur für Owner, Admin und SL."],unklar:!1,entfallen:!1},{id:"MIT-02",bereich:"MIT",bereichName:"Mitarbeiter-Profil",titel:"Mitarbeiter bearbeiten und Mannschaften verwalten",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Gruppe „Steckbrief" → „Bearbeiten": Dialog „Mitarbeiter bearbeiten" (Funktion, Aufgabe z. B. „Cheftrainer", Geburtsdatum, E-Mail, Telefon, Adresse, Foto). Speichern (Meldung „Erfolg") und Abbrechen testen.','Gruppe „Mannschaften" → „Verwalten" (fehlt am eigenen Profil): Dialog „Mannschaften" mit Auswahlliste, „Speichern" (Meldung „Mannschaften aktualisiert") und Abbrechen. Es werden nur Mannschaften angeboten, die man selbst sieht.',"Ergebnis in der Gruppe und in der Teamliste prüfen."],unklar:!1,entfallen:!1},{id:"MIT-03",bereich:"MIT",bereichName:"Mitarbeiter-Profil",titel:"Notizen und Mitarbeiter löschen",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:['Gruppe „Notizen" (nur Owner/Admin): Text in „Notizen zu diesem Mitarbeiter…" eintippen. Statuszeile „Speichert…" → „Gespeichert", Seite neu laden: Text bleibt.','Ganz unten Zeile „Mitarbeiter löschen" (rot): Dialog „Mitarbeiter löschen" mit Rückfrage, erst Abbrechen, dann bestätigen mit einem Testmitarbeiter (Meldung „Mitarbeiter wurde erfolgreich gelöscht", Rückkehr zur Liste).'],unklar:!1,entfallen:!1},{id:"MIT-04",bereich:"MIT",bereichName:"Mitarbeiter-Profil",titel:'Reiter „Abwesenheiten" und „Gespräche" (Mitarbeiter)',rollen:["OWN","SL"],geraete:["desktop","android","ios"],schritte:['„Abwesenheiten": Leerzustand „Keine Abwesenheiten erfasst", Gruppen „Aktuell", „Geplant", „Diese Saison". „Eintragen" öffnet den Anlege-Dialog (Inhalt prüft der Teilbereich Abwesenheiten), Eintrag antippen bearbeitet. SL darf hier eintragen.','„Gespräche": Verlauf mit „Eintragen" (bei externen Mitarbeitern nicht möglich). Gespräch anlegen/öffnen (Inhalt prüft ein anderer Teilbereich). Die Übersichtsseite der Mitarbeiter-Gespräche ist ein eigener Menüpunkt, hier nicht prüfen.'],unklar:!1,entfallen:!1},{id:"MIT-05",bereich:"MIT",bereichName:"Mitarbeiter-Profil",titel:"Mitarbeiterprofil: Unterschiede SL, TRA, FT",rollen:["TRA","SL","FT"],geraete:["desktop","android","ios"],schritte:['SL: sieht Steckbrief, Mannschaften, Abwesenheiten, Gespräche. Kein „Bearbeiten", kein „Verwalten", keine Notizen, kein „Mitarbeiter löschen", kein „Zugang & Rolle".','TRA: kann das Mitarbeiterprofil nicht öffnen (in der Teamliste sind die Zeilen nicht anklickbar). Direktaufruf der Adresse: „Zugriff verweigert". In der Mannschaftsansicht (MAN-04) ist das Trainerstab-Feld aber anklickbar: Ergebnis („Zugriff verweigert") notieren.','FT: kein Zugriff, auch nicht über Direktaufruf oder das Trainerstab-Feld der Mannschaftsansicht („Zugriff verweigert").'],unklar:!1,entfallen:!1},{id:"MAN-01",bereich:"MAN",bereichName:"Mannschaftsansicht",titel:"Mannschaftsansicht öffnen: Kopf, Favorit, Aktualisieren",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Über eine Mannschaft öffnen, z. B. Mannschaftsname in einer Tabelle oder in der Liga-Auswertung, in der Aufstellung (Heim/Auswärts), über die Suche, im Mannschaftsblock eines Vereinsprofils, in den Favoriten oder bei den Ergebnissen der Übersicht.",'Kopf: Wappen, Mannschaftsname (bei langen Namen zweizeilig), Unterzeile „Altersklasse · Liga", Stern „Zu meinen Favoriten hinzufügen" (an/aus; in den Favoriten prüfen).','Vier Reiter: „Team", „Liga", „Tabelle", „Kader". Handy: durch alle Seiten wischen.','Rundes Symbol „Mannschaft aktualisieren" neben der Leiste: Meldung „Wir suchen nach weiteren Spielen…", dann Ergebnis oder „Aktualisierung fehlgeschlagen".','Zurück-Pfeil: führt zur Herkunftsseite (z. B. Aufstellung). Falsche Kennung: „Mannschaft nicht gefunden.".'],unklar:!1,entfallen:!1},{id:"MAN-02",bereich:"MAN",bereichName:"Mannschaftsansicht",titel:'Reiter „Team" und „Liga": Spiele',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Reiter „Team": Umschalter „Letzte Spiele" / „Nächste Spiele", Spiele nach Monaten gruppiert. Leerfälle „Keine vergangenen Spiele in dieser Saison." und „Keine anstehenden Spiele in dieser Saison.".','Reiter „Liga": gleicher Umschalter, Spiele der ganzen Liga nach Tagen. Knopf für weitere Wochen (vorher/weiter) laden.','Ohne Staffel: „Keine Staffel zugeordnet". Leerfälle der Liga: „Keine vergangenen Liga-Spiele verfügbar." bzw. „Keine anstehenden Liga-Spiele verfügbar."',"Ein Spiel antippen (öffnet die Spielseite, Inhalt prüft ein anderer Teilbereich), zurück."],unklar:!1,entfallen:!1},{id:"MAN-03",bereich:"MAN",bereichName:"Mannschaftsansicht",titel:'Reiter „Tabelle" und „Form"',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Reiter „Tabelle": Gruppe mit Liganame, Tabelle der Staffel, eigene Mannschaft hervorgehoben. Mannschaftsname in der Tabelle antippen öffnet deren Mannschaftsansicht.','Umschalter „Tabelle" / „Form" erscheint nur bei eigener, vollständiger Liga: Gruppe „Formtabelle" („letzte 5 Ligaspiele") mit Hinweis „Punkte nur aus den letzten fünf Ligaspielen.".',"Bei fremden Mannschaften nur die Tabelle, ohne Umschalter."],unklar:!1,entfallen:!1},{id:"MAN-04",bereich:"MAN",bereichName:"Mannschaftsansicht",titel:'Reiter „Kader"',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Gruppe mit Kadertitel und Anzahl, Spielerzeilen. Zeile antippen öffnet das Vereinsprofil (SPP-17).",'Gruppe „Trainerstab": Zeilen für Mitarbeiter. Außer für Spieler sind die Zeilen anklickbar: Owner, Admin und SL öffnen das Mitarbeiterprofil, Trainer und Funktionsteam bekommen „Zugriff verweigert" (notieren).','Leerfall „Keine Spieler in dieser Mannschaft.".'],unklar:!1,entfallen:!1},{id:"MAN-05",bereich:"MAN",bereichName:"Mannschaftsansicht",titel:"Mannschaftsansicht: Unterschiede SPI, SL, FT",rollen:["SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:["SPI: Zugriff über Links (z. B. Tabelle). Trainerstab-Zeilen sind nicht anklickbar. Vereinsprofile von Spielern lassen sich öffnen.",'SL, FT: alle vier Reiter sichtbar. Trainerstab-Zeilen anklickbar: bei SL öffnet das Mitarbeiterprofil, bei FT erscheint „Zugriff verweigert".'],unklar:!1,entfallen:!1},{id:"TMH-01",bereich:"TMH",bereichName:"Teammanagement-Hub",titel:'Hub „Teammanagement": Kacheln je Rolle',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Menü „Teammanagement" öffnen. Ab ca. 1024 px Breite zwei Spalten (links Vorlagen und Materialdienst, rechts Kasse und Kaderplanung), sonst untereinander.','Gruppen prüfen: „Aufstellungen & Standards", „Materialdienst", „Mannschaftskasse", „Kaderplanung". Hinweis: „Aufstellungen & Standards" erscheint nur bei effektiver Rolle Owner oder Trainer (nicht bei Admin).',"Mannschaft in der Kopfleiste wechseln: alle Gruppen laden neu.",'Fehlerfall „… konnten nicht geladen werden" mit Knopf zum Wiederholen (nur bei Netzproblem).'],unklar:!1,entfallen:!1},{id:"TMH-02",bereich:"TMH",bereichName:"Teammanagement-Hub",titel:'„Einstellungen" der Mannschaft',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Zahnrad „Einstellungen" neben dem Titel (nur mit gewählter Mannschaft; für Owner, Admin, Trainer; SL sieht es nicht).','Dialog „Einstellungen": Gruppe „Abwesenheiten", Schalter „Spieler dürfen selbst eintragen". Umschalten, erklärender Satz darunter wechselt („Spieler tragen ihre Abwesenheiten selbst ein." / „Nur Trainer tragen Abwesenheiten ein."). Änderung wird sofort gespeichert.','Wirkung prüfen: als Spieler (Menü „Meine Abwesenheiten") kann der Spieler dann eintragen bzw. nicht. Danach Schalter zurücksetzen.'],unklar:!1,entfallen:!1},{id:"TMH-03",bereich:"TMH",bereichName:"Teammanagement-Hub",titel:'Gruppe „Aufstellungen & Standards"',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Umschalter „Aufstellungen" / „Standards": je bis zu drei Vorschau-Zeilen (Feldvorschau, Name, Formation bzw. Richtung), Zeile antippen öffnet die Detailseite (die Seiten selbst prüft ein anderer Teilbereich).','Plus-Knopf „Neue Aufstellung" bzw. „Neue Standardsituation": öffnet den jeweiligen Anlege-Dialog, abbrechen.','Fußzeile „Alle Aufstellungen" bzw. „Alle Standards". Leerzustand „Keine Aufstellungen" mit „Erste Aufstellung erstellen" bzw. „Keine Standardsituationen" mit „Erste Standardsituation erstellen".'],unklar:!1,entfallen:!1},{id:"TMH-04",bereich:"TMH",bereichName:"Teammanagement-Hub",titel:'Gruppen „Mannschaftskasse", „Materialdienst", „Kaderplanung"',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['„Mannschaftskasse": großer Kassenstand (rot bei Minus mit Badge „Im Minus"), Zeilen „Offene Strafen", „Offene Beiträge" und „Letzte Bewegung"; jede Zeile und „Zur Kasse" öffnet die Kasse (KAS-01).','„Materialdienst": nicht eingerichtet → „Materialdienst noch nicht eingerichtet" mit „Jetzt einrichten". Sonst Block „Diese Woche" (Gruppe, Spielernamen, ggf. Badge „Getauscht"), Zeile „Nächste", Warnzeile „n Spieler ohne Gruppe" mit „Zuteilen"; „Zum Materialdienst" (MAT-01).','„Kaderplanung": Zeilen mit Name und „Angelegt am …" (ggf. „Privat"), „+n weitere Kaderplanungen", Plus „Neue Kaderplanung" (Dialog, abbrechen), „Kaderplanungen verwalten". Leerfall „Keine Kaderplanungen erstellt" mit „Erste Kaderplanung erstellen". Die Kaderplanung selbst prüft ein anderer Teilbereich.'],unklar:!1,entfallen:!1},{id:"TMH-05",bereich:"TMH",bereichName:"Teammanagement-Hub",titel:"Hub: Unterschiede ADMIN, SL, SPI, FT",rollen:["SPI","SL","FT"],geraete:["desktop","android","ios"],schritte:['SL: Menü „Teammanagement" vorhanden. Sichtbar sind „Materialdienst", „Mannschaftskasse", „Kaderplanung"; nicht „Aufstellungen & Standards"; kein Zahnrad „Einstellungen".','Admin (zur Kontrolle, falls Testkonto vorhanden): wie Owner, aber ohne „Aufstellungen & Standards".','SPI, FT: Menü „Teammanagement" fehlt, Direktaufruf: „Zugriff verweigert". Spieler und Funktionsteam finden die Kasse im eigenen Menüpunkt „Mannschaftskasse" (KAS-15, KAS-17).'],unklar:!1,entfallen:!1},{id:"KAS-01",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Kasse öffnen, Aufbau und Mannschaftswahl",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Hub (TMH-04) → „Zur Kasse". Titel „Mannschaftskasse" mit Info-Symbol (Text über Strafenkatalog, Beiträge, Ein- und Auszahlungen und den Knopf „Kassenwart bestimmen").','Desktop: Knopfleiste „Übersicht", „Strafenkatalog", „Beiträge", „Ein- & Auszahlungen". Handy: vier Symbol-Reiter (Aria-Namen gleich) und Wischen zwischen den Seiten.','Ohne gewählte Mannschaft: Hinweis „Keine Mannschaft ausgewählt – Bitte wähle im Header eine Mannschaft aus".',"Mannschaft wechseln: Kasse lädt neu (jede Mannschaft hat eigene Kasse und Kassenwarte).","Als Owner/Admin/Trainer ohne Kassenwart-Eintrag prüfen: keine Plus-/Bearbeiten-Knöpfe sichtbar (nur lesen)."],unklar:!1,entfallen:!1},{id:"KAS-02",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Übersicht lesen: Kassenstand, Strafen & Beiträge je Person",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Karten „Kassenstand" und „Offene Forderungen" (Farbe grün/rot je nach Stand).','Bereich „Strafen & Beiträge": Chips „Alle", „Offen", „Bezahlt" und Suchfeld „Person suchen...". Leerhinweise „Keine Personen mit Posten" / „Keine Personen mit offenen Strafen oder Beiträgen".','Personenliste (Spieler und Trainer/Betreuer): Beträge offen (rot) und bezahlt (grün). Person antippen: Handy klappt „Einzelne Posten" darunter auf (zweites Antippen klappt zu), Desktop zeigt die Posten rechts in der Tafel.','Posten: Symbol je Vergehen (ⓘ-Popover bei Strafen mit Info-Text), Datum, Betrag, bei Sachstrafe die Aufgabe, Etikett „Zahlung gemeldet". Blättern mit „Zurück" / „Weiter" („Seite x von y") bei vielen Posten. Leerhinweis „Keine Strafen oder Beiträge.".'],unklar:!1,entfallen:!1},{id:"KAS-03",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Strafe hinzufügen (Kassenwart) und abbrechen",rollen:["TRA","SPI-K","FT"],geraete:["desktop","android","ios"],schritte:['Desktop: Knopf „Strafe hinzufügen" oben. Handy: runder Knopf in der Kopfleiste (auf Übersicht).','Dialog „Strafe hinzufügen": Feld „Vergehen" („Vergehen wählen oder suchen..."; ohne Katalog erst Vergehen anlegen, KAS-05), bei Sachstrafe Feld „Aufgabe", Feld „Info (optional)".','Personen wählen: Suchfeld „Spieler oder Mitarbeiter suchen...", Abschnitte „Spieler" und „Trainer und Betreuer" mit „Alle"-Knöpfen, ausklappbar „Weitere aus dem Verein".','Erst „Abbrechen": keine Strafe entsteht. Dann mit Personen speichern: Meldung „Strafen angelegt", Posten stehen in der Übersicht. Betroffene Person bekommt eine Push-Nachricht (nur Handy, siehe Unklarheiten).'],unklar:!1,entfallen:!1},{id:"KAS-04",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Posten bezahlen, zurücknehmen, löschen (Kassenwart)",rollen:["TRA","SPI-K","FT"],geraete:["desktop","android","ios"],schritte:['In den Posten einer Person: Kästchen „Als bezahlt markieren" bei einem offenen Posten (nur Betragsposten werden auch als Einzahlung verbucht). Bezahlte Posten zeigen grünen Haken.','Knopf „Alle als bezahlt" (erscheint bei offenen Geldbeträgen): Meldung „Geldbeträge als bezahlt markiert". Sachstrafen bleiben unberührt.','Menü „Weitere Aktionen" (⋮) am Posten: „Rückgängig machen" (nur bei bezahlten) und „Löschen". Löschen: Frage „Strafe löschen?" bzw. „Beitrag löschen?" (bei bezahlten Posten mit Hinweis zur Einzahlung), Abbrechen und Bestätigen (Meldung „Posten gelöscht").','In KAS-12 die zugehörigen Einzahlungen im Kassenbuch gegenprüfen. Betroffene Person bekommt Push „Bezahlung erfasst" (nur Handy).'],unklar:!1,entfallen:!1},{id:"KAS-05",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Strafenkatalog ansehen und Vergehen anlegen",rollen:["OWN","TRA","SPI-K"],geraete:["desktop","android","ios"],schritte:['Seite „Strafenkatalog": Liste der Vergehen (Symbol, Bezeichnung, Betrag oder Aufgabe). Ohne Einträge: „Keine Vergehen. Lege Vergehen an, um Strafen zu vergeben.".','Nur Kassenwart: Desktop Knopf „Neues Vergehen", Handy runder Knopf. Dialog „Neues Vergehen": „Vergehen" („z.B. Zu spät, Training verpasst"), „Art" (Geldstrafe / Sachstrafe), bei Geldstrafe „Betrag (€)", bei Sachstrafe „Aufgabe" („z.B. Kasten, Putzen, Liegestützen").','Abbrechen, dann speichern (Meldung „Vergehen angelegt").',"Nicht-Kassenwart: Liste sichtbar, aber keine Knöpfe."],unklar:!1,entfallen:!1},{id:"KAS-06",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Vergehen bearbeiten und löschen",rollen:["TRA","SPI-K","FT"],geraete:["desktop","android","ios"],schritte:['Zeile im Strafenkatalog: Stift-Knopf („… bearbeiten") öffnet „Vergehen bearbeiten", Änderung speichern (Meldung „Vergehen aktualisiert") bzw. abbrechen.','Papierkorb-Knopf: Frage „Vergehen löschen?" mit Hinweis, dass bestehende Strafen erhalten bleiben. Abbrechen, dann löschen (Meldung „Vergehen gelöscht").'],unklar:!1,entfallen:!1},{id:"KAS-07",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Beiträge ansehen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Seite „Beiträge": je Beitragsregel eine Karte mit Bezeichnung, Betrag, „Einmal im Monat", „Abrechnung am x. des Monats", „n Personen zugeordnet", „Gültig ab …".','Leerzustand „Keine Beitragsregeln angelegt.". Fehlerfall „Die Beitragsregeln konnten nicht geladen werden.".',"Ohne Kassenwart-Rolle: keine Schaltflächen auf den Karten."],unklar:!1,entfallen:!1},{id:"KAS-08",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Monatsbeitrag anlegen, bearbeiten, löschen",rollen:["TRA","SPI-K","FT"],geraete:["desktop","android","ios"],schritte:['Desktop Knopf „Monatsbeitrag", Handy runder Knopf „Beitrag anlegen" → „Monatsbeitrag" (Leerzustand zusätzlich mit eigenem Knopf).','Dialog „Neuer Monatsbeitrag": „Bezeichnung" („z. B. Monatsbeitrag"), „Betrag (€)", „Gültig ab", „Gültig bis (optional)", „Abrechnungstag (Tag im Monat)". Abbrechen, dann speichern (Meldung „Regel angelegt").','Karte: Stift „Bearbeiten" („Monatsbeitrag bearbeiten", Meldung „Regel aktualisiert"), Papierkorb „Löschen" (Hinweis: Zuordnungen werden gelöscht, bereits erzeugte Beiträge bleiben; Meldung „Monatsbeitrag gelöscht").'],unklar:!1,entfallen:!1},{id:"KAS-09",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Einmaligen Beitrag anlegen",rollen:["TRA","SPI-K","FT"],geraete:["desktop","android","ios"],schritte:['Desktop „Einmaligen Beitrag anlegen", Handy „Beitrag anlegen" → „Einmaliger Beitrag". Dialog „Einmaligen Beitrag anlegen".','„Betrag (€)", Personen auswählen: Abschnitte „Spieler (n ausgewählt)" und „Trainer und Betreuer (n ausgewählt)" mit Knöpfen zum Alle-Auswählen.','Abbrechen, dann speichern (Meldung „Einmalige Beiträge angelegt"). Posten erscheinen in der Übersicht (KAS-02).'],unklar:!1,entfallen:!1},{id:"KAS-10",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Beiträge zuordnen",rollen:["TRA","SPI-K","FT"],geraete:["desktop","android","ios"],schritte:['Auf der Beitragskarte „Zuordnungen". Dialog „Beiträge zuordnen": Spieler („n zugeordnet") und „Trainer und Betreuer" abhaken, Alle-Knöpfe nutzen.','Speichern (Meldung „Zuordnungen gespeichert"). Karte zeigt neue Personenzahl. Danach erneut öffnen und abbrechen.','Als Spieler die Zeile „Du bist diesem Monatsbeitrag zugeordnet" / „… nicht zugeordnet" prüfen (siehe KAS-15).'],unklar:!1,entfallen:!1},{id:"KAS-11",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Ein- & Auszahlungen: Kassenbuch lesen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Seite „Ein- & Auszahlungen" („Ein- und Auszahlungen"): Einträge nach Monat gruppiert, mit Typ, Betrag, Beschreibung, „Erfasst von …" und Bearbeitungshinweis.','Einträge, die aus bezahlten Posten stammen, zeigen die verknüpften Posten (Sammelzahlung). Fehlerfall „Die Buchungen konnten nicht geladen werden.".',"Ohne Kassenwart-Rolle keine Knöpfe."],unklar:!1,entfallen:!1},{id:"KAS-12",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Neue Bewegung buchen, bearbeiten, löschen, Einzahlung rückgängig",rollen:["TRA","SPI-K","FT"],geraete:["desktop","android","ios"],schritte:['Desktop „Neue Bewegung", Handy runder Knopf „Neue Bewegung". Dialog „Neue Ein- oder Auszahlung": „Typ" (Einzahlung / Auszahlung), „Betrag (€)", „Datum", „Beschreibung (optional)". Abbrechen, dann „Anlegen" (Meldung „Bewegung angelegt"). Kassenstand ändert sich.','Frei erfasste Bewegung: „Bearbeiten" (Titel „Ein- oder Auszahlung bearbeiten", Meldung „Bewegung gespeichert") und „Löschen" (Frage „Bewegung löschen?").','Einzahlung aus bezahlten Posten: Knopf „Rückgängig" (Frage „Einzahlung rückgängig machen?", Posten werden wieder offen; Meldung „Einzahlung rückgängig gemacht"). Bearbeiten/Löschen ist für solche Einträge nicht möglich.'],unklar:!1,entfallen:!1},{id:"KAS-13",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Zahlungsdaten für Spieler hinterlegen",rollen:["TRA","SPI-K","FT"],geraete:["desktop","android","ios"],schritte:['Desktop: Knopf „Zahlungsdaten hinterlegen" (ohne Daten, grün mit Text) bzw. rundes Symbol „Zahlungsdaten für Spieler" (mit Daten) oben. Handy: Menü „⋯" („Weitere Aktionen") → „Zahlungsdaten hinterlegen" bzw. „Zahlungsdaten für Spieler".','Dialog „Zahlungsdaten für Spieler": „PayPal.Me-Link (optional)" mit Hilfe-Symbol „Was ist ein PayPal.Me-Link?", „Kontoinhaber (SEPA)", „IBAN" (ungültige IBAN: „Ungültige IBAN – bitte Prüfziffer und Länge prüfen."), „BIC (optional)".','Abbrechen, dann speichern (Meldung „Zahlungsdaten gespeichert"). Danach muss ein Spieler in KAS-15 „Jetzt bezahlen" mit diesen Daten sehen.',"Owner/Admin/SL ohne Kassenwart-Rolle sehen diesen Knopf nicht."],unklar:!1,entfallen:!1},{id:"KAS-14",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Kassenwart bestimmen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Desktop: Knopf „Kassenwart bestimmen" oben. Handy: Menü „⋯" → „Kassenwart bestimmen". Sichtbar für Owner, Admin, Trainer (nicht für SPI, SL, FT, auch nicht für einen Spieler-Kassenwart).','Dialog „Kassenwart bestimmen": Suchfeld „Person suchen...", Abschnitte „Spieler" (aktive Spieler der Mannschaft ohne ausgeliehene) und „Mitarbeiter" (Trainer/Betreuer der Mannschaft), je Person ein Schalter.','Einen Spieler und einen Mitarbeiter einschalten (Meldung „Kassenwart hinzugefügt"), wieder ausschalten (Meldung „Kassenwart entfernt"). Der letzte Kassenwart lässt sich nicht abschalten (Schalter gesperrt).',"Gegenprobe: Teamseite zeigt das Kassenwart-Symbol (KAD-01/KAD-03). Person muss ein App-Konto haben, sonst kann sie nichts bearbeiten. Anmeldung als der neue Kassenwart: Bearbeiten-Knöpfe erscheinen (KAS-17).","Alternativ schaltet der Owner/Trainer den Kassenwart auch im Steckbrief-Dialog (SPP-02) oder in der Teamliste (KAD-03/KAD-07)."],unklar:!1,entfallen:!1},{id:"KAS-15",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Spieler: Kasse lesen und bezahlen",rollen:["SPI"],geraete:["desktop","android","ios"],schritte:['Menü „Mannschaftskasse" (nur Spieler und Funktionsteam haben ihn in der Seitenleiste). Es gilt die Mannschaft der Mannschaftswahl bzw. das Stammteam.','Alle vier Abschnitte ansehen. Keine Plus-Knöpfe, kein „Kassenwart bestimmen", keine Aktionen an Posten. Eigene Zeile zuoberst mit Etikett „Du" und vorausgewählt.','Auf der eigenen Person bei offenen Beträgen: Knopf „Jetzt bezahlen". Sheet „Jetzt bezahlen" („Offene Posten für …: Betrag"): PayPal-Knopf „Mit PayPal zahlen (Betrag)", Überweisungsdaten „Empfänger", „IBAN", „Betrag", „Verwendungszweck" mit Kopieren-Symbolen (Meldung „… kopiert"), QR-Code „EPC-QR-Code für SEPA-Überweisung". Ohne Daten: „Für diese Mannschaft sind noch keine Zahlungsdaten hinterlegt. Bitte den Kassenwart.".','„Ich habe bezahlt": Meldung „Zahlung gemeldet", Etikett „Zahlung gemeldet" am Posten; danach Knopf zeigt „Bereits gemeldet". Der Kassenwart bekommt Push (nur Handy). QR-Code mit einer Banking-App einscannen (nur Handy, optional).','Beitragsregeln: „Du bist diesem Monatsbeitrag (nicht) zugeordnet". Wechsel der Mannschaft bei Aushilfe: Kasse folgt dem Umschalter.','Hinweis: Als Spieler in der Liste auf eine andere Person tippen und prüfen, ob dort ebenfalls „Jetzt bezahlen" erscheint (Code erlaubt es für Nicht-Kassenwarte, siehe Unklarheiten).'],unklar:!1,entfallen:!1},{id:"KAS-16",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Kassenwart-Zahlungsmeldung prüfen und buchen",rollen:["TRA","SPI-K","FT"],geraete:["desktop","android","ios"],schritte:['Nach KAS-15 mit zweitem Gerät/Konto: Posten mit „Zahlung gemeldet" in der Übersicht öffnen.','Als bezahlt buchen (einzeln oder „Alle als bezahlt"), Etikett verschwindet, Einzahlung im Kassenbuch (KAS-11).','Der Spieler erhält Push „Bezahlung erfasst" (nur Handy). Test nur mit zwei Konten möglich.'],unklar:!1,entfallen:!1},{id:"KAS-17",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"Spieler als Kassenwart: was sich ändert",rollen:["SPI-K"],geraete:["desktop","android","ios"],schritte:['Spieler als Kassenwart eintragen lassen (KAS-14), dann mit dessen Konto anmelden, Menü „Mannschaftskasse".','Es erscheinen: „Strafe hinzufügen", „Neues Vergehen", Beitrags-Knöpfe, „Neue Bewegung", Zahlungsdaten-Knopf, Haken-/⋮-Menü an Posten, „Alle als bezahlt". Es fehlt „Kassenwart bestimmen".','Auf der eigenen Person erscheint zusätzlich „Jetzt bezahlen" (auf fremden Personen nicht, solange man Kassenwart ist).',"Kassenwart-Symbol in der Teamliste/im Profil bei diesem Spieler ist nicht für ihn selbst sichtbar, weil Spieler die Teamliste nicht haben. Mit zwei Mannschaften: Rechte gelten nur für die Mannschaft, für die er Kassenwart ist (Mannschaft wechseln, Knöpfe fehlen)."],unklar:!1,entfallen:!1},{id:"KAS-18",bereich:"KAS",bereichName:"Mannschaftskasse",titel:"SL, FT, TRA und OWN ohne Kassenwart-Rolle: nur lesen",rollen:["OWN","TRA","SL","FT"],geraete:["desktop","android","ios"],schritte:['SL: über Hub „Mannschaftskasse" → Kasse öffnen. Alle Abschnitte lesbar, keine Bearbeiten-Knöpfe, kein „Kassenwart bestimmen" (nur Owner/Admin/Trainer dürfen das).','FT: Menü „Mannschaftskasse" in der Seitenleiste. Lesen wie SPI, aber ohne Spielerzeile „Du" und ohne „Jetzt bezahlen" (FT ist kein Spieler). Wird ein FT-Mitarbeiter als Kassenwart eingetragen, bekommt er die Bearbeiten-Knöpfe wie in KAS-17.','TRA und OWN ohne Kassenwart-Eintrag: lesen plus „Kassenwart bestimmen". TRA kann nur Mannschaften bearbeiten, die er selbst betreut.','Handy: Menü „⋯" enthält nur die für die Rolle erlaubten Einträge, der runde Knopf in der Kopfleiste fehlt ohne Kassenwart-Recht.'],unklar:!1,entfallen:!1},{id:"MAT-01",bereich:"MAT",bereichName:"Materialdienst",titel:"Materialdienst einrichten",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Hub (TMH-04) → „Jetzt einrichten" oder „Zum Materialdienst" bei einer Mannschaft ohne Dienst. Karte „Materialdienst einrichten" (Hinweis zur zufälligen, gleichmäßigen Verteilung des Kaders).','Umschalter „Gruppen festlegen über": „Anzahl Gruppen" (Auswahl 2 bis 6) oder „Gruppengröße" (Auswahl „Spieler pro Gruppe" 2 bis 8). Vorschau-Text („→ ergibt … ") prüfen.','„Wechsel-Rhythmus": „Wöchentlich" oder „Alle 2 Wochen". „Startwoche (beginnt montags)": Auswahl, erste Option „Diese Woche".','Ohne aktiven Kader: Knopf gesperrt, Hinweis „Kein aktiver Kader gefunden — zuerst Spieler anlegen.".','„Materialdienst anlegen" (Meldung „Materialdienst angelegt"). Tabs „Plan", „Gruppen", „Aufgaben" erscheinen. Ohne gewählte Mannschaft: „Bitte zuerst eine Mannschaft auswählen.".'],unklar:!1,entfallen:!1},{id:"MAT-02",bereich:"MAT",bereichName:"Materialdienst",titel:'Tab „Plan" lesen (Liste)',rollen:["OWN","TRA","SL"],geraete:["desktop","android","ios"],schritte:['Tab „Plan": Gruppe „Diese Woche" (Kalenderwoche, Zeitraum, Gruppenname, Mitglieder mit Pfeil-Symbol bei Spielern, die gerade ausleihen) und darunter Wochen nach Monaten. Zeilen mit „Pause", „Niemand ist dran", „Noch nicht gestartet", Chips „getauscht" und „Kein Training".','Knopf „Weitere Wochen anzeigen" mehrfach drücken.',"Als SL: Zeilen nicht antippbar, keine Zahnrad-Einstellungen.",'Hinweis: bei Gruppen ohne Mitglieder „Keine Spieler zugeteilt".'],unklar:!1,entfallen:!1},{id:"MAT-03",bereich:"MAT",bereichName:"Materialdienst",titel:'Plan ändern: „Wer ist dran?"',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Woche in der Liste antippen: Fenster mit Kalenderwoche und Zeitraum, Auswahl „Wer ist dran?" (alle Gruppen, die Gruppe laut Plan trägt „laut Plan") und „Pause" („Niemand ist dran, die Reihe rückt nicht weiter").','Andere Gruppe wählen und bestätigen (Handy: Haken oben rechts; Desktop unter 1280 px: Dialog mit „Abbrechen" und „Speichern"). Zeile bekommt „getauscht". Danach „Pause" wählen, anschließend die Plan-Gruppe wählen (hebt die Ausnahme auf).',"Fenster schließen ohne Änderung.","Vergangene und nicht gestartete Wochen sind nicht antippbar."],unklar:!1,entfallen:!1},{id:"MAT-04",bereich:"MAT",bereichName:"Materialdienst",titel:"Plan als Tabelle (Desktop ab 1280 px Breite)",rollen:["OWN","TRA"],geraete:["desktop"],schritte:['Fenster auf mindestens 1280 px Breite: links „Diese Woche", rechts Gruppe „Nächste Wochen" als Tabelle mit Spalten „Zeitraum", „Wer ist dran", „Spieler". Fenster verkleinern: Wechsel zurück auf die Liste (MAT-02).','Zeile anklicken (Beschriftung „KW … ändern"): Popover „Wer ist dran in KW …?" mit Gruppen und „Pause". Wahl speichert sofort, Meldung „KW …: Gruppe" mit „Rückgängig". „Rückgängig" testen.','„Weitere Wochen anzeigen" unter der Tabelle.'],unklar:!1,entfallen:!1},{id:"MAT-05",bereich:"MAT",bereichName:"Materialdienst",titel:'Tab „Gruppen" (Liste): Gruppe anlegen, bearbeiten, löschen',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Tab „Gruppen": Gruppe „Gruppen" mit Nummernkachel, Name, Chip „Diese Woche", Mitgliedernamen. Leere Gruppe: „Noch niemand drin – wird trotzdem eingeplant". Ganz leer: „Noch keine Gruppen" mit „Erste Gruppe anlegen".','„Hinzufügen": Fenster „Neue Gruppe" mit Feld „Name" (vorbelegt „Gruppe n") und Spielerliste mit Häkchen; Blöcke „Noch in keiner Gruppe" und „Aus anderen Gruppen holen"; Zähler „n drin". „Gruppe anlegen" (zuerst Abbrechen testen).','Bestehende Gruppe antippen: Fenster mit dem Gruppennamen, Spieler an-/abhaken, speichern. „Löschen" (Frage „… löschen?", abbrechen und bestätigen).'],unklar:!1,entfallen:!1},{id:"MAT-06",bereich:"MAT",bereichName:"Materialdienst",titel:"Spieler einer Gruppe zuteilen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Falls vorhanden Gruppe „Noch in keiner Gruppe" (Zähler): Zeile mit Chip „Zuteilen" antippen. Fenster mit Spielername und „In welche Gruppe?" (Auswahl der Gruppen). Gruppe wählen, speichern.',"Spieler erscheint in der Gruppe, Warnzeile im Hub (TMH-04) verschwindet.","Spieler mit Aushilfe tragen ein Etikett (AushilfeChip) – prüfen, ob sie sich trotzdem zuteilen lassen."],unklar:!1,entfallen:!1},{id:"MAT-07",bereich:"MAT",bereichName:"Materialdienst",titel:"Gruppen-Tafel mit Ziehen (Desktop ab 1280 px)",rollen:["OWN","TRA"],geraete:["desktop"],schritte:['Tab „Gruppen" ab 1280 px: links Spalte „Ohne Gruppe", rechts „Gruppen in Reihenfolge" als Karten.','Spieler aus „Ohne Gruppe" auf eine Gruppe ziehen (Meldung „Name → Gruppe"), Spieler zwischen Gruppen ziehen, Spieler auf einen anderen Spieler ziehen (Tauschen, Meldung „… ⇄ … getauscht"). Meldungen mit „Rückgängig" prüfen. Leere Gruppe zeigt „Spieler hierher ziehen".','Menü „Mehr zu <Gruppe>" an der Karte: „Bearbeiten" und „Löschen" (mit Bestätigung).','Kachel „Gruppe hinzufügen" und Knopf „Reihenfolge" (nur bei mehr als einer Gruppe, siehe MAT-08).'],unklar:!1,entfallen:!1},{id:"MAT-08",bereich:"MAT",bereichName:"Materialdienst",titel:"Reihenfolge der Gruppen ändern",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Tab „Gruppen" → „Reihenfolge" (nur bei mehr als einer Gruppe). Fenster „Reihenfolge" mit Liste „Reihenfolge der Gruppen" (Griff, Nummern, Mitglieder).','Gruppen ziehen oder „… verschieben" nutzen. Block „Das ändert sich" zeigt die betroffenen Wochen (alt durchgestrichen → neu), „diese Woche" hervorgehoben, „und weitere Wochen".','„Reihenfolge speichern" (zuerst Abbrechen/Schließen testen). Plan-Tab prüfen.'],unklar:!1,entfallen:!1},{id:"MAT-09",bereich:"MAT",bereichName:"Materialdienst",titel:'Tab „Aufgaben": Aufgaben anlegen',rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Tab „Aufgaben": Hinweis „Die Gruppe, die dran ist, sieht diese Aufgaben auf ihrer Übersicht.". Leerzustand „Noch keine Aufgaben" mit „Erste Aufgabe anlegen" (Beispiele im Text: Bälle mitbringen, Hütchen aufbauen).','„Hinzufügen": Fenster „Neue Aufgabe": Feld „Neue Aufgabe", Symbol-Kachel antippen öffnet das Symbolraster (Symbol wird beim Tippen automatisch erkannt), „Weitere Aufgabe" für mehrere Zeilen (dann Titel „Neue Aufgaben", „Aufgabe 2 entfernen").','Abbrechen, dann „Aufgabe speichern" bzw. „Aufgaben speichern".'],unklar:!1,entfallen:!1},{id:"MAT-10",bereich:"MAT",bereichName:"Materialdienst",titel:"Aufgaben bearbeiten, sortieren, löschen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Aufgabe antippen: Fenster „Aufgabe bearbeiten": Text ändern, „Symbol" wählen, speichern; Abbrechen; Löschen mit Bestätigung.','Reihenfolge per Griff rechts („Aufgabe n verschieben") ziehen (Maus oder Finger). Reihenfolge bleibt nach Neuladen.',"Kontrolle in der Übersicht der aktuell dran seienden Gruppe (siehe MAT-13)."],unklar:!1,entfallen:!1},{id:"MAT-11",bereich:"MAT",bereichName:"Materialdienst",titel:"Einstellungen des Materialdienstes",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Zahnrad „Einstellungen" neben dem Titel (nur wenn schon ein Dienst existiert und bearbeitet werden darf).','Fenster „Materialdienst-Einstellungen": „Wechsel-Rhythmus" (Wöchentlich / Alle 2 Wochen), „Startwoche (Montag)" (Option „Aktuell: …"). Speichern: Meldung „Einstellungen gespeichert — der Plan wurde neu berechnet", Plan-Tab prüfen. Abbrechen testen.','„Materialdienst löschen" (Löschenknopf): Frage „Materialdienst wirklich löschen?" (Gruppen, Zuordnungen, Ausnahmen gehen verloren), abbrechen; echtes Löschen nur mit Testmannschaft (Meldung „Materialdienst gelöscht", danach Einrichtungs-Ansicht).'],unklar:!1,entfallen:!1},{id:"MAT-12",bereich:"MAT",bereichName:"Materialdienst",titel:"Materialdienst: SL nur lesen",rollen:["SL"],geraete:["desktop","android","ios"],schritte:['Hub → „Materialdienst". Mit eingerichtetem Dienst sind die Tabs „Plan", „Gruppen", „Aufgaben" sichtbar.','Ohne Materialdienst: nur der Hinweis „Für diese Mannschaft ist noch kein Materialdienst eingerichtet.", keine Tabs. Kein Zahnrad.','Plan: Zeilen nicht antippbar. Gruppen: keine „Hinzufügen"-, „Reihenfolge"-Knöpfe, keine Zuteilen-Zeilen, leere Gruppen „Noch niemand drin". Aufgaben: Hinweis „Diese Aufgaben hat die Gruppe, die gerade dran ist.", keine Knöpfe.',"Ziehen ist bei SL gesperrt (Desktop ab 1280 px prüfen)."],unklar:!1,entfallen:!1},{id:"MAT-13",bereich:"MAT",bereichName:"Materialdienst",titel:"Spieler und FT: Materialdienst sehen, ohne die Seite zu haben",rollen:["SPI","FT"],geraete:["desktop","android","ios"],schritte:['Menü „Teammanagement" fehlt, Direktaufruf von /app/team-management/materialdienst wird abgewiesen.','SPI: In der Übersicht (Kalender und Block „Als Nächstes") erscheint der Materialdienst der eigenen Gruppe, Detailfenster „Materialdienst" mit „Du bist dran", Mitgliedern (Abwesende markiert) und Gruppe „Aufgaben". Prüfen, wenn die Gruppe des Spielers dran ist.','FT: prüfen, ob der Materialdienst im Kalender der Übersicht erscheint (ohne „Du bist dran"); der Block „Als Nächstes" zeigt ihn nur Spielern.'],unklar:!1,entfallen:!1},{id:"SCH-01",bereich:"SCH",bereichName:"Bewertungen / Scouting-Hub",titel:"Bewertungen-Hub ansehen und Gruppen öffnen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:['Menü „Bewertungen" öffnen: Titel „Bewertungen", vier Gruppen (Desktop: links Spielerbewertungen + Mannschaftsberichte, rechts Bewertungskriterien + Meine Favoriten; mobil untereinander)','Gruppe „Spielerbewertungen": Netzdiagramm, Reiter „Offensiv" / „Defensiv" umschalten, Legende mit Namen/Datu
