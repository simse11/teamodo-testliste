ürfen wieder Abwesenheiten selbst anlegen.“; nur der Schalter reagiert, nicht die Zeile","Wirkung als Spieler wie ABW-08 (Knopf „Abwesenheit eintragen“ verschwindet bzw. kommt wieder); danach zurückstellen","Andere Mannschaft oben wählen: der Schalter zeigt deren Einstellung","Management-Hub: kein Zahnrad „Einstellungen“ mehr neben dem Titel","Profil: die Einstellung je Mannschaft steht dort weiter und zeigt nach dem Umschalten auf der Seite denselben Stand","SL: sieht den Schalter nicht","Offline öffnen bzw. Laden schlägt fehl: statt eines Schalters „Die Einstellung konnte nicht geladen werden.“ mit „Erneut versuchen“; der Schalter steht schon da, während die Liste noch lädt"],unklar:!1,entfallen:!1,bezug:"ABW-07, TMH-02 · B3-09 · PR #607",nachtest:!0},{id:"NT-127",bereich:"ABW",bereichName:"Abwesenheiten",titel:"Spieler: Seitentitel „Abwesenheiten“",rollen:["SPI"],geraete:["desktop","android","ios"],schritte:["Als Spieler „Meine Abwesenheiten“ (mobile Leiste „Abwesend“) öffnen: der Titel heißt „Abwesenheiten“ und ist auf dem Handy nicht mehr abgeschnitten","Menü und Seitenleiste heißen weiter „Meine Abwesenheiten“"],unklar:!1,entfallen:!1,bezug:"ABW-08 · B3-10, B1-08 · PR #607",nachtest:!0},{id:"NT-128",bereich:"TRN",bereichName:"Training",titel:"Abgesagte Spiele nicht im Trainingsplan und in der Platzbelegung",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Eine Mannschaft wählen, die in den letzten oder nächsten Wochen ein abgesetztes bzw. abgesagtes Spiel hat (fussball.de: „Absetzung“, „Absage“, „Ausfall“, ohne Ergebnis)","Trainingsplan („Letzte“ und „Nächste“): das abgesagte Spiel fehlt, alle anderen Spiele stehen wie bisher da","Platzbelegung, Woche des Spiels: hatte das Spiel einen Platz, belegt es ihn nicht mehr; ein Spiel mit Ergebnis (Status nur stehengeblieben) bleibt sichtbar","„Spiele ohne Platz“ in der Platzbelegung zeigt das abgesagte Spiel wie bisher nicht"],unklar:!1,entfallen:!1,bezug:"TRN-02 · B4-03 · PR #609",nachtest:!0},{id:"NT-129",bereich:"TRN",bereichName:"Training",titel:"Neues Training: Standard „Einmalig“",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["„Neues Training“ öffnen (Trainings-Hub, Trainingsplan, Kalender der Übersicht): links steht „Einmalig“ und ist gewählt, rechts „Jede Woche“","Ohne Umschalten anlegen: genau ein Training","Auf „Jede Woche“ umschalten: „Bis“ steht auf dem Saisonende, Serie anlegen wie bisher","Dialog schließen und neu öffnen: wieder „Einmalig“"],unklar:!1,entfallen:!1,bezug:"TRN-04 · B4-05 · PR #609",nachtest:!0},{id:"NT-130",bereich:"TRN",bereichName:"Training",titel:"Gastspieler ohne Profil (gründlich auf Android)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training öffnen, Reiter „Spieler“ → „Gastspieler“: unter dem Suchfeld steht schon vor dem Tippen „Ohne Profil“ mit dem Hinweis „Namen oben eintippen, um jemanden ohne Profil einzutragen …“ (nicht antippbar)","Einen Namen tippen, der keinem Spieler gehört: die Zeile wird zu „„Name“ als Gast eintragen“; antippen, optional Notiz, „Hinzufügen“: der Gast steht unter „Gastspieler“ mit „Ohne Profil“","Dasselbe mit Enter bzw. „Fertig“ auf der Tastatur statt Antippen","Einen Spieler mit Profil wählen wie bisher","Gast wieder entfernen wie bisher"],unklar:!1,entfallen:!1,bezug:"TRN-12 · B4-07 · PR #609",nachtest:!0},{id:"NT-131",bereich:"TRN",bereichName:"Training",titel:"Übungen nach dem Training nachtragen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Ein vergangenes Training ohne Ablauf öffnen, Reiter „Ablauf“: „Noch keine Übungen“ mit „Trage nach, was ihr gemacht habt, und bewerte die Übungen.“ und dem Knopf „Ersten Block hinzufügen“","Eine Übung aus der Sammlung und einen Freitext-Block hinzufügen: beide stehen im Ablauf, gleich mit „Bewerten“ in der Fußzeile","Oben „Hinzufügen“ und ein Tipp auf die freie Fläche der Spur fügen ebenfalls hinzu","Bewerten, über das Menü „…“ → „Teams einteilen“, danach Sieger festlegen","Freitext-Block antippen: öffnet „Bearbeiten“, auch nach dem Training","Ein künftiges Training: alles wie bisher"],unklar:!1,entfallen:!1,bezug:"TRN-13 · B4-08 · PR #609",nachtest:!0},{id:"NT-132",bereich:"TRN",bereichName:"Training",titel:"Ablauf: Rahmen beim Ziehen rechts sichtbar",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training mit mehreren Übungen, Reiter „Ablauf“: mit der Maus über einen Block fahren, der bis zum rechten Rand geht: der dünne grüne Rahmen ist rundum zu sehen, auch rechts","Einen Block ziehen: der grüne Rahmen des gezogenen Blocks ist rundum zu sehen","Zwei Übungen nebeneinander (gleiche Zeit): beide Rahmen ganz"],unklar:!1,entfallen:!1,bezug:"TRN-14 · B4-09 · PR #609",nachtest:!0},{id:"NT-133",bereich:"TRN",bereichName:"Training",titel:"Reiter „Notizen“ zeigt, ob etwas drinsteht",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training ohne Notizen öffnen: „Notizen“ ohne Punkt (Handy: Reiter; Desktop: Knopf über der Spielerliste)","Notizen eintippen, kurz warten (speichert selbst): hinter „Notizen“ erscheint ein kleiner Punkt","Text ganz löschen: der Punkt verschwindet; nur Leerzeichen zählen nicht als Inhalt"],unklar:!1,entfallen:!1,bezug:"TRN-19 · B4-11 · PR #609",nachtest:!0},{id:"NT-134",bereich:"TRN",bereichName:"Training",titel:"Ablauf: Scrollen und Wischen auf den Übungsblöcken (gründlich auf Android)",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training mit mehreren Übungen, Reiter „Ablauf“: mit dem Finger auf einem Block ansetzen und nach oben/unten wischen: die Seite scrollt (vorher stand sie still)","Seitlich wischen wechselt den Reiter neben bzw. unter den Blöcken; auf einem Block bewusst nicht (dort zieht man Blöcke)","Block kurz antippen: öffnet die Übung bzw. den Freitext wie bisher","Finger etwa eine halbe Sekunde ruhig halten, dann ziehen: der Block verschiebt sich, die Seite scrollt dabei nicht mit","Dauer am Griff unten ändern: der Block wird länger bzw. kürzer, die Seite scrollt dabei nicht mit","Dasselbe auf iOS: Ziehen und Scrollen gehen beide"],unklar:!1,entfallen:!1,bezug:"TRN-24 · B4-12 · PR #609",nachtest:!0},{id:"NT-135",bereich:"TRN",bereichName:"Training",titel:"Admin im Training wie Owner",rollen:["OWN"],geraete:["desktop","android","ios"],schritte:["Mit einem ADMIN-Konto (ohne Trainerrolle) anmelden; vorher scheiterte jedes Speichern im Training an fehlenden Rechten","Training anlegen (einmalig und als Serie), bearbeiten, verschieben, löschen","Im Ablauf eine Übung und einen Freitext-Block hinzufügen, Teams einteilen, Sieger festlegen, eine Übung aus dem Ablauf entfernen","Gastspieler mit und ohne Profil hinzufügen und wieder entfernen","Platzbelegung: Trainings lassen sich antippen und auf einen anderen Platz legen; „Trainings ohne Platz“ erscheint","Gegenprobe als Trainer: nur die eigenen Mannschaften wie bisher; als SL weiter keine Trainingsseiten"],unklar:!1,entfallen:!1,bezug:"TRN-12 · B4-07 · PR #609",nachtest:!0},{id:"NT-136",bereich:"TRN",bereichName:"Training",titel:"Neues Training im neuen Formular",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Mit mehreren Mannschaften: oben im Kopf eine Mannschaft wählen, dann Training → „Neues Training“: in der ersten Gruppe ist genau diese Mannschaft vorgewählt; ein Tipp irgendwo auf die Zeile „Mannschaft“ (auch links auf das Wort) öffnet die Liste","Mit nur einer Mannschaft (z. B. als Trainer einer Mannschaft): keine Zeile „Mannschaft“, auch kein Hinweis „Mannschaft: …“ mehr; das Training landet in dieser Mannschaft","„Wiederholung“ als zwei Chips „Einmalig“ (vorgewählt) und „Jede Woche“","Gruppe „Wann“: Datum als graue Pille (Handy: Wähler des Telefons; Desktop: `TT.MM.JJ` tippen oder Kalendersymbol daneben); „Von – bis“ als zwei Uhrzeiten (Desktop: tippen oder Uhrsymbol mit Liste im 15-Minuten-Takt); Beginn ändern zieht das Ende mit derselben Dauer mit","Zeit und Ort kommen wie bisher vom letzten Training der Mannschaft; das allein zählt nicht als Änderung (Schließen fragt dann nicht)","Handy, Gruppe „Wo“: „Ort“ ist eine ganze Zeile, ein Tipp links oder rechts öffnet die Plätze; „Anderer Ort …“ wählen: darunter erscheint „Anderer Ort“ mit Bezeichnung oben, der Cursor steht drin, getippt wird von links über die ganze Breite (auch lange Namen bleiben lesbar)","Desktop rechts: jeder Platz als eigene Zeile mit rundem Haken, „Anderer Ort …“ als letzte Zeile, das Feld darunter wie oben","„Mehr“ (Handy zugeklappt, Desktop offen): „Schwerpunkt (optional)“ und „Notizen (optional)“ mit Bezeichnung oben","„Jede Woche“: Datum heißt „Beginn“, dazu „Bis“; Termine mit Feiertag oder Spiel stehen unter „Auf diese Termine achten“ mit Schalter, nur der Schalter reagiert, nicht die Zeile","Am Desktop ein Datum falsch tippen (z. B. „45.13.“): Fehler in der Zeile, „Erstellen“ gesperrt","Etwas ändern und mit X, Runterziehen, Esc, „Abbrechen“ oder Klick daneben schließen: „Änderungen verwerfen?“; „Verwerfen“ schließt, beim nächsten Öffnen ist das Formular wieder frisch","Anlegen (einmalig und als Serie): Training(s) erscheinen wie bisher, keine Rückfrage beim Schließen"],unklar:!1,entfallen:!1,bezug:"TRN-03, TRN-04 · B4-04, B4-29, G1-16 · PR #612",nachtest:!0},{id:"NT-137",bereich:"TRN",bereichName:"Training",titel:"Training bearbeiten im neuen Formular",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Ein einzelnes Training bearbeiten: dieselben Gruppen wie beim Anlegen, ohne Mannschaft; Datum, Zeit, Ort, Schwerpunkt und Notizen sind vorausgefüllt","Öffnen und ohne Änderung schließen: keine Rückfrage","Ort auf „Anderer Ort …“ ändern und einen langen Namen tippen, speichern: der Ort steht im Training","Ein Serientermin: oben „Ändern für“ mit den Chips „Nur dieses“ und „Ganze Serie“, darunter der grüne Hinweis wie bisher; „Ganze Serie“ blendet „Mehr“ aus","Ganze Serie um einen Tag verschieben: alle Termine wandern mit (wie bisher)","Etwas ändern und schließen: „Änderungen verwerfen?“; „Weiter bearbeiten“ lässt die Eingabe stehen","Handy: „Training löschen“ als letzte Gruppe in roter Schrift; Desktop: „Löschen“ links im Fuß, rechts „Abbrechen“ und „Speichern“"],unklar:!1,entfallen:!1,bezug:"TRN-03 · B4-04, B4-29 · PR #612",nachtest:!0},{id:"NT-138",bereich:"TRN",bereichName:"Training",titel:"Training löschen: Wahl als Zeilen mit Haken",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Einen Serientermin löschen: „Nur diesen Termin“ und „Diesen und alle folgenden“ sind Zeilen mit rundem Haken rechts, ein Tipp irgendwo auf die Zeile wählt","Der rote Knopf nennt, was passiert („Training löschen“ bzw. „N Trainings löschen“), der Hinweis darunter wie bisher","Beide Wege einmal ausführen: es verschwinden genau die genannten Termine","Ein einzelnes Training löschen: kurze Frage wie bisher"],unklar:!1,entfallen:!1,bezug:"TRN-05 · G1-05 · PR #612",nachtest:!0},{id:"NT-139",bereich:"TRN",bereichName:"Training",titel:"Ablauf: Block hinzufügen im neuen Formular",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training → „Ablauf“ → „Hinzufügen“: „Was steht an?“ mit Bezeichnung oben, Cursor steht drin; beim Tippen rechts ein X zum Leeren","Eine Übung aus „Zuletzt benutzt“ bzw. den Treffern wählen: unter dem Feld „Aus deiner Sammlung“ bzw. „Aus der Teamodo-Sammlung“, die Dauer der Übung steht im Feld","„Dauer in Minuten“: die Zahl lässt sich direkt tippen; darunter Chips 5, 10, 15, 20, 30","„In Sammlung speichern“ als Schalter, nur der Schalter reagiert; an: Zeile „Foto · Hinzufügen“ erscheint, Foto wählen zeigt Name und Vorschau, X entfernt es","„Notiz · Hinzufügen“ antippen: darunter „Notiz (optional)“ zum Tippen","„Zum Ablauf hinzufügen“: Block steht unter „Schon im Ablauf“, das Feld ist wieder leer für den nächsten","Etwas tippen, aber nicht hinzufügen, und mit X oder Runterziehen schließen: „Änderungen verwerfen?“; ohne getippten Text schließt es sofort (schon Eingetragenes bleibt im Ablauf)","Haken bzw. „Fertig“ mit getipptem Text: trägt ihn noch ein und schließt, ohne Rückfrage"],unklar:!1,entfallen:!1,bezug:"TRN-13 · G1-07, G1-12 · PR #612",nachtest:!0},{id:"NT-140",bereich:"TRN",bereichName:"Training",titel:"Freitext-Block bearbeiten im neuen Formular",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Einen Freitext-Block im Ablauf antippen: „Titel“, „Bemerkungen (optional)“ und „Dauer in Minuten“ (tippbar, Chips darunter), kein Sternchen mehr","Titel leeren: Haken bzw. „Speichern“ gesperrt, beim Verlassen des Felds „Titel fehlt“ in der Zeile","Etwas ändern und runterziehen (Handy) bzw. X/Esc: „Änderungen verwerfen?“ — vorher ließ sich der Drawer gar nicht runterziehen und das X schloss still","„In Sammlung speichern“ steht als eigene Zeile unter den Feldern (kein großer Knopf mehr): legt die Übung an und verknüpft den Block wie bisher, ohne Rückfrage beim Schließen","Speichern: Titel, Bemerkungen und Dauer stehen im Block"],unklar:!1,entfallen:!1,bezug:"TRN-13 · G1-08, G1-14, G1-17 · PR #612",nachtest:!0},{id:"NT-141",bereich:"TRN",bereichName:"Training",titel:"Übung bewerten im neuen Formular",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Eine Übung im Ablauf bewerten: unter dem Titel steht der Name der Übung (auch bei einem Freitext-Block)","„Wie lief die Übung?“ mit fünf Sternen, ohne Stern ist der Haken bzw. „Speichern“ gesperrt","„Bemerkungen (optional)“ mit Bezeichnung oben, wächst beim Tippen mit","Sterne ändern und schließen: „Änderungen verwerfen?“; ohne Änderung schließt es sofort","Speichern: die Sterne stehen am Block; erneut öffnen zeigt die gespeicherte Bewertung"],unklar:!1,entfallen:!1,bezug:"TRN-13 · G1-14 · PR #612",nachtest:!0},{id:"NT-142",bereich:"TRN",bereichName:"Training",titel:"Gastspieler hinzufügen: Notiz und Verwerfen",rollen:["OWN","TRA"],geraete:["desktop","android","ios"],schritte:["Training → Spieler → „Gastspieler“: einen Gast wählen (mit oder ohne Profil); darunter „Notiz (optional)“ mit Bezeichnung oben, statt „Optional“ als Unte
